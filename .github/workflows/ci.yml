name: 점검

on:
  push:
    paths-ignore:
      - "reports/**"
      - "docs/**"
      - "data/archive/**"
      - "data/generated/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt pytest

      - name: 테스트
        run: python -m pytest

      - name: 실제 뉴스로 시험 실행(DART 없이)
        run: |
          python -m casenote daily --no-dart --no-ai --out smoke
          f=$(ls smoke/*.md | head -1)
          {
            echo "## 시험 실행 결과(뉴스만)"
            echo
            sed -n '1,16p' "$f"
            echo
            echo "### 분야별 헤드라인 일부"
            sed -n '/## 7. 분야별 헤드라인/,/## 8. /p' "$f" | head -40
          } >> "$GITHUB_STEP_SUMMARY"
          echo "분류된 기사 링크 수: $(grep -c '^- \[' "$f" || true)"
          echo "----- 시험 노트: 오늘 한눈에 -----"
          sed -n '/## 오늘 한눈에/,/## 1. /p' "$f"
          echo "----- 시험 노트: 뉴스 사례 -----"
          sed -n '/## 2. 뉴스로 보는/,/## 3. /p' "$f" | head -150
          echo "----- 시험 노트: 전공 수업 앞부분 -----"
          sed -n '/## 4. 오늘의 전공 수업/,/## 5. /p' "$f" | head -40

      - name: 시험 결과 보관
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: smoke/
          retention-days: 7
