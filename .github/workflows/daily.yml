name: 매일 케이스 노트

on:
  schedule:
    - cron: "30 21 * * 0-4"   # 한국시간 월~금 06:30 (전날 공시와 뉴스)
    - cron: "0 23 * * 5"      # 한국시간 토 08:00 (주간 복습)
  workflow_dispatch:
    inputs:
      task:
        description: "작업: daily / weekly / scale / company"
        required: false
        default: daily
      company:
        description: "company 작업일 때 회사 이름 또는 종목코드"
        required: false
      date:
        description: "daily·weekly 작업을 특정 날짜로 다시 만들 때(예: 2026-11-20). 비우면 오늘"
        required: false

permissions:
  contents: write

concurrency:
  group: casenote
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 실행을 누른 시점이 아니라 지금의 최신 커밋에서 시작한다(앞선 실행이 만든 노트 위에 이어서 쓰기)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # 앱 서명 키 캐시는 7일 넘게 안 쓰면 지워진다. 매일 한 번 읽어 두어 앱 업데이트(같은 키로 서명)가 계속 되게 한다.
      - name: 앱 서명 키 보존
        uses: actions/cache/restore@v6
        with:
          path: ~/.casenote-signing
          key: casenote-signing-v1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: DART 캐시 불러오기
        uses: actions/cache@v6
        with:
          path: .cache
          key: casenote-cache-${{ github.run_id }}
          restore-keys: casenote-cache-

      - name: 노트 만들기
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_TASK: ${{ github.event.inputs.task }}
          INPUT_COMPANY: ${{ github.event.inputs.company }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          TASK="${INPUT_TASK:-daily}"
          if [ "$SCHEDULE" = "0 23 * * 5" ]; then TASK=weekly; fi
          DATE_ARG=""
          if [ -n "$INPUT_DATE" ]; then
            case "$INPUT_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) DATE_ARG="--date $INPUT_DATE" ;;
              *) echo "날짜 형식은 YYYY-MM-DD: $INPUT_DATE"; exit 1 ;;
            esac
          fi
          case "$TASK" in
            daily)   python -m casenote daily $DATE_ARG ;;
            weekly)  python -m casenote weekly $DATE_ARG ;;
            scale)   python -m casenote scale ;;
            company) python -m casenote company "$INPUT_COMPANY" ;;
            *) echo "알 수 없는 작업: $TASK"; exit 1 ;;
          esac

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in reports docs data/archive data/generated; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "케이스 노트 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 그사이 다른 실행이 같은 날 노트를 올렸으면 이번 실행 결과를 우선해 합친다(-X theirs: 되짚는 내 커밋 쪽)
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::결과를 저장(push)하지 못했습니다. 잠시 뒤 다시 실행해 주세요."
            exit 1
          fi
