name: 안드로이드 앱

# android/ 폴더가 바뀌면 앱을 새로 빌드해 Releases의 'app-latest'에 casenote.apk로 올린다.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 서명 키는 저장소에 올리지 않고 Actions 캐시에만 둔다. 같은 키로 서명해야 휴대폰에서 덮어 설치(업데이트)가 된다.
      - name: 서명 키 불러오기
        id: signing
        uses: actions/cache@v6
        with:
          path: ~/.casenote-signing
          key: casenote-signing-v1

      - name: 서명 키 만들기(처음 한 번)
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.casenote-signing
          PASS=$(openssl rand -hex 24)
          printf '%s' "$PASS" > ~/.casenote-signing/password
          keytool -genkeypair -keystore ~/.casenote-signing/release.jks -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" -alias casenote -keyalg RSA -keysize 2048 \
            -validity 36500 -dname "CN=CaseNote, O=Personal, C=KR"

      - name: 앱 테스트와 빌드
        working-directory: android
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then export JAVA_HOME="$JAVA_HOME_17_X64"; fi
          PASS=$(cat ~/.casenote-signing/password)
          echo "::add-mask::$PASS"
          export CASENOTE_KEYSTORE="$HOME/.casenote-signing/release.jks"
          export CASENOTE_KEYSTORE_PASSWORD="$PASS"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk casenote.apk
          TAG=app-latest
          NOTES="휴대폰에서 아래 casenote.apk를 눌러 내려받아 설치합니다. 버전 1.0.${GITHUB_RUN_NUMBER} ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 빌드)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "케이스 노트 앱" --notes "$NOTES" --target "$GITHUB_REF_NAME"
          fi
          gh release upload "$TAG" casenote.apk --clobber
          echo "내려받기: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/casenote.apk"
