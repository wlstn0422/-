# 돈 감각 기준표
# 금액 단위: 원. 기준 시점과 근거를 같이 적어 두었으니, 해가 바뀌면 숫자만 고치면 된다.
as_of: "2026-11"
note: "법령·기준은 바뀔 수 있다. 실무 문서에 쓰기 전에는 원문을 다시 확인할 것."

# 규모 판정에 쓰는 기준선(규모 진단 계산에 직접 쓰인다)
thresholds:
  external_audit_single: 50000000000        # 외부감사 대상 단일 기준: 자산 또는 매출 500억원 이상
  sme_revenue_low: 40000000000              # 중소기업 매출 상한 중 가장 낮은 업종 기준(400억원)
  sme_revenue_high: 150000000000            # 중소기업 매출 상한 중 가장 높은 업종 기준(1,500억원)
  sme_asset_cap: 500000000000               # 중소기업 자산총액 상한(5,000억원)
  large_listed_assets: 2000000000000        # 대규모 상장회사·대규모법인(자산 2조원)
  disclosure_group_assets: 5000000000000    # 공시대상기업집단(그룹 합산 자산 5조원)
  cross_holding_group_assets: 12000000000000  # 상호출자제한기업집단(GDP의 0.5%, 2026년 약 12조원대)

# 자산 기준 사다리: 법과 제도가 달라지는 지점
asset_ladder:
  - amount: 12000000000
    label: "자산 120억원"
    meaning: "외부감사 대상 판단 4개 요건(자산 120억, 부채 70억, 매출 100억, 종업원 100명) 중 하나"
  - amount: 50000000000
    label: "자산 500억원"
    meaning: "이것만 넘어도 외부감사 대상(매출 500억원도 같음, 외부감사법 시행령 제5조)"
  - amount: 500000000000
    label: "자산 5,000억원"
    meaning: "넘으면 매출과 관계없이 중소기업이 아님(중소기업기본법). 공정거래법상 지주회사 자산 요건도 5,000억원"
  - amount: 2000000000000
    label: "자산 2조원"
    meaning: "대규모 상장회사: 감사위원회 의무, 사외이사 과반, 집중투표제 의무화(2차 상법 개정). 실적 변동 공시 기준도 30%에서 15%로 엄격해짐"
  - amount: 5000000000000
    label: "자산 5조원(그룹 합산)"
    meaning: "공시대상기업집단. 2026년 5월 102개 집단 지정"
  - amount: 12000000000000
    label: "자산 약 12조원대(그룹 합산)"
    meaning: "상호출자제한기업집단. 기준이 GDP의 0.5%로 연동돼 매년 바뀐다"

# 매출 기준 감각(법적 기준 + 실무 감각)
revenue_ladder:
  - amount: 10000000000
    label: "매출 100억원"
    meaning: "외부감사 4개 요건 중 하나. 직원 수십 명 규모 회사에서 흔한 숫자"
  - amount: 40000000000
    label: "매출 400억~1,500억원"
    meaning: "업종별 중소기업 매출 상한(3년 평균, 중소기업기본법 시행령 별표1). 넘으면 중견기업으로 간다"
  - amount: 50000000000
    label: "매출 500억원"
    meaning: "이것만 넘어도 외부감사 대상"
  - amount: 1000000000000
    label: "매출 1조원"
    meaning: "흔히 말하는 '1조 클럽'. 업종 대표 중견·대기업 계열사 수준"
  - amount: 10000000000000
    label: "매출 10조원"
    meaning: "국내 업종 1위급 대기업"
  - amount: 100000000000000
    label: "매출 100조원 이상"
    meaning: "국내 최상위 극소수"

# 생활·나라 살림 기준점(큰 숫자를 체감하는 비교 대상)
anchors:
  - key: national_budget_2026
    label: "2026년 정부 본예산"
    amount: 727900000000000
    source: "2025년 12월 2일 국회 통과"
  - key: min_wage_hour_2026
    label: "2026년 최저임금(시간급)"
    amount: 10320
    source: "최저임금위원회 의결. 월 209시간 기준 2,156,880원"
  - key: min_wage_month_2026
    label: "2026년 최저임금 월 환산액(209시간)"
    amount: 2156880
    source: "주 40시간, 주휴 포함"

# 세율 기준(사업연도 개시일 기준)
corporate_tax:
  - from_year: 2012
    brackets: [[200000000, 0.10], [20000000000, 0.20], [null, 0.22]]
  - from_year: 2018
    brackets: [[200000000, 0.10], [20000000000, 0.20], [300000000000, 0.22], [null, 0.25]]
  - from_year: 2023
    brackets: [[200000000, 0.09], [20000000000, 0.19], [300000000000, 0.21], [null, 0.24]]
  - from_year: 2026
    brackets: [[200000000, 0.10], [20000000000, 0.20], [300000000000, 0.22], [null, 0.25]]
local_income_tax_rate: 0.10   # 법인지방소득세: 법인세의 10% 수준

tax_notes:
  - "2026년 이후 시작하는 사업연도 법인세율: 과세표준 2억원 이하 10%, 200억원 이하 20%, 3,000억원 이하 22%, 3,000억원 초과 25%(지방소득세 별도)"
  - "증권거래세(2026년~): 코스피 0.20%(거래세 0.05% + 농어촌특별세 0.15%), 코스닥 0.20%"
  - "고배당 상장사 배당소득 분리과세(2026년 배당분~): 2,000만원 이하 14%, 3억원 이하 20%, 50억원 이하 25%, 50억원 초과 30%"

# 기준표에서 내는 퀴즈
quiz:
  - q: "공시대상기업집단으로 지정되는 기준(그룹 소속 국내 회사 자산총액 합계)은?"
    choices: ["1조원", "2조원", "5조원", "10조원"]
    answer: 2
    explain: "공정거래법 제31조. 2026년 5월 기준 102개 집단이 지정됐다."
  - q: "다른 조건과 관계없이 이것 하나만 넘어도 외부감사 대상이 되는 자산(또는 매출) 기준은?"
    choices: ["100억원", "120억원", "500억원", "1,000억원"]
    answer: 2
    explain: "외부감사법 시행령 제5조. 이보다 작으면 4개 요건(자산 120억, 부채 70억, 매출 100억, 종업원 100명) 중 2개 이상이면 대상."
  - q: "2026년 이후 시작하는 사업연도의 법인세 최고세율(지방소득세 제외)은?"
    choices: ["22%", "24%", "25%", "27.5%"]
    answer: 2
    explain: "2025년 12월 개정으로 전 구간 1%p 인상. 지방소득세까지 더하면 27.5%."
  - q: "자산총액이 얼마 이상이면 매출과 관계없이 중소기업이 아닐까?"
    choices: ["1,000억원", "3,000억원", "5,000억원", "1조원"]
    answer: 2
    explain: "중소기업기본법 시행령 제3조의 자산 상한 기준."
  - q: "2026년 정부 본예산(총지출) 규모에 가장 가까운 것은?"
    choices: ["약 530조원", "약 640조원", "약 728조원", "약 900조원"]
    answer: 2
    explain: "727.9조원. 국내 매출 1위 기업 연 매출의 2배가 넘는 크기다."
  - q: "상장사가 '대규모 상장회사'로서 감사위원회 설치 의무를 지는 자산 기준은?"
    choices: ["5,000억원", "1조원", "2조원", "5조원"]
    answer: 2
    explain: "상법 제542조의11. 같은 기준으로 2차 상법 개정의 집중투표제 의무화도 적용된다."
