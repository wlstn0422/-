# 뉴스 수집 설정
# - categories: 기사 분류 규칙. 제목에 키워드가 나오면 2점, 요약에 나오면 1점. 가장 점수가 높은 분류로 들어간다.
#   위에 있는 분류일수록 같은 점수일 때 우선한다(분할·합병처럼 겹치는 단어가 있어 순서가 중요).
#   group: 재무(finance) / 경영(business) / 경제(economics) / 제도(institution: 회계·세법·상법·재정).
#          '뉴스로 보는 사례'를 고를 때 네 분야가 고르게 섞이도록 쓴다.
#   theories: 이 분류의 기사를 읽을 때 쓸 이론·제도 카드(data/knowledge/theories). 앞에 둔 카드가 기본이고,
#             기사 제목에 카드의 '더 찾아볼 말'이 들어 있으면 그 카드를 먼저 쓴다.
#   cards: 연결되는 회계·세무 카드(data/knowledge/cards.yaml)
#   numbers: 기사에서 찾아볼 숫자
# - google_news: 분류별 검색어. 구글 뉴스 RSS로 여러 언론사 기사를 한 번에 모은다.
# - feeds: 언론사 RSS. 접속이 안 되는 주소는 건너뛰고 로그에만 남긴다.

