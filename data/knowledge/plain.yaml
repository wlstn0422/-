    - ["수요|소비", "'{m}' 변화의 원인이 가격 요인인지 소득 요인인지를 구분하면 향후 추세를 예측할 수 있다."]
  behavioral_econ:
    - ["최저가|한정|마감|품절|할인", "'{m}' 같은 표현은 기회를 놓치면 손해라는 손실 회피 심리를 자극한다."]
    - ["기본|자동|디폴트", "사람들은 기본으로 설정된 선택지를 잘 바꾸지 않으므로, 기본값의 설정이 결과를 크게 좌우한다."]
  stp:
    - ["겨냥|타깃|MZ|젊은|20대|30대|시니어|1인 가구|여성|남성|키즈", "'{m}'{m_eun} 표적시장을 선정한 부분이다. 다음 단계는 그 고객층의 인식 속에 어떤 위치를 차지할지(포지셔닝)를 정하는 것이다."]
    - ["리브랜딩|브랜드|이미지", "'{m}'{m_eun} 고객 인식 속의 위치(포지셔닝)를 바꾸려는 시도이다. 기존 고객이 이탈할 위험을 함께 고려해야 한다."]
  marketing_mix:
    - ["광고|캠페인|모델|협업|콜라보|팝업", "'{m}'{m_eun} 마케팅 믹스(4P) 중 촉진(Promotion)에 해당한다. 투입한 비용에 상응하는 매출 증가가 있는지 검토해야 한다."]
    - ["출시|신제품", "'{m}'{m_eun} 마케팅 믹스(4P) 중 제품(Product)에 해당한다. 가격·유통·촉진이 같은 방향으로 구성되었는지 함께 검토해야 한다."]
    - ["온라인|매장|유통|채널|편의점|쿠팡", "'{m}'{m_eun} 마케팅 믹스(4P) 중 유통(Place)에 해당한다. 표적 고객이 구매하는 경로에 제품이 배치되었는지가 핵심이다."]
    - ["가격", "가격(Price)이 제품의 포지셔닝과 일관되게 설정되었는지 검토해야 한다."]
  brand_equity:
    - ["논란|불매|사고|리콜", "'{m}'{m_eun} 축적된 브랜드 자산을 일시에 훼손할 수 있으며, 그 피해는 단기 매출 감소보다 오래 지속된다."]
    - ["브랜드|리브랜딩|프리미엄|명품|로고", "'{m}' 덕분에 동일한 제품을 더 높은 가격에 판매할 수 있다면 그 차이가 브랜드 자산이다."]
  diffusion_chasm:
    - ["출시|도입|상용화|첫 선|첫선", "'{m}' 단계의 제품은 아직 일부 혁신 수용자만 사용한다. 주류 시장으로 넘어가는 간극(캐즘)을 극복하는지가 관건이다."]
    - ["보급|대중화|확산|가입자", "'{m}'{m_eun} 주류 시장으로의 확산을 나타내는 신호이다. 성장률이 둔화되는 시점도 함께 살펴보아야 한다."]
  disruptive_innovation:
    - ["AI|인공지능|로봇|자율주행|전기차", "'{m}'{m_i} 기존 선도 기업이 간과한 저가·단순 형태에서 출발해 빠르게 성능을 높이고 있다면 시장 구도를 바꿀 수 있다."]
    - ["추격|저가|중국", "저가 제품이 품질을 개선하며 상위 시장으로 이동하면 기존 선도 기업의 고객이 하위 시장부터 이탈한다."]
  externality_esg:
    - ["탄소|배출|온실가스|기후", "'{m}' 비용을 기업에 부과하는 규제가 강화될수록 배출량이 많은 기업의 원가가 상승한다."]
    - ["재생에너지|태양광|풍력|RE100|원전", "'{m}' 전환에는 대규모 투자가 필요하지만, 탄소 비용이 상승할수록 경제성이 개선된다."]
    - ["ESG|친환경", "'{m}'{m_eun} 외부에 전가되던 환경·사회적 비용을 계량화하여 투자 판단에 반영하려는 흐름이다."]
  pf_budget:
    - ["세수|세입", "'{m}'{m_eun} 정부 수입에 관한 사항이다. 세수가 늘면 지출을 확대할 여력이 생기고, 줄면 지출을 줄이거나 국채를 발행해야 한다."]
    - ["본예산|예산안|예산", "'{m}'에서 핵심은 전년 대비 증가율과, 늘어난 지출이 매년 반복되는 의무지출인지 여부이다."]
    - ["복지|교육|국방|R&D|연구개발|SOC", "'{m}' 분야 예산의 증가율은 정부(지방자치단체)의 정책 우선순위를 보여 준다."]
  pf_debt_rules:
    - ["국가채무|나랏빚|국채|적자", "'{m}'{m_eun} 절대 금액보다 국내총생산(GDP) 대비 비율과 그 증가 속도로 평가해야 한다."]
