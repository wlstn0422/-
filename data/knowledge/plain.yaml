    - ["경쟁|점유율", "'{m}'{m_i} 치열해지면 산업 전체의 이익률이 하락한다. 다섯 가지 경쟁요인 중 '기존 기업 간 경쟁'이 강화되는 경우이다."]
  value_chain:
