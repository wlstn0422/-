  bcg_portfolio:
    - ["매각|철수|정리|축소", "'{m}'{m_eun} 성장성이 낮거나 시장 지위가 약한 사업에서 자원을 회수하는 결정이다."]
    - ["투자|확대|증설|집중", "'{m}'{m_eun} 성장성이 높은 사업에 자원을 집중하는 결정이다. 그 재원이 어느 사업(현금 젖소)에서 창출되는지 검토해야 한다."]
  monetary_policy:
