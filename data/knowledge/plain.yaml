    - ["원자재|원재료|공급", "'{m}' 쪽 힘이 세지면 이익이 공급자에게 넘어갑니다. 이를 판매 가격에 넘길 수 있는지가 관건입니다."]
    - ["신규 진입|진출|진입", "'{m}'{m_eun} 새 경쟁자가 들어오는 것입니다. 진입장벽이 낮은 산업일수록 이익이 빨리 깎입니다."]
    - ["경쟁|점유율", "'{m}'{m_i} 치열해지면 산업 전체의 이익률이 떨어집니다. 다섯 힘 중 '기존 경쟁'이 세지는 쪽입니다."]
  value_chain:
    - ["물류|배송|생산|구매|조달|AS|서비스", "'{m}'{m_eun} 가치사슬 중 한 단계입니다. 이 단계를 바꾸면 원가나 고객 가치가 얼마나 달라지는지 보세요."]
  bcg_portfolio:
    - ["매각|철수|정리|축소", "'{m}'{m_eun} 더 키우지 않을 사업(성장이 낮거나 1등이 아닌 사업)에서 돈을 빼는 결정입니다."]
    - ["투자|확대|증설|집중", "'{m}'{m_eun} 앞으로 클 사업에 돈을 몰아주는 결정입니다. 그 돈이 어디서(기존에 돈 버는 사업) 오는지 보세요."]
  monetary_policy:
    - ["금리|기준금리|동결", "'{m}' 결정은 대출 이자, 집값, 환율, 소비로 차례로 번집니다. 빚이 많은 기업·가계일수록 영향이 큽니다."]
  business_cycle:
    - ["물가|인플레이션|소비자물가", "'{m}'{m_i} 높으면 금리가 오르기 쉽고, 같은 월급으로 살 수 있는 양이 줄어 소비가 위축됩니다."]
    - ["경기|성장률|GDP|침체|둔화|회복", "'{m}' 흐름에서 이 업종이 경기에 민감한지(자동차·철강·건설) 덜 민감한지(식품·통신)를 나눠 보세요."]
