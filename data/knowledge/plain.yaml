  pf_fiscal_policy:
    - ["지원금|쿠폰|바우처|추경|경기 부양|부양", "'{m}'{m_eun} 정부가 지출을 늘려 총수요를 확대하는 정책이다. 지급액이 실제 소비로 이어지는 비율이 높을수록 재정승수가 커진다."]
  pf_social_insurance:
    - ["국민연금|연금|건강보험|보험료", "'{m}'{m_eun} 보험료 수입과 급여 지출의 균형 문제이다. 고령화로 보험료 납부자가 줄어들수록 재정 부담이 커진다."]
  pf_local_soe:
    - ["한전|공기업|전기요금|가스요금|요금", "'{m}'{m_eul} 원가보다 낮게 유지하면 그 차액이 공기업 부채로 누적되었다가 결국 세금이나 요금 인상으로 귀결된다."]
    - ["지자체|교부세|지방", "지방재정은 자체 세입보다 중앙정부의 이전재원(지방교부세 등)에 크게 의존한다."]
  pf_redistribution:
    - ["근로장려금|저소득|소득 격차|불평등|기초", "'{m}'{m_eun} 시장에서 발생한 소득 격차를 조세와 이전지출로 완화하는 문제이다. 근로 유인을 저해하지 않는지도 함께 검토해야 한다."]
  pf_public_goods:
    - ["지원|보조금|육성", "정부가 '{m}'에 나서는 것은 시장에만 맡기면 과소 공급되는 분야라고 판단하기 때문이다. 정책 효과를 계량적으로 확인할 수 있는지 검토해야 한다."]
    - ["규제|허가|인증", "'{m}'{m_eun} 거래 당사자가 아닌 제3자에게 발생하는 피해(외부효과)를 막기 위한 개입이다. 규제 비용이 편익을 초과하지 않는지 검토해야 한다."]
  five_forces:
