# 이론·제도 카드와 뉴스 분야에 붙이는 설명(경영학·경제학 교과서 문체).
# cards.<카드 id>.analogy: 일상의 예시 한 문장
# cards.<카드 id>.watch: 뉴스 사례에 이 이론을 적용할 때의 분석 관점
# categories.<뉴스 분야 key>: 이 분야 기사를 학습하는 의의

cards:
  five_forces:
    analogy: "같은 실력의 빵집이라도 경쟁 가게가 없고 밀가루 값이 안정된 동네에서 더 많이 남긴다."
    watch: "사건이 산업 내 다섯 가지 경쟁요인(기존 기업 간 경쟁, 신규 진입 위협, 대체재 위협, 공급자 교섭력, 구매자 교섭력) 중 어느 힘을 강화하거나 약화하는지 분석해야 한다. 강해지는 힘의 주체가 산업 이익을 더 많이 가져간다."
  generic_strategy:
    analogy: "같은 커피라도 가장 싸게 파는 가게(원가우위)와 비싸도 줄 서는 가게(차별화)는 이기는 방식이 다르다."
    watch: "기업이 원가우위와 차별화 중 어느 방식으로 경쟁우위를 추구하는지 구분해야 한다. 두 전략을 동시에 추구하다 어느 쪽에서도 우위를 확보하지 못하면 이른바 '어중간한 상태(stuck in the middle)'에 빠진다."
  value_chain:
    analogy: "김밥 한 줄도 재료 사기, 말기, 포장, 배달 중 어디서 남고 어디서 새는지 나눠 보면 고칠 곳이 보인다."
    watch: "변화가 가치사슬의 어느 활동(구매물류, 생산, 출하물류, 마케팅·판매, 서비스)의 원가나 고객 가치를 바꾸는지 분석해야 한다."
  rbv_vrio:
    analogy: "맛집의 비법 소스처럼 남이 쉽게 베낄 수 없는 것이 오래가는 경쟁력이다."
    watch: "기업의 강점이 가치 있고(V), 희소하며(R), 모방하기 어렵고(I), 조직적으로 활용 가능한지(O)를 기준으로 지속적 경쟁우위의 원천인지 판단해야 한다."
  ansoff_diversification:
    analogy: "빵집이 단골에게 케이크를 더 파는 건 쉽지만, 전혀 다른 동네에서 카페를 여는 건 훨씬 위험하다."
    watch: "확장이 기존 제품·기존 시장에서 얼마나 멀어지는지를 기준으로 시장 침투, 시장 개발, 제품 개발, 다각화 중 어디에 해당하는지 판단해야 한다. 기존 사업에서 멀어질수록 위험이 커진다."
  vertical_integration:
    analogy: "식당이 채소를 직접 키울지 시장에서 사 올지는 어느 쪽이 싸고 믿을 만한지에 달려 있다."
    watch: "기업이 부품·유통을 내부화(make)하는지 외부에서 조달(buy)하는지, 그 판단이 거래비용 절감과 공급 안정 중 무엇에 근거하는지 분석해야 한다."
  scale_scope_learning:
    analogy: "떡볶이 10인분을 한 번에 만들면 1인분씩 만들 때보다 1인분 원가가 싸진다."
    watch: "규모 확대로 단위당 원가가 얼마나 낮아지는지, 늘어난 고정비를 감당할 만큼의 판매량을 확보할 수 있는지 검토해야 한다."
  network_platform:
    analogy: "메신저는 친구들이 다 쓰기 때문에 쓰게 되고, 쓰는 사람이 많을수록 다른 앱으로 옮기기 어렵다."
    watch: "이용자가 늘수록 가치가 커지는 네트워크 효과가 작동하는지, 그 효과를 바탕으로 가격이나 수수료를 인상할 수 있는지 분석해야 한다."
  disruptive_innovation:
    analogy: "처음엔 장난감 같던 스마트폰 카메라가 결국 디지털카메라 시장을 무너뜨렸다."
    watch: "기존 선도 기업이 간과하는 저가·단순 제품이 빠르게 성능을 개선하며 주류 시장으로 진입하고 있는지 살펴보아야 한다."
  bcg_portfolio:
    analogy: "용돈을 잘되는 일과 앞으로 클 일에 몰아주고, 가망 없는 일은 정리하는 것과 같다."
    watch: "해당 사업이 현금 젖소(자금 창출), 별·물음표(투자 필요), 개(철수 검토) 중 어디에 해당하는지 분류해야 한다."
  ma_synergy:
    analogy: "중고차를 시세보다 비싸게 샀다면 고쳐서 더 비싸게 쓸 방법이 있어야 손해가 아니다."
    watch: "인수 가격에 포함된 프리미엄을 상회하는 시너지가 구체적인 수치로 제시되었는지 검토해야 한다."
  conglomerate_discount:
    analogy: "여러 반찬을 한 통에 섞어 팔면 각각 따로 팔 때보다 제값을 받기 어렵다."
    watch: "사업의 분리나 결합이 사업별 가치를 더 명확하게 드러내는지, 그 과정에서 기존 주주가 불이익을 받지 않는지 분석해야 한다."
  stp:
    analogy: "같은 운동화라도 학생용, 마라톤용, 멋 내기용으로 손님을 나눠 노리면 파는 방법이 달라진다."
    watch: "기업이 어떤 기준으로 시장을 세분화하고, 어느 고객층을 표적시장으로 선정하며, 고객의 인식 속에 어떤 위치를 차지하려 하는지 분석해야 한다."
  marketing_mix:
    analogy: "고급 화장품을 편의점에서 반값에 팔면 제품과 가격·판매처·광고가 서로 엇갈린다."
    watch: "제품, 가격, 유통, 촉진의 네 요소가 표적시장과 포지셔닝에 맞게 일관되게 구성되었는지 검토해야 한다."
  brand_equity:
    analogy: "같은 흰 티셔츠라도 유명 브랜드 로고가 붙으면 몇 배 값에 팔린다."
    watch: "브랜드가 가격 프리미엄이나 판매량 증가를 만들어 내는지, 브랜드 자산을 훼손하는 요인은 없는지 분석해야 한다."
  pricing_strategy:
    analogy: "영화관이 조조와 주말 요금을 다르게 받는 건 같은 좌석에 손님마다 다른 값을 내게 하는 전략이다."
    watch: "가격 결정의 기준이 원가, 고객이 인식하는 가치, 경쟁사 가격 중 무엇인지 파악해야 한다."
  clv_cac:
    analogy: "손님 한 명 데려오는 데 쿠폰값으로 만 원을 썼다면 그 손님이 만 원 넘게 남겨 줘야 한다."
    watch: "고객 획득 비용(CAC)과 고객 생애가치(LTV)를 비교하여 고객 확보 활동이 수익성을 갖는지 판단해야 한다."
  diffusion_chasm:
    analogy: "새 기기는 얼리어답터가 먼저 사지만, 보통 사람들이 사기 시작해야 진짜 시장이 열린다."
    watch: "제품이 혁신 수용자·조기 수용자 단계에 머물러 있는지, 캐즘을 넘어 주류 시장으로 확산되고 있는지 판단해야 한다."
  valuation:
    analogy: "가게 값은 앞으로 몇 년 동안 벌 돈을 따져 매기거나, 옆 가게가 팔린 값에 비춰 매긴다."
    watch: "거래 가격(인수가, 공모가, 투자 유치 금액)을 기업의 이익이나 유사 기업의 가치 배수와 비교하여 고평가인지 저평가인지 판단해야 한다."
  capital_structure:
    analogy: "집을 살 때 대출을 많이 끼면 집값이 오를 때 더 벌지만 이자 부담과 위험도 커진다."
    watch: "자금을 부채와 자기자본 중 무엇으로 조달하는지, 그 결과 재무위험이 커지는지 작아지는지 분석해야 한다."
  signaling:
    analogy: "중고차 주인이 보증을 해 주겠다고 하면 차에 자신 있다는 신호로 읽힌다."
    watch: "기업의 행동(증자, 자기주식 취득, 배당, 대주주 매도)이 정보 비대칭 상황에서 시장에 어떤 신호로 해석되는지 분석해야 한다."
  payout_policy:
    analogy: "번 돈을 가게 확장에 쓸지 동업자들에게 나눠 줄지 정하는 문제다."
    watch: "기업이 이익을 재투자하는지 주주에게 환원하는지, 환원한다면 배당과 자기주식 취득 중 어느 방식을 택하는지 분석해야 한다."
  ipo_underpricing:
    analogy: "새로 연 가게가 첫 손님을 끌려고 개업 할인을 하는 것과 비슷하다."
    watch: "공모가가 희망 범위의 어느 수준에서 결정되었는지, 상장 첫날 주가가 공모가 대비 얼마나 변동했는지 확인해야 한다."
  operating_leverage:
    analogy: "월세가 비싼 가게는 손님이 조금만 늘어도 남는 돈이 확 늘고, 조금만 줄어도 바로 적자가 난다."
    watch: "매출액 변동률과 영업이익 변동률을 비교해야 한다. 영업이익 변동률이 훨씬 크다면 고정비 비중이 높은 구조이다."
  agency_theory:
    analogy: "집주인 대신 집을 관리하는 사람은 집주인만큼 아껴 쓰지 않을 수 있다."
    watch: "의사결정을 하는 주체(경영진·지배주주)와 그 결과를 부담하는 주체(소액주주)의 이해가 상충하는지 분석해야 한다."
  org_structure:
    analogy: "작은 식당은 사장이 다 챙기지만, 체인점이 되면 지역별 점장에게 권한을 나눠야 한다."
    watch: "조직 개편이 어떤 전략(신사업, 비용 절감, 의사결정 속도)을 위해 권한과 책임을 어떻게 재배분하는지 분석해야 한다."
  incentives:
    analogy: "배달 건수로만 돈을 주면 빨리 많이 배달하지만 안전은 뒷전이 되기 쉽다."
    watch: "보상의 기준(성과급, 주식 보상)이 구성원의 행동을 어느 방향으로 유도하는지 분석해야 한다."
  restructuring_labor:
    analogy: "손님이 줄어든 가게가 영업시간과 직원 수를 줄이는 결정과 비슷하다."
    watch: "구조조정으로 절감되는 비용과 새로 발생하는 비용(퇴직 위로금 등), 그리고 노사 협상의 경과가 성과에 미치는 영향을 함께 검토해야 한다."
  supply_chain:
    analogy: "손님이 조금 늘자 가게가 넉넉히 주문하고, 도매상은 더 넉넉히 주문하면서 공장엔 주문이 부풀려진다."
    watch: "공급망의 어느 단계에 병목이나 충격이 발생했는지, 그 영향이 상류와 하류로 어떻게 전파되는지 분석해야 한다."
  lean_inventory:
    analogy: "편의점은 팔릴 만큼만 자주 들여와 창고를 비워 둔다."
    watch: "재고가 과다하여 운전자본이 묶였는지, 과소하여 판매 기회를 잃을 위험이 있는지 판단해야 한다."
  elasticity:
    analogy: "쌀값이 올라도 밥은 먹지만, 커피값이 오르면 다른 음료로 바꾸기 쉽다."
    watch: "가격 변화에 대한 수요의 반응 정도(가격탄력성)를 파악해야 한다. 탄력성이 낮을수록 가격 인상 시 판매량 감소가 작다."
  market_structure:
    analogy: "동네에 주유소가 하나뿐이면 값을 올려도 손님이 갈 데가 없다."
    watch: "시장 참여 기업의 수와 진입장벽의 높이를 파악해야 한다. 경쟁이 제한된 시장일수록 기업의 가격 결정력이 크다."
  game_theory:
    analogy: "마주 보고 달리는 두 차 중 먼저 피하는 쪽이 지는 치킨게임처럼, 내 결과는 상대 선택에 달려 있다."
    watch: "기업의 전략이 경쟁사의 대응을 예상하여 결정되었는지, 상호 손실을 낳는 출혈 경쟁으로 번질 위험은 없는지 분석해야 한다."
  externality_esg:
    analogy: "공장이 강에 폐수를 버리면 그 비용은 공장이 아니라 하류 주민이 떠안는다."
    watch: "기업이 외부에 전가하던 비용(오염, 탄소 배출)이 규제나 투자자 압력을 통해 기업에 내부화되고 있는지 분석해야 한다."
  monetary_policy:
    analogy: "금리는 돈의 사용료라, 사용료가 내려가면 빌려 쓰는 사람이 늘어난다."
    watch: "금리 변화가 대출·소비·투자·환율 중 어느 경로를 통해 먼저 영향을 미치는지, 해당 업종에 유리한지 불리한지 분석해야 한다."
  exchange_rate:
    analogy: "달러 값이 오르면 해외여행은 비싸지지만, 수출해서 받은 달러는 원화로 더 많이 바뀐다."
    watch: "환율 변화가 기업의 수출 매출과 수입 원가 중 어느 쪽에 더 큰 영향을 미치는지 분석해야 한다."
  business_cycle:
    analogy: "경제에도 계절이 있어서 호황엔 주문이 몰리고 불황엔 재고가 쌓인다."
    watch: "현재가 경기 확장기인지 수축기인지, 해당 업종이 경기 변동에 얼마나 민감한지 판단해야 한다."
  trade_tariff:
    analogy: "수입품에 관세를 붙이면 결국 그 물건을 사는 소비자 지갑에서 상당 부분이 나간다."
    watch: "관세 부담이 수출 기업, 수입 기업, 소비자 중 누구에게 귀착되는지, 기업이 현지 생산으로 관세를 회피하려 하는지 분석해야 한다."
  behavioral_econ:
    analogy: "'원래 10만 원, 오늘만 5만 원'이라는 문구는 처음 본 10만 원 때문에 5만 원이 싸게 느껴진다."
    watch: "의사결정에 손실 회피, 기준점 효과(앵커링), 기본값 효과 같은 심리적 편향이 작용하는지 살펴보아야 한다."
  fa_revenue:
    analogy: "1년치 학원비를 미리 받았어도 매달 수업한 만큼만 매출로 잡는다."
    watch: "수익인식 시점(재화 인도 시점 또는 기간에 걸친 인식)에 따라 당기 실적이 달라 보일 수 있는지 검토해야 한다."
  fa_lease:
    analogy: "10년 동안 빌려 쓰기로 한 건물은 사실상 산 것과 비슷해서, 쓸 권리와 앞으로 낼 임차료를 장부에 올린다."
    watch: "리스 이용이 많은 기업은 사용권자산과 리스부채가 함께 인식되어 부채비율이 높아진다는 점을 고려해야 한다."
  fa_financial_instruments:
    analogy: "친구에게 빌려준 돈은 떼일 가능성을 미리 따져 손실을 쌓아 둔다."
    watch: "보유 금융자산의 공정가치 변동과 기대신용손실이 당기손익을 얼마나 변동시키는지 분석해야 한다."
  fa_business_combination:
    analogy: "순자산 100억짜리 회사를 150억에 사면, 더 준 50억이 '영업권'이라는 장부상 자산으로 남는다."
    watch: "인수 시 인식한 영업권이 크다면, 피인수 기업의 성과가 기대에 못 미칠 때 손상차손으로 인식될 위험이 있다는 점을 검토해야 한다."
  fa_consolidation:
    analogy: "엄마 가게와 아들 가게를 한 집안 살림으로 합쳐 보는 것이 연결재무제표다."
    watch: "지분율과 실질 지배력에 따라 피투자회사의 실적이 연결 대상으로 합산되는지, 지분법으로 지분 해당액만 반영되는지 판단해야 한다."
  fa_provisions:
    analogy: "판 물건에 무상 수리를 약속했다면 앞으로 들 수리비를 미리 비용으로 잡아 둔다."
    watch: "소송·리콜·보증처럼 미래에 자원 유출이 예상되는 의무를 충당부채로 인식했는지, 그 금액이 적정한지 검토해야 한다."
  fa_income_tax:
    analogy: "회계상 올해 이익이어도 세법상 내년에 세금을 내는 부분은 '나중에 낼 세금'으로 적어 둔다."
    watch: "장부상 법인세비용과 실제 납부세액이 다른 원인(일시적 차이, 세액공제)을 분석해야 한다."
  fa_equity_instruments:
    analogy: "이름이 '사채'여도 갚을 의무가 없으면 자본, 이름이 '주식'이어도 갚아야 하면 빚으로 본다."
    watch: "새로 발행한 증권이 회계상 부채로 분류되는지 자본으로 분류되는지에 따라 부채비율이 달라진다는 점을 검토해야 한다."
  fa_ifrs18:
    analogy: "같은 가계부라도 칸을 새로 나누면 생활비와 투자 지출이 더 또렷하게 보인다."
    watch: "새로운 표시 기준에 따라 영업이익의 범위와 구성이 어떻게 달라지는지 검토해야 한다."
  ca_cost_behavior_cvp:
    analogy: "붕어빵 가게는 월세(고정비)를 넘길 만큼 팔아야 그때부터 남는다."
    watch: "고정비와 단위당 공헌이익을 이용하여 손익분기점 판매량을 계산해야 한다."
  ca_relevant_costing:
    analogy: "이미 낸 헬스장 1년 회비는 오늘 운동을 갈지 말지 정할 때 따질 돈이 아니다."
    watch: "의사결정에 따라 달라지는 미래 현금흐름(관련원가)만 비교하고, 이미 지출된 매몰원가가 판단에 개입하지 않았는지 검토해야 한다."
  ca_absorption_variable:
    analogy: "공장 월세를 만든 물건마다 나눠 얹으면, 많이 만들어 창고에 쌓을수록 올해 비용이 줄어 보인다."
    watch: "재고가 크게 증가하면서 이익도 증가했다면, 고정제조간접원가가 재고자산으로 이연된 효과는 아닌지 검토해야 한다."
  ca_abc:
    analogy: "손 많이 가는 주문 제작 손님은 매출이 커도 실제로는 남는 게 없을 수 있다."
    watch: "간접원가를 실제 원가동인(활동) 기준으로 배부할 때 어떤 제품·고객이 실제로 수익성이 있는지 분석해야 한다."
  ca_standard_costing:
    analogy: "김밥 한 줄에 들어갈 재료비를 정해 두면, 실제와의 차이가 재료값 탓인지 낭비 탓인지 바로 보인다."
    watch: "원가 차이가 가격 차이(원자재 가격 변동)에서 비롯되었는지 능률 차이(사용량 변동)에서 비롯되었는지 구분해야 한다."
  ca_budgeting:
    analogy: "한 달 살림 계획은 들어올 돈 예상에서 시작해 장보기, 공과금, 저축 계획으로 이어진다."
    watch: "예산과 실적을 비교할 때 실제 판매량을 반영한 변동예산을 기준으로 공정하게 평가했는지 검토해야 한다."
  ca_performance:
    analogy: "시험 점수로만 평가하면 학생들이 점수 잘 나오는 과목만 공부한다."
    watch: "성과평가 지표(투자수익률, 잔여이익, 균형성과표)가 경영자의 행동을 어떤 방향으로 유도하는지 분석해야 한다."
  ca_transfer_pricing:
    analogy: "형제 가게끼리 물건을 넘기는 값을 어떻게 매기느냐에 따라 누구 가게가 잘한 것처럼 보이는지가 달라진다."
    watch: "그룹 내 거래의 이전가격이 사업부 성과와 국가별 세부담을 어떻게 변화시키는지 분석해야 한다."
  ca_target_costing:
    analogy: "손님이 낼 값을 먼저 정하고, 거기서 남길 몫을 뺀 금액에 맞춰 재료를 고른다."
    watch: "목표 판매가격에서 목표이익을 차감하여 허용원가를 정하고, 설계 단계부터 원가를 관리하는지 검토해야 한다."
  tax_corporate_rate:
    analogy: "식당에 붙는 세금은 사장만 내는 것 같지만, 음식값이나 월급에 녹아 손님과 직원도 나눠 진다."
    watch: "법인세 변화가 세수에 미치는 효과와 그 부담이 주주·근로자·소비자 중 누구에게 귀착되는지 분석해야 한다."
  tax_reorganization:
    analogy: "가게 간판만 바꾸고 주인과 장사는 그대로라면, 재산을 옮겼다고 바로 세금을 매기지 않는다."
    watch: "합병·분할이 과세이연 요건(사업의 계속성, 지분의 연속성)을 충족하는지 검토해야 한다."
  tax_loss_carryforward:
    analogy: "작년에 손해 본 가게는 올해 번 돈에서 그 손해를 빼고 세금을 계산해 준다."
    watch: "누적 결손금이 있는 기업은 이익이 발생하더라도 이월결손금 공제로 당분간 세부담이 작을 수 있다는 점을 고려해야 한다."
  tax_rnd_credit:
    analogy: "정부가 '연구개발에 쓴 돈의 일부를 세금에서 빼 주겠다'며 투자를 부추기는 것이다."
    watch: "세액공제 확대가 해당 분야 투자를 얼마나 늘리는지, 기업의 실효세율을 얼마나 낮추는지 분석해야 한다."
  tax_dividend:
    analogy: "회사가 이익에 세금을 낸 뒤 그 돈을 주주에게 나눠 주면 주주가 또 세금을 내니, 두 번 내는 부분을 덜어 준다."
    watch: "배당 과세의 변화가 기업의 배당정책과 투자자의 의사결정에 어떤 영향을 미치는지 분석해야 한다."
  tax_related_party:
    analogy: "가족에게 시세보다 싸게 물건을 넘기면, 세법은 시세대로 판 것으로 다시 계산한다."
    watch: "특수관계인 간 거래 가격이 시가와 다른지, 지배주주 일가 회사에 거래가 집중되는지 검토해야 한다."
  tax_inheritance:
    analogy: "부모 가게 지분을 물려받을 때 세금이 크면, 세금을 내려고 지분 일부를 팔거나 대출을 받게 된다."
    watch: "승계에 필요한 세금 재원을 마련하기 위해 지분 매각, 배당 확대, 지배구조 개편이 함께 이루어지는지 분석해야 한다."
  tax_vat:
    analogy: "빵 한 개에 붙은 부가세는 밀가루집, 빵집, 손님을 거치며 나눠 내지만 결국 손님이 다 낸다."
    watch: "부가가치세 변화가 최종소비자 가격에 어떻게 전가되는지, 면세·영세율 적용 대상이 누구인지 검토해야 한다."
  tax_international:
    analogy: "세금이 싼 나라에 이익을 몰아 두는 걸 막으려고 나라들이 최소 15%는 내게 하자고 약속했다."
    watch: "다국적기업의 세금이 어느 국가에 귀속되는지, 글로벌 최저한세(15%)가 기업의 세부담을 얼마나 변화시키는지 분석해야 한다."
  tax_capital_gains:
    analogy: "주식을 팔 때마다 내는 거래세와, 남긴 차익에 매기는 양도세는 서로 다른 세금이다."
    watch: "주식 관련 세제의 변화가 투자자의 매매 행태(특히 연말 대주주 매도)에 미치는 영향을 분석해야 한다."
  cl_director_duty:
    analogy: "아파트 관리인이 건물만 챙기지 말고 모든 입주민을 공평하게 대해야 한다는 규칙과 같다."
    watch: "이사회 결정이 지배주주뿐 아니라 모든 주주에게 공정한지, 소액주주의 이익을 침해하는 구조는 아닌지 검토해야 한다."
  cl_shareholder_meeting:
    analogy: "아파트 주민 총회처럼 중요한 일은 가진 몫만큼 표를 던져 정한다."
    watch: "안건의 결의 요건(보통결의·특별결의)과 소액주주의 의결권이 결과를 좌우할 수 있는 구조인지 분석해야 한다."
  cl_board_audit:
    analogy: "학생회 감사를 회장 친구들이 맡으면 제대로 감시할 수 없다."
    watch: "감시 기능을 담당하는 독립이사와 감사위원이 지배주주로부터 실질적으로 독립되어 있는지 검토해야 한다."
  cl_cumulative_voting:
    analogy: "반장 선거에서 표를 한 후보에게 몰아줄 수 있으면 소수 그룹도 자기 대표를 뽑을 수 있다."
    watch: "집중투표제를 통해 소액주주가 자신이 지지하는 이사를 이사회에 선임할 수 있는지 분석해야 한다."
  cl_mna_procedure:
    analogy: "아파트 재건축처럼 큰 결정은 다수 동의를 받고, 반대하는 사람에게는 공정한 값에 나갈 길을 준다."
    watch: "반대주주가 공정한 가격으로 주식매수청구권을 행사할 수 있는지, 그 매수가격이 적정한지 검토해야 한다."
  cl_treasury_stock:
    analogy: "회사가 사 둔 자기 주식을 금고에 쌓아 두고 경영권 방어에 쓰지 못하게 원칙적으로 없애도록 한 것이다."
    watch: "취득한 자기주식을 실제로 소각하는지, 보유하면서 다른 목적에 활용하려는지 검토해야 한다."
  cl_new_shares_cb:
    analogy: "반 친구들 몫의 피자를 특정 친구에게만 싸게 더 주면 나머지 친구들 몫이 줄어든다."
    watch: "신주나 전환사채가 특정인에게 낮은 가격으로 배정되어 기존 주주의 지분 가치를 희석하는지 검토해야 한다."
  cl_derivative_suit:
    analogy: "관리인이 아파트에 손해를 끼쳤는데 관리단이 가만히 있으면 주민이 대신 소송을 낼 수 있다."
    watch: "이사의 임무 해태로 발생한 회사 손해에 대해 주주가 직접 책임을 추궁할 수 있는 상황인지 검토해야 한다."
  cl_dividend_capital:
    analogy: "가게는 빚과 밑천을 빼고 남은 이익 안에서만 동업자에게 돈을 나눠 줄 수 있다."
    watch: "배당이 배당가능이익의 범위 안에서 이루어지는지, 감자 등 자본거래가 함께 이루어지는지 검토해야 한다."
  pf_tax_incidence:
    analogy: "담배에 세금을 더 붙이면 끊기 어려운 흡연자가 그 부담을 거의 다 떠안는다."
    watch: "세금의 법적 납세의무자와 실제 부담자가 다른지, 가격탄력성이 낮은 쪽이 누구인지 분석해야 한다."
  pf_excess_burden:
    analogy: "세금 때문에 아예 거래를 포기하면, 정부는 세금을 못 걷고 사람들은 거래로 얻을 이익만 잃는다."
    watch: "세금이 경제주체의 행동(소비, 노동, 투자)을 얼마나 왜곡하여 초과부담(사중손실)을 발생시키는지 분석해야 한다."
  pf_public_goods:
    analogy: "가로등은 돈을 안 낸 사람도 혜택을 보니, 시장에 맡기면 아무도 세우지 않는다."
    watch: "정부 개입의 근거(공공재, 외부효과)가 무엇인지, 그 개입이 시장실패를 교정하는지 오히려 시장을 왜곡하는지 분석해야 한다."
  pf_redistribution:
    analogy: "많이 버는 사람이 세금을 더 내고, 적게 버는 사람은 지원을 받아 격차를 줄이는 장치다."
    watch: "정책이 소득 격차를 줄이는지, 근로 유인을 저해하지는 않는지 함께 검토해야 한다."
  pf_budget:
    analogy: "집안 살림처럼 1년 동안 들어올 돈과 쓸 돈을 미리 맞춰 둔 계획표다."
    watch: "재원이 어디에서 조달되는지(세입, 국채)와 어디에 지출되는지, 늘어난 지출이 매년 반복되는 의무지출인지 분석해야 한다."
  pf_debt_rules:
    analogy: "빚은 금액보다 소득에 비해 얼마나 되는지, 얼마나 빨리 늘어나는지가 중요하다."
    watch: "국가채무가 국내총생산(GDP) 대비 어느 수준이며 얼마나 빠르게 증가하는지, 이를 통제하는 재정준칙이 있는지 검토해야 한다."
  pf_fiscal_policy:
    analogy: "정부가 쓴 1원이 가게 매출, 직원 월급, 또 다른 소비로 이어지면 경제엔 1원보다 크게 퍼진다."
    watch: "정부 지출이 실제 소비로 얼마나 이어지는지(한계소비성향)에 따라 재정승수의 크기가 결정된다는 점을 분석해야 한다."
  pf_social_insurance:
    analogy: "지금 일하는 사람들이 낸 보험료로 은퇴한 사람들의 연금을 주는 구조라, 일할 사람이 줄면 부담이 커진다."
    watch: "보험료와 급여의 균형이 세대별로 어떻게 달라지는지, 제도의 재정적 지속가능성을 분석해야 한다."
  pf_local_soe:
    analogy: "전기 요금을 원가보다 싸게 묶어 두면 그 차이는 공기업 빚으로 쌓였다가 결국 세금이나 요금으로 돌아온다."
    watch: "지방정부·공기업의 재정이 중앙정부 이전재원과 요금 수입 중 어디에 의존하는지, 요금 억제가 부채로 누적되는지 분석해야 한다."

categories:
  split: "회사분할과 지배구조 개편은 주주의 지분 가치와 기업가치에 직접 영향을 미치므로, 이해관계자 간 이익 배분을 분석하기에 적합하다."
  ma: "인수합병은 거래 규모가 크고 그 성과가 수년에 걸쳐 재무제표에 나타나므로, 전략과 재무를 통합적으로 학습하기에 적합하다."
  ipo: "기업공개는 기업이 처음으로 시장에서 가치를 평가받는 과정이므로, 기업가치 평가 이론을 실제 사례로 확인할 수 있다."
  capital: "이익을 주주에게 환원하는 방식은 경영진의 전망과 주주 정책을 보여 주는 지표이다."
  earnings: "실적은 기업 전략의 성과를 수치로 확인하는 결과물이다."
  accounting: "동일한 경제적 사실도 회계처리 방법에 따라 보고이익이 달라지므로, 회계 기준을 이해해야 재무 정보를 올바르게 해석할 수 있다."
  governance: "지배구조 규범은 누가 의사결정을 하고 누구의 이익을 보호하는지를 정하므로 주주가치와 직결된다."
  tax: "세제가 바뀌면 기업과 가계의 행동이 변하므로, 입법 의도와 실제 효과를 비교하여 분석할 수 있다."
  competition: "경쟁 구도의 변화는 가격과 이익 수준을 바꾸므로 산업 분석의 핵심이다."
  hr: "인적자원은 비용이자 경쟁력의 원천이므로, 인력에 관한 의사결정에는 기업의 전략 방향이 드러난다."
  supply: "원재료 조달부터 생산까지의 흐름이 불안정해지면 매출과 원가가 함께 변동한다."
  trade: "수출 의존도가 높은 한국 기업에게 관세와 통상 규범의 변화는 실적을 좌우하는 핵심 변수이다."
  pricing: "가격과 소비의 변화는 기업 매출과 물가 수준을 함께 움직이는 출발점이다."
  marketing: "고객을 획득하고 유지하는 방식은 매출 성장의 원천이므로, 수치 이면의 마케팅 전략을 분석할 수 있다."
  startup: "투자 유치 규모와 기업가치 평가를 보면 자본이 어떤 산업과 기술로 이동하는지 파악할 수 있다."
  global: "글로벌 선도 기업의 전략 변화는 국내 기업의 경쟁 환경과 거래 관계에 영향을 미친다."
  esg: "환경 규제와 에너지 전환은 기업의 원가 구조와 투자 방향을 장기적으로 변화시킨다."
  fiscal: "정부의 세입과 세출 구조를 보면 정책의 우선순위와 경기에 대한 정부의 판단을 파악할 수 있다."
  policy: "정부의 지원과 규제는 산업의 성장 속도와 기업의 수익성에 직접 영향을 미친다."
  strategy: "기업이 어디에 투자하고 어떤 사업을 정리하는지를 보면 향후 성장 경로를 파악할 수 있다."
  macro: "금리·환율·물가는 모든 기업과 가계의 의사결정에 영향을 미치는 거시경제의 기초 변수이다."

# 뉴스 제목·요약에서 찾을 단서와, 찾았을 때 그 기사에 이론을 적용하는 문장.
# [정규식, 문장] 형식. {m}은 찾은 말, {m_eun}/{m_i}/{m_eul}/{m_gwa}는 그 말에 맞는 조사(은는/이가/을를/과와).
cues:
  conglomerate_discount:
    - ["물적분할|인적분할|분사|분할", "'{m}'{m_eun} 한 회사 안의 사업을 분리하여 사업별로 가치를 평가받으려는 조치이다. 분리된 회사를 별도로 상장하는지가 기존 주주의 이해에 중요하다."]
    - ["중복상장|쪼개기|자회사 상장", "'{m}'{m_eun} 모회사와 자회사가 함께 상장되어 모회사의 기업가치가 할인되는 문제와 관련된다."]
    - ["지주사|지주회사|홀딩스", "지주회사는 자회사 지분만 보유하므로 이른바 '지주회사 할인'이 발생하기 쉽다. 자회사 지분가치의 합보다 시가총액이 낮은지 비교해야 한다."]
  agency_theory:
    - ["소액주주|일반주주|개인투자자", "'{m}'{m_i} 언급된다는 것은 지배주주·경영진과 소액주주 사이에 이해 상충이 존재할 수 있음을 의미한다. 의사결정의 주체와 손실의 부담 주체를 구분해야 한다."]
    - ["경영권|최대주주|오너|총수", "'{m}' 측의 이익과 전체 주주의 이익이 일치하는지가 대리인 문제의 핵심이다."]
    - ["보수|스톡옵션|성과급", "경영진 보상('{m}')은 대리인이 주인의 이익을 위해 행동하도록 유도하는 장치이다. 보상 기준이 주주가치와 연계되어 있는지 검토해야 한다."]
  org_structure:
    - ["조직개편|조직 개편|개편|신설|통합", "'{m}'{m_eun} 권한과 책임을 재배분하는 조치이다. 어떤 전략(신사업, 비용 절감, 의사결정 속도)을 위한 개편인지 분석해야 한다."]
    - ["사업부|부문|본부", "사업부 단위로 조직을 나누면 사업별 성과가 명확해지는 반면, 기능의 중복으로 비용이 증가할 수 있다."]
    - ["지주사|지주회사", "지주회사 체제는 사업을 자회사로 분리하여 위험을 차단하고 지배구조를 단순화하는 조직 형태이다."]
  ma_synergy:
    - ["흡수합병|합병", "'{m}'{m_eun} 두 회사를 하나로 결합하는 것이다. 결합으로 제거할 수 있는 중복 비용의 크기와 합병비율의 공정성이 핵심이다."]
    - ["인수|M&A|사들|품는|품에|매입", "'{m}'에서 핵심은 인수 가격이다. 대상 기업 연간 이익의 몇 배를 지급했는지를 보면 인수 프리미엄의 크기를 가늠할 수 있다."]
    - ["시너지", "제시된 시너지가 비용 시너지인지 매출 시너지인지, 수치로 뒷받침되는지 검토해야 한다. 일반적으로 비용 시너지가 더 신뢰할 만하다."]
    - ["경쟁입찰|본입찰|입찰|우선협상", "'{m}'처럼 경쟁이 붙으면 인수 가격이 상승하여, 거래에 성공하고도 손실을 보는 '승자의 저주' 위험이 커진다."]
    - ["매각|팔아|판다", "매도자 입장에서는 매각 가격이 해당 사업이 창출할 미래 현금흐름의 현재가치보다 큰지가 판단 기준이다."]
  ansoff_diversification:
    - ["진출|신사업|신규 사업|다각화", "'{m}'{m_eun} 기존 사업 영역 밖으로 확장하는 것이다. 기존의 고객·기술을 얼마나 활용할 수 있는지에 따라 위험의 크기가 달라진다."]
    - ["해외|글로벌|미국|유럽|동남아|인도|중동|일본|중국", "'{m}' 진출은 기존 제품으로 새로운 시장에 진입하는 '시장 개발' 전략에 해당한다. 현지 경쟁과 규제가 성패를 좌우한다."]
    - ["신제품|출시|라인업", "'{m}'{m_eun} 기존 고객에게 새로운 제품을 판매하는 '제품 개발' 전략이다. 기존 유통망을 활용할 수 있어 다각화보다 위험이 작다."]
  valuation:
    - ["기업가치|몸값|밸류에이션|시가총액|시총", "'{m}'{m_i} 제시되면 그 금액을 기업의 연간 이익이나 매출액과 비교해야 한다. 유사 기업의 가치 배수와 비교하여 고평가 여부를 판단할 수 있다."]
    - ["투자 유치|투자유치|유치", "투자 금액을 양도한 지분율로 나누면 투자자가 평가한 기업 전체의 가치(투자 후 기업가치)를 역산할 수 있다."]
    - ["공모가|희망밴드|밴드", "공모가는 유사 상장기업의 가치 배수(PER 등)에 일정한 할인율을 적용하여 산정한다. 비교 기업으로 어떤 회사를 선정했는지 검토해야 한다."]
  ipo_underpricing:
    - ["따상|첫날|상장 첫|급등|공모가 대비", "'{m}'처럼 상장 첫날 주가가 크게 오른다면 공모가가 시장가치보다 낮게 결정되었음을 의미한다. 발행회사는 그만큼 자금을 덜 조달한 셈이다."]
    - ["수요예측|경쟁률|청약", "'{m}' 결과가 양호할수록 공모가가 희망 범위의 상단에서 결정되고, 상장 첫날 주가가 상승할 가능성이 크다."]
    - ["철회|연기|미달", "'{m}'{m_eun} 시장이 제시된 가격에 주식을 인수할 의사가 없음을 의미한다. 공모가가 과도했거나 시장 여건이 악화된 경우이다."]
  signaling:
    - ["자기주식|자사주", "회사가 '{m}'{m_eul} 매입한다면 경영진이 현재 주가를 저평가로 판단한다는 신호로 해석된다."]
    - ["유상증자|증자", "'{m}'{m_eun} 경영진이 현재 주가를 고평가로 판단한다는 신호로 해석되어 주가가 하락하기 쉽다. 조달 자금의 용도가 신호의 성격을 결정한다."]
    - ["블록딜|지분 매각|매도|팔아", "지배주주나 경영진의 '{m}'{m_eun} 내부 정보를 가진 주체의 매도이므로 시장이 민감하게 반응한다."]
    - ["배당 확대|배당 상향|증액|배당 늘", "배당 확대는 경영진이 향후 이익 창출에 자신이 있다는 신호로 해석된다."]
  payout_policy:
    - ["배당", "배당은 이익을 현금으로 분배하는 것이다. 순이익 대비 배당 비율(배당성향)과 배당의 지속 가능성을 검토해야 한다."]
    - ["자기주식|자사주|소각", "자기주식 취득·소각은 매도를 원하는 주주에게만 현금을 지급하고 잔존 주주의 지분율을 높이는 방식이다. 소각 여부가 효과를 좌우한다."]
    - ["주주환원|밸류업", "'{m}' 계획은 이익의 얼마를 주주에게 환원할지를 정하는 것이다. 절대 금액보다 환원율과 이행 기간을 검토해야 한다."]
  capital_structure:
    - ["회사채|채권|차입|대출", "'{m}'{m_eun} 부채로 자금을 조달하는 것이다. 발행주식 수는 늘지 않지만 이자 부담과 재무위험이 커진다."]
    - ["유상증자|증자|투자 유치", "자기자본으로 자금을 조달하면 상환 부담은 없지만 기존 주주의 지분이 희석된다."]
    - ["신용등급|등급", "신용등급은 채무 상환 능력에 대한 평가이다. 등급이 하락하면 차입 금리가 올라 자본비용이 증가한다."]
    - ["부채비율|재무구조", "'{m}'{m_i} 언급되면 부채와 자기자본의 구성 비율이 어떻게 변하는지가 분석의 핵심이다."]
  operating_leverage:
    - ["영업이익|흑자|적자|어닝", "'{m}'의 변화를 매출액 변화와 비교해야 한다. 영업이익이 매출액보다 훨씬 크게 변동했다면 고정비 비중이 높은 구조이다."]
    - ["가동률|감산|증산|공장", "'{m}'{m_eun} 생산량의 변화와 관련된다. 고정비가 큰 공장은 생산량이 줄면 단위당 원가가 빠르게 상승한다."]
    - ["매출", "매출액이 증가하더라도 비용이 함께 증가하면 이익은 늘지 않는다. 매출 증가분 중 이익으로 남는 비율을 검토해야 한다."]
  generic_strategy:
    - ["저가|가성비|최저가|원가 절감|원가절감", "'{m}'{m_eun} 낮은 원가를 바탕으로 경쟁하는 원가우위 전략에 해당한다. 경쟁사가 더 낮은 원가를 실현하면 우위가 지속되기 어렵다."]
    - ["프리미엄|고급|명품|차별화|럭셔리", "'{m}'{m_eun} 고객이 더 높은 가격을 지불할 이유를 만드는 차별화 전략에 해당한다. 그 차별점이 고객에게 실제로 가치 있게 인식되는지가 관건이다."]
    - ["AI|인공지능|HBM|반도체|칩", "'{m}'처럼 기술 우위를 통한 경쟁은 차별화 전략에 해당한다. 기술 격차가 얼마나 오래 유지되는지가 경쟁우위의 지속성을 결정한다."]
  fa_revenue:
    - ["매출 인식|수익 인식|선수금|구독", "'{m}'{m_eun} 수익인식 시점의 문제이다. 대금을 미리 받았더라도 수행의무를 이행한 만큼만 수익으로 인식한다."]
    - ["수주|계약", "계약을 체결했다고 바로 수익이 인식되지는 않는다. 재화를 인도하거나 용역을 제공한 정도에 따라 수익이 인식된다."]
  fa_business_combination:
    - ["영업권|손상", "'{m}'{m_eun} 인수 시 지급한 초과 대가가 장부에 남아 있다가, 피인수 기업의 성과가 기대에 못 미칠 때 손실로 인식되는 문제와 관련된다."]
    - ["인수|합병", "사업결합에서는 순자산 공정가치를 초과하여 지급한 금액이 영업권으로 인식된다. 영업권이 클수록 향후 손상 위험도 크다."]
  fa_financial_instruments:
