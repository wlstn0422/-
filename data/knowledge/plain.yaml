# 이론·제도 카드를 처음 보는 사람도 바로 감을 잡도록 붙이는 쉬운 말.
# cards.<카드 id>.analogy: 일상 비유 한 문장
# cards.<카드 id>.watch: 뉴스 사례에 이 이론을 대입할 때 볼 핵심 한 가지
# categories.<뉴스 분야 key>: 이 분야 기사를 왜 보는지 한 문장

cards:
  five_forces:
    analogy: 같은 실력의 빵집이라도 경쟁 가게가 없고 밀가루 값이 안정된 동네에서 더 많이 남긴다.
    watch: 기사 속 사건이 경쟁, 새 진입자, 대체재, 공급자, 고객 중 누구의 힘을 키우거나 줄이는지 보세요. 힘이 세지는 쪽이 이익을 가져갑니다.
  generic_strategy:
    analogy: 같은 커피라도 가장 싸게 파는 가게(원가우위)와 비싸도 줄 서는 가게(차별화)는 이기는 방식이 다르다.
    watch: 이 회사가 싸게 만들어서 이기려는지, 비싸게 받을 이유를 만들어서 이기려는지 구분해 보세요. 둘 다 하려다 어중간해지면 위험합니다.
  value_chain:
    analogy: 김밥 한 줄도 재료 사기, 말기, 포장, 배달 중 어디서 남고 어디서 새는지 나눠 보면 고칠 곳이 보인다.
    watch: 기사 속 변화가 구매·생산·물류·판매·서비스 중 어느 단계의 비용이나 가치를 바꾸는지 짚어 보세요.
  rbv_vrio:
    analogy: 맛집의 비법 소스처럼 남이 쉽게 베낄 수 없는 것이 오래가는 경쟁력이다.
    watch: 이 회사의 강점이 돈만 있으면 남도 금방 따라 할 수 있는 것인지, 오래 쌓아야 생기는 것인지 보세요.
  ansoff_diversification:
    analogy: 빵집이 단골에게 케이크를 더 파는 건 쉽지만, 전혀 다른 동네에서 카페를 여는 건 훨씬 위험하다.
    watch: 기존 제품·기존 고객에서 얼마나 멀리 가는 확장인지 보세요. 멀리 갈수록 실패 위험이 커집니다.
  vertical_integration:
    analogy: 식당이 채소를 직접 키울지 시장에서 사 올지는 어느 쪽이 싸고 믿을 만한지에 달려 있다.
    watch: 회사가 부품이나 유통을 직접 하려는지(내재화), 밖에 맡기려는지(외주), 그 이유가 비용인지 공급 안정인지 보세요.
  scale_scope_learning:
    analogy: 떡볶이 10인분을 한 번에 만들면 1인분씩 만들 때보다 1인분 원가가 싸진다.
    watch: 규모를 키우면 개당 원가가 얼마나 떨어지는지, 대신 늘어난 고정비를 감당할 만큼 팔 수 있는지 보세요.
  network_platform:
    analogy: 메신저는 친구들이 다 쓰기 때문에 쓰게 되고, 쓰는 사람이 많을수록 다른 앱으로 옮기기 어렵다.
    watch: 이용자가 늘수록 서비스 가치가 커지는 구조인지, 그 힘으로 수수료나 가격을 올릴 수 있는지 보세요.
  disruptive_innovation:
    analogy: 처음엔 장난감 같던 스마트폰 카메라가 결국 디지털카메라 시장을 무너뜨렸다.
    watch: 1등 기업이 무시하는 싸고 단순한 제품이 빠르게 좋아지고 있는지 보세요. 그게 판을 뒤집는 쪽입니다.
  bcg_portfolio:
    analogy: 용돈을 잘되는 일과 앞으로 클 일에 몰아주고, 가망 없는 일은 정리하는 것과 같다.
    watch: 이 사업이 돈을 벌어다 주는 쪽인지, 돈을 넣어야 크는 쪽인지, 정리할 쪽인지 나눠 보세요.
  ma_synergy:
    analogy: 중고차를 시세보다 비싸게 샀다면 고쳐서 더 비싸게 쓸 방법이 있어야 손해가 아니다.
    watch: 인수 가격에 얹은 웃돈만큼 합쳐서 새로 벌 이익(시너지)이 구체적인 숫자로 제시됐는지 보세요.
  conglomerate_discount:
    analogy: 여러 반찬을 한 통에 섞어 팔면 각각 따로 팔 때보다 제값을 받기 어렵다.
    watch: 사업을 떼어 내거나 합치는 일이 사업별 가치를 더 잘 드러나게 하는지, 기존 주주에게 손해는 없는지 보세요.
  stp:
    analogy: 같은 운동화라도 학생용, 마라톤용, 멋 내기용으로 손님을 나눠 노리면 파는 방법이 달라진다.
    watch: 이 회사가 누구를 주된 손님으로 노리는지, 그 손님에게 어떤 이미지로 기억되려 하는지 보세요.
  marketing_mix:
    analogy: 고급 화장품을 편의점에서 반값에 팔면 제품과 가격·판매처·광고가 서로 엇갈린다.
    watch: 제품, 가격, 판매 채널, 홍보가 같은 방향을 가리키는지 보세요. 하나라도 엇나가면 효과가 줄어듭니다.
  brand_equity:
    analogy: 같은 흰 티셔츠라도 유명 브랜드 로고가 붙으면 몇 배 값에 팔린다.
    watch: 브랜드 덕분에 값을 더 받거나 더 많이 팔고 있는지, 그 힘이 약해지는 신호는 없는지 보세요.
  pricing_strategy:
    analogy: 영화관이 조조와 주말 요금을 다르게 받는 건 같은 좌석에 손님마다 다른 값을 내게 하는 전략이다.
    watch: 값을 정하는 기준이 원가인지, 고객이 느끼는 가치인지, 경쟁사 가격인지 보세요.
  clv_cac:
    analogy: 손님 한 명 데려오는 데 쿠폰값으로 만 원을 썼다면 그 손님이 만 원 넘게 남겨 줘야 한다.
    watch: 고객을 모으는 데 쓰는 돈과 그 고객이 오래 남겨 줄 이익을 견줘 보세요.
  diffusion_chasm:
    analogy: 새 기기는 얼리어답터가 먼저 사지만, 보통 사람들이 사기 시작해야 진짜 시장이 열린다.
    watch: 이 제품이 아직 일부 열성 고객 단계인지, 대중 시장으로 넘어가는 중인지 보세요.
  valuation:
    analogy: 가게 값은 앞으로 몇 년 동안 벌 돈을 따져 매기거나, 옆 가게가 팔린 값에 비춰 매긴다.
    watch: 기사 속 가격(인수가, 공모가, 투자 유치 금액)이 회사의 이익이나 비슷한 회사 값에 비해 비싼지 싼지 보세요.
  capital_structure:
    analogy: 집을 살 때 대출을 많이 끼면 집값이 오를 때 더 벌지만 이자 부담과 위험도 커진다.
    watch: 돈을 빚으로 마련하는지 주식(투자)으로 마련하는지, 그 결과 빚 부담이 커지는지 줄어드는지 보세요.
  signaling:
    analogy: 중고차 주인이 보증을 해 주겠다고 하면 차에 자신 있다는 신호로 읽힌다.
    watch: 회사의 행동(증자, 자사주, 배당, 대주주 매도)이 시장에 어떤 속마음을 내비치는지 보세요.
  payout_policy:
    analogy: 번 돈을 가게 확장에 쓸지 동업자들에게 나눠 줄지 정하는 문제다.
    watch: 번 돈을 재투자하는지 주주에게 돌려주는지, 돌려준다면 배당인지 자사주인지 보세요.
  ipo_underpricing:
    analogy: 새로 연 가게가 첫 손님을 끌려고 개업 할인을 하는 것과 비슷하다.
    watch: 공모가가 희망 범위의 위·아래 어디서 정해졌는지, 상장 첫날 주가가 공모가보다 얼마나 움직였는지 보세요.
  operating_leverage:
    analogy: 월세가 비싼 가게는 손님이 조금만 늘어도 남는 돈이 확 늘고, 조금만 줄어도 바로 적자가 난다.
    watch: 매출 변화율보다 이익 변화율이 훨씬 크다면 고정비가 큰 회사입니다. 두 숫자를 나란히 놓고 보세요.
  agency_theory:
    analogy: 집주인 대신 집을 관리하는 사람은 집주인만큼 아껴 쓰지 않을 수 있다.
    watch: 결정을 내리는 사람(경영진·대주주)과 손익을 떠안는 사람(소액주주)의 이해가 엇갈리는지 보세요.
  org_structure:
    analogy: 작은 식당은 사장이 다 챙기지만, 체인점이 되면 지역별 점장에게 권한을 나눠야 한다.
    watch: 조직 개편이 어떤 전략(신사업, 비용 절감, 빠른 결정)을 위해 권한과 책임을 어떻게 옮기는지 보세요.
  incentives:
    analogy: 배달 건수로만 돈을 주면 빨리 많이 배달하지만 안전은 뒷전이 되기 쉽다.
    watch: 보상 기준(성과급, 주식 보상)이 사람들을 어느 방향으로 움직이게 하는지 보세요.
  restructuring_labor:
    analogy: 손님이 줄어든 가게가 영업시간과 직원 수를 줄이는 결정과 비슷하다.
    watch: 줄이는 비용과 새로 드는 비용(위로금 등), 남은 직원의 사기와 노사 협상이 어떻게 맞물리는지 보세요.
  supply_chain:
    analogy: 손님이 조금 늘자 가게가 넉넉히 주문하고, 도매상은 더 넉넉히 주문하면서 공장엔 주문이 부풀려진다.
    watch: 원재료부터 소비자까지 어느 고리가 막혔거나 흔들리는지, 그 충격이 어디로 번지는지 보세요.
  lean_inventory:
    analogy: 편의점은 팔릴 만큼만 자주 들여와 창고를 비워 둔다.
    watch: 재고가 너무 많아 돈이 묶였는지, 너무 적어 못 파는 위험이 있는지 보세요.
  elasticity:
    analogy: 쌀값이 올라도 밥은 먹지만, 커피값이 오르면 다른 음료로 바꾸기 쉽다.
    watch: 값이 바뀔 때 손님이 얼마나 민감하게 반응하는 상품인지 보세요. 덜 민감할수록 값을 올려도 매출이 덜 줄어듭니다.
  market_structure:
    analogy: 동네에 주유소가 하나뿐이면 값을 올려도 손님이 갈 데가 없다.
    watch: 시장에 경쟁자가 몇이나 있는지, 새로 들어오기 어려운지 보세요. 경쟁이 적을수록 값을 정하는 힘이 큽니다.
  game_theory:
    analogy: 마주 보고 달리는 두 차 중 먼저 피하는 쪽이 지는 치킨게임처럼, 내 결과는 상대 선택에 달려 있다.
    watch: 경쟁사가 어떻게 맞받아칠지 예상하고 내린 결정인지, 서로 손해 보는 출혈 경쟁으로 번질 위험은 없는지 보세요.
  externality_esg:
    analogy: 공장이 강에 폐수를 버리면 그 비용은 공장이 아니라 하류 주민이 떠안는다.
    watch: 기업이 남에게 떠넘기던 비용(오염, 탄소)을 규제나 투자자가 기업에 되돌려 물리고 있는지 보세요.
  monetary_policy:
    analogy: 금리는 돈의 사용료라, 사용료가 내려가면 빌려 쓰는 사람이 늘어난다.
    watch: 금리 변화가 대출·소비·투자·환율 중 어디부터 영향을 줄지, 이 업종에 유리한지 불리한지 보세요.
  exchange_rate:
    analogy: 달러 값이 오르면 해외여행은 비싸지지만, 수출해서 받은 달러는 원화로 더 많이 바뀐다.
    watch: 환율이 바뀌면 이 회사의 매출(수출)과 비용(수입 원자재) 중 어느 쪽이 더 크게 바뀌는지 보세요.
  business_cycle:
    analogy: 경제에도 계절이 있어서 호황엔 주문이 몰리고 불황엔 재고가 쌓인다.
    watch: 지금이 경기가 커지는 때인지 식는 때인지, 이 업종이 경기에 얼마나 민감한지 보세요.
  trade_tariff:
    analogy: 수입품에 관세를 붙이면 결국 그 물건을 사는 소비자 지갑에서 상당 부분이 나간다.
    watch: 관세 부담을 누가 떠안는지(수출 기업, 수입 기업, 소비자), 기업이 현지 생산으로 피하려 하는지 보세요.
  behavioral_econ:
    analogy: "'원래 10만 원, 오늘만 5만 원'이라는 문구는 처음 본 10만 원 때문에 5만 원이 싸게 느껴진다."
    watch: 사람들이 손실 회피, 처음 본 숫자, 기본 선택값 같은 심리에 따라 움직이는 부분이 있는지 보세요.
  fa_revenue:
    analogy: 1년치 학원비를 미리 받았어도 매달 수업한 만큼만 매출로 잡는다.
    watch: 매출을 언제 잡는지(물건을 넘길 때, 기간에 나눠서)에 따라 이번 실적이 달라 보일 수 있는지 보세요.
  fa_lease:
    analogy: 10년 동안 빌려 쓰기로 한 건물은 사실상 산 것과 비슷해서, 쓸 권리와 앞으로 낼 임차료를 장부에 올린다.
    watch: 빌려 쓰는 자산이 많은 회사는 장부상 빚(리스부채)도 함께 커진다는 점을 보세요.
  fa_financial_instruments:
    analogy: 친구에게 빌려준 돈은 떼일 가능성을 미리 따져 손실을 쌓아 둔다.
    watch: 들고 있는 금융자산의 값 변화나 떼일 가능성(대손)이 이익을 얼마나 흔드는지 보세요.
  fa_business_combination:
    analogy: 순자산 100억짜리 회사를 150억에 사면, 더 준 50억이 '영업권'이라는 장부상 자산으로 남는다.
    watch: 인수 때 더 준 돈(영업권)이 크다면, 인수한 회사가 기대만큼 못 벌 때 손상 손실로 돌아온다는 점을 보세요.
  fa_consolidation:
    analogy: 엄마 가게와 아들 가게를 한 집안 살림으로 합쳐 보는 것이 연결재무제표다.
    watch: 지분율과 실제 지배력에 따라 그 회사 실적이 통째로 합쳐지는지(연결), 내 몫만 반영되는지(지분법) 보세요.
  fa_provisions:
    analogy: 판 물건에 무상 수리를 약속했다면 앞으로 들 수리비를 미리 비용으로 잡아 둔다.
    watch: 소송, 리콜, 보증처럼 '앞으로 나갈 돈'을 미리 비용으로 잡았는지, 얼마나 잡았는지 보세요.
  fa_income_tax:
    analogy: 회계상 올해 이익이어도 세법상 내년에 세금을 내는 부분은 '나중에 낼 세금'으로 적어 둔다.
    watch: 장부상 법인세비용과 실제로 낸 세금이 왜 다른지(시점 차이, 공제) 보세요.
  fa_equity_instruments:
    analogy: 이름이 '사채'여도 갚을 의무가 없으면 자본, 이름이 '주식'이어도 갚아야 하면 빚으로 본다.
    watch: 새로 발행한 증권이 회계상 빚인지 자본인지에 따라 부채비율이 달라진다는 점을 보세요.
  fa_ifrs18:
    analogy: 같은 가계부라도 칸을 새로 나누면 생활비와 투자 지출이 더 또렷하게 보인다.
    watch: 표시 기준이 바뀌면서 영업이익 숫자에 들어가는 범위가 달라지는지 보세요.
  ca_cost_behavior_cvp:
    analogy: 붕어빵 가게는 월세(고정비)를 넘길 만큼 팔아야 그때부터 남는다.
    watch: 고정비와 한 개 팔 때 남는 돈(공헌이익)으로 몇 개를 팔아야 본전인지 계산해 보세요.
  ca_relevant_costing:
    analogy: 이미 낸 헬스장 1년 회비는 오늘 운동을 갈지 말지 정할 때 따질 돈이 아니다.
    watch: 결정에 따라 달라지는 앞으로의 돈만 비교하고, 이미 쓴 돈(매몰원가)에 끌려가지 않았는지 보세요.
  ca_absorption_variable:
    analogy: 공장 월세를 만든 물건마다 나눠 얹으면, 많이 만들어 창고에 쌓을수록 올해 비용이 줄어 보인다.
    watch: 재고가 크게 늘었는데 이익도 늘었다면 고정비가 재고로 넘어간 효과는 아닌지 보세요.
  ca_abc:
    analogy: 손 많이 가는 주문 제작 손님은 매출이 커도 실제로는 남는 게 없을 수 있다.
    watch: 간접비를 실제로 일으킨 활동 기준으로 나누면 어떤 제품·고객이 진짜 돈이 되는지 보세요.
  ca_standard_costing:
    analogy: 김밥 한 줄에 들어갈 재료비를 정해 두면, 실제와의 차이가 재료값 탓인지 낭비 탓인지 바로 보인다.
    watch: 원가가 예상과 달라진 이유가 가격(원자재값) 때문인지 사용량(효율) 때문인지 보세요.
  ca_budgeting:
    analogy: 한 달 살림 계획은 들어올 돈 예상에서 시작해 장보기, 공과금, 저축 계획으로 이어진다.
    watch: 계획 대비 실적을 볼 때 판매량 변화를 감안해 공정하게 비교했는지 보세요.
  ca_performance:
    analogy: 시험 점수로만 평가하면 학생들이 점수 잘 나오는 과목만 공부한다.
    watch: 평가 기준(수익률, 이익, 고객 지표)이 경영진을 어떤 행동으로 이끄는지 보세요.
  ca_transfer_pricing:
    analogy: 형제 가게끼리 물건을 넘기는 값을 어떻게 매기느냐에 따라 누구 가게가 잘한 것처럼 보이는지가 달라진다.
    watch: 그룹 안 거래 가격이 사업부 실적이나 나라별 세금을 어떻게 바꾸는지 보세요.
  ca_target_costing:
    analogy: 손님이 낼 값을 먼저 정하고, 거기서 남길 몫을 뺀 금액에 맞춰 재료를 고른다.
    watch: 팔릴 값에서 거꾸로 원가 목표를 정하는지, 설계 단계부터 원가를 줄이는지 보세요.
  tax_corporate_rate:
    analogy: 식당에 붙는 세금은 사장만 내는 것 같지만, 음식값이나 월급에 녹아 손님과 직원도 나눠 진다.
    watch: 법인세 변화로 세수가 얼마나 바뀌고, 그 부담이 주주·직원·소비자 중 누구에게 가는지 보세요.
  tax_reorganization:
    analogy: 가게 간판만 바꾸고 주인과 장사는 그대로라면, 재산을 옮겼다고 바로 세금을 매기지 않는다.
    watch: 합병·분할이 세금을 미루는 요건(사업과 주주가 그대로 이어지는지)을 갖췄는지 보세요.
  tax_loss_carryforward:
    analogy: 작년에 손해 본 가게는 올해 번 돈에서 그 손해를 빼고 세금을 계산해 준다.
    watch: 과거 손실이 쌓인 회사라면 이익이 나도 당분간 세금이 적을 수 있다는 점을 보세요.
  tax_rnd_credit:
    analogy: 정부가 '연구개발에 쓴 돈의 일부를 세금에서 빼 주겠다'며 투자를 부추기는 것이다.
    watch: 세액공제가 늘면 그 분야 투자가 늘어날지, 기업의 실제 세 부담이 얼마나 줄지 보세요.
  tax_dividend:
    analogy: 회사가 이익에 세금을 낸 뒤 그 돈을 주주에게 나눠 주면 주주가 또 세금을 내니, 두 번 내는 부분을 덜어 준다.
    watch: 배당 세금이 바뀌면 회사의 배당 정책과 투자자의 선택이 어떻게 달라지는지 보세요.
  tax_related_party:
    analogy: 가족에게 시세보다 싸게 물건을 넘기면, 세법은 시세대로 판 것으로 다시 계산한다.
    watch: 특수관계인끼리의 거래 가격이 시가와 다른지, 총수 일가 회사에 일감이 몰리는지 보세요.
  tax_inheritance:
    analogy: 부모 가게 지분을 물려받을 때 세금이 크면, 세금을 내려고 지분 일부를 팔거나 대출을 받게 된다.
    watch: 승계 세금을 마련하려고 지분 매각, 배당 확대, 지배구조 개편이 함께 움직이는지 보세요.
  tax_vat:
    analogy: 빵 한 개에 붙은 부가세는 밀가루집, 빵집, 손님을 거치며 나눠 내지만 결국 손님이 다 낸다.
    watch: 부가세 변화가 최종 소비자 가격에 어떻게 반영되는지, 면세·영세율 대상이 누구인지 보세요.
  tax_international:
    analogy: 세금이 싼 나라에 이익을 몰아 두는 걸 막으려고 나라들이 최소 15%는 내게 하자고 약속했다.
    watch: 글로벌 기업의 세금이 어느 나라에 얼마 걷히는지, 최저한세 15%가 기업 부담을 얼마나 바꾸는지 보세요.
  tax_capital_gains:
    analogy: 주식을 팔 때마다 내는 거래세와, 남긴 차익에 매기는 양도세는 서로 다른 세금이다.
    watch: 주식 관련 세금 변화가 투자자의 매매(특히 연말 대주주 매도)에 어떤 영향을 주는지 보세요.
  cl_director_duty:
    analogy: 아파트 관리인이 건물만 챙기지 말고 모든 입주민을 공평하게 대해야 한다는 규칙과 같다.
    watch: 이사회 결정이 대주주만이 아니라 모든 주주에게 공평한지, 소액주주가 손해 보는 구조는 아닌지 보세요.
  cl_shareholder_meeting:
    analogy: 아파트 주민 총회처럼 중요한 일은 가진 몫만큼 표를 던져 정한다.
    watch: 안건이 보통결의인지 특별결의인지, 소액주주 표가 결과를 바꿀 수 있는 구조인지 보세요.
  cl_board_audit:
    analogy: 학생회 감사를 회장 친구들이 맡으면 제대로 감시할 수 없다.
    watch: 감시하는 사람(독립이사, 감사위원)이 대주주로부터 실제로 독립돼 있는지 보세요.
  cl_cumulative_voting:
    analogy: 반장 선거에서 표를 한 후보에게 몰아줄 수 있으면 소수 그룹도 자기 대표를 뽑을 수 있다.
    watch: 소액주주가 원하는 이사를 이사회에 보낼 수 있게 되는지 보세요.
  cl_mna_procedure:
    analogy: 아파트 재건축처럼 큰 결정은 다수 동의를 받고, 반대하는 사람에게는 공정한 값에 나갈 길을 준다.
    watch: 반대 주주가 공정한 값에 주식을 팔고 나갈 수 있는지(주식매수청구권), 그 가격이 적정한지 보세요.
  cl_treasury_stock:
    analogy: 회사가 사 둔 자기 주식을 금고에 쌓아 두고 경영권 방어에 쓰지 못하게 원칙적으로 없애도록 한 것이다.
    watch: 자사주를 실제로 없애는지(소각), 남겨 두고 다른 용도로 쓰려는지 보세요.
  cl_new_shares_cb:
    analogy: 반 친구들 몫의 피자를 특정 친구에게만 싸게 더 주면 나머지 친구들 몫이 줄어든다.
    watch: 새 주식이나 전환사채가 특정인에게 싸게 가서 기존 주주 몫을 줄이는지 보세요.
  cl_derivative_suit:
    analogy: 관리인이 아파트에 손해를 끼쳤는데 관리단이 가만히 있으면 주민이 대신 소송을 낼 수 있다.
    watch: 이사의 잘못으로 생긴 회사 손해를 주주가 직접 따질 수 있는 상황인지 보세요.
  cl_dividend_capital:
    analogy: 가게는 빚과 밑천을 빼고 남은 이익 안에서만 동업자에게 돈을 나눠 줄 수 있다.
    watch: 배당이 배당할 수 있는 이익 범위 안인지, 감자나 자본 정리가 함께 일어나는지 보세요.
  pf_tax_incidence:
    analogy: 담배에 세금을 더 붙이면 끊기 어려운 흡연자가 그 부담을 거의 다 떠안는다.
    watch: 세금을 법적으로 내는 사람과 실제로 부담하는 사람이 다른지, 가격에 덜 민감한 쪽이 누구인지 보세요.
  pf_excess_burden:
    analogy: 세금 때문에 아예 거래를 포기하면, 정부는 세금을 못 걷고 사람들은 거래로 얻을 이익만 잃는다.
    watch: 세금이 사람들의 행동(소비, 일, 투자)을 얼마나 바꿔 숨은 손실을 만드는지 보세요.
  pf_public_goods:
    analogy: 가로등은 돈을 안 낸 사람도 혜택을 보니, 시장에 맡기면 아무도 세우지 않는다.
    watch: 정부가 왜 개입하는지(공공재, 외부효과), 그 개입이 시장의 빈틈을 메우는지 오히려 왜곡하는지 보세요.
  pf_redistribution:
    analogy: 많이 버는 사람이 세금을 더 내고, 적게 버는 사람은 지원을 받아 격차를 줄이는 장치다.
    watch: 정책이 소득 격차를 줄이는지, 일하려는 의욕을 떨어뜨리지는 않는지 보세요.
  pf_budget:
    analogy: 집안 살림처럼 1년 동안 들어올 돈과 쓸 돈을 미리 맞춰 둔 계획표다.
    watch: 돈이 어디서 들어오고(세금, 빚) 어디에 쓰이는지, 늘어난 지출이 해마다 반복될 지출인지 보세요.
  pf_debt_rules:
    analogy: 빚은 금액보다 소득에 비해 얼마나 되는지, 얼마나 빨리 늘어나는지가 중요하다.
    watch: 나랏빚이 경제 규모 대비 얼마나 빠르게 늘고 있는지, 이를 막는 규칙이 있는지 보세요.
  pf_fiscal_policy:
    analogy: 정부가 쓴 1원이 가게 매출, 직원 월급, 또 다른 소비로 이어지면 경제엔 1원보다 크게 퍼진다.
    watch: 정부가 푼 돈이 실제 소비로 얼마나 이어질지, 저축으로 묶일지 보세요.
  pf_social_insurance:
    analogy: 지금 일하는 사람들이 낸 보험료로 은퇴한 사람들의 연금을 주는 구조라, 일할 사람이 줄면 부담이 커진다.
    watch: 내는 돈(보험료)과 받는 돈의 균형이 세대마다 어떻게 달라지는지 보세요.
  pf_local_soe:
    analogy: 전기 요금을 원가보다 싸게 묶어 두면 그 차이는 공기업 빚으로 쌓였다가 결국 세금이나 요금으로 돌아온다.
    watch: 지자체·공기업의 살림이 중앙정부 지원과 요금 중 어디에 기대는지, 요금 억제가 빚으로 쌓이는지 보세요.

categories:
  split: 회사를 쪼개거나 합치는 결정은 주주 몫과 회사 가치를 직접 바꿔서, 누가 이득을 보는지 따져 볼 거리가 많습니다.
  ma: 회사를 사고파는 거래는 금액이 크고 결과가 몇 년 뒤 숫자로 드러나, 전략과 재무를 함께 배우기 좋습니다.
  ipo: 상장은 회사가 처음으로 시장에서 값을 매겨 받는 순간이라 기업가치 평가를 실제로 볼 수 있습니다.
  capital: 회사가 번 돈을 주주에게 어떻게 돌려주는지 보면 경영진의 자신감과 주주를 대하는 태도가 보입니다.
  earnings: 실적은 회사 전략이 맞았는지 숫자로 확인하는 성적표입니다.
  accounting: 같은 사실도 회계 처리에 따라 이익이 달라 보여서, 숫자 뒤의 기준을 알아야 속지 않습니다.
  governance: 누가 회사를 움직이고 누구의 이익을 지키는지 정하는 규칙이라 주주 가치와 바로 이어집니다.
  tax: 세금이 바뀌면 기업과 가계의 행동이 바뀌어서, 제도의 의도와 실제 효과를 견줘 볼 수 있습니다.
  competition: 경쟁 구도가 바뀌면 가격과 이익이 바뀌니 산업의 판도를 읽는 데 핵심입니다.
  hr: 사람과 조직은 비용이자 경쟁력이라, 인력에 관한 결정에는 회사의 전략 방향이 드러납니다.
  supply: 원재료부터 생산까지의 흐름이 흔들리면 매출과 원가가 함께 흔들립니다.
  trade: 수출 비중이 큰 한국 기업에는 관세와 통상 규칙 변화가 실적을 크게 바꿉니다.
  pricing: 가격과 소비 흐름은 회사 매출과 물가를 함께 움직이는 출발점입니다.
  marketing: 고객을 얻고 지키는 방식이 매출 성장의 원천이라, 숫자 뒤의 전략을 읽을 수 있습니다.
  startup: 투자 유치와 기업가치를 보면 돈이 어떤 미래에 몰리는지 알 수 있습니다.
  global: 세계 1등 기업의 움직임은 한국 기업의 경쟁 환경과 거래 관계를 바꿉니다.
  esg: 환경 규제와 에너지 전환은 기업의 비용 구조와 투자 방향을 오랫동안 바꿉니다.
  fiscal: 정부가 돈을 얼마나 걷어 어디에 쓰는지 보면 정책 우선순위와 경기 흐름이 보입니다.
  policy: 정부 지원과 규제는 산업의 성장 속도와 기업의 수익성을 직접 바꿉니다.
  strategy: 기업이 어디에 투자하고 무엇을 접는지 보면 앞으로의 성장 경로가 보입니다.
  macro: 금리·환율·물가는 모든 기업과 가계에 영향을 주는 경제의 날씨입니다.

# 뉴스 제목·요약에서 찾을 단서와, 찾았을 때 그 기사에 이론을 대입하는 문장.
