# 배경지식이 없어도 노트를 읽을 수 있게 붙이는 용어 풀이.
# term: 표제어, also: 같은 뜻으로 찾을 표현, plain: 한 줄 뜻풀이,
# signal(선택): 뉴스 제목·요약에 이 말이 나오면 무엇을 뜻하는지(이론에 대입할 때 '기사 속 신호'로 쓴다)

# --- 회사 숫자
- term: 매출
  also: [매출액]
  plain: 1년 동안 물건·서비스를 팔아 들어온 돈 전체(비용을 빼기 전)
- term: 영업이익
  also: [영업손실]
  plain: 매출에서 원가와 판매·관리 비용을 빼고 본업으로 남긴 이익(마이너스면 영업손실)
  signal: 영업이익이 매출보다 빠르게 늘거나 줄면 고정비가 큰 회사일 가능성이 높다
- term: 순이익
  also: [당기순이익, 순손실]
  plain: 이자·세금까지 모두 빼고 최종적으로 남은 이익
- term: 총자산
  also: [자산총액, 자산총계]
  plain: 회사가 가진 재산 전부(빌린 돈으로 산 것 포함)
- term: 자기자본
  also: [자본총계]
  plain: 총자산에서 빚을 뺀, 주주 몫의 재산
- term: 부채비율
  plain: 빚 ÷ 자기자본. 100%면 빚과 주주 몫이 같고, 높을수록 빚에 기댄 회사
- term: 차입금
  also: [차입]
  plain: 은행 등에서 빌린 돈. 이자를 내야 한다
- term: 원가
  also: [매출원가]
  plain: 물건을 만들거나 서비스를 제공하는 데 든 비용
- term: 이익률
  also: [영업이익률, 마진]
  plain: 판 금액 중 이익으로 남는 비율
- term: 고정비
  plain: 많이 팔든 적게 팔든 똑같이 나가는 비용(임차료, 감가상각비, 정규직 인건비)
- term: 변동비
  plain: 팔고 만든 만큼 늘어나는 비용(원재료비 등)
- term: 손익분기점
  plain: 이익도 손실도 없는 매출 수준. 넘으면 그때부터 이익이 난다
- term: 감가상각비
  also: [감가상각]
  plain: 기계·건물 값을 쓰는 기간에 나눠 해마다 비용으로 잡는 것
- term: 현금흐름
  plain: 실제로 들어오고 나간 현금. 장부상 이익과 다를 수 있다
- term: 유동성
  plain: 당장 쓸 수 있는 현금이나 쉽게 현금으로 바꿀 수 있는 정도
  signal: 유동성 위기는 장부상 이익이 있어도 당장 갚을 현금이 모자란 상태라, 자산 매각이나 증자가 뒤따르기 쉽다
- term: 재무구조 개선
  also: [재무구조개선]
  plain: 빚을 줄이거나 자본을 늘려 회사 재무를 튼튼하게 만드는 것
- term: 자본잠식
  plain: 손실이 쌓여 주주가 처음 넣은 돈(자본금)까지 까먹은 상태
- term: 시가총액
  also: [시총]
  plain: 주가 × 발행 주식 수. 시장이 매긴 회사 전체 값
- term: PER
  plain: 주가 ÷ 주당순이익. 1년 이익의 몇 배를 주고 주식을 사는지
- term: PBR
  plain: 주가 ÷ 주당 순자산. 1배 미만이면 시장이 회사를 장부상 재산보다 싸게 본다는 뜻
- term: 주당순이익
  also: [EPS]
  plain: 순이익을 주식 수로 나눈 값. 주식 한 주가 번 이익
- term: 잠정실적
  also: [잠정 실적]
  plain: 회계감사를 받기 전에 미리 알리는 대략의 실적
- term: 컨센서스
  also: [시장 예상치, 시장예상치]
  plain: 증권사 분석가들의 실적 예상치 평균
- term: 어닝쇼크
  also: [어닝 쇼크, 어닝서프라이즈, 어닝 서프라이즈]
  plain: 실적이 예상보다 크게 나쁘게(쇼크) 또는 좋게(서프라이즈) 나온 것
  signal: 주가는 실적 자체보다 예상과의 차이에 반응한다
- term: 흑자전환
  also: [흑자 전환, 적자전환, 적자 전환]
  plain: 손실을 보던 회사가 이익을 내기 시작한 것(반대는 적자전환)
- term: 수주
  plain: 물건을 만들거나 공사를 해 달라는 주문을 따내는 것
  signal: 수주는 몇 년에 걸쳐 매출이 되므로, 금액을 계약 기간으로 나눠 1년 매출과 견줘 봐야 크기가 보인다
- term: 수주잔고
  plain: 따냈지만 아직 매출로 바뀌지 않은 남은 주문
- term: 재고
  plain: 팔려고 만들었거나 사 둔 물건 중 아직 안 팔린 것
  signal: 재고가 빠르게 쌓이면 수요가 꺾였다는 신호일 수 있고, 값을 깎아 팔면서 이익이 줄어든다
- term: 가동률
  plain: 공장이 낼 수 있는 최대 생산량 중 실제로 돌린 비율
  signal: 가동률이 떨어지면 고정비를 적은 물량이 나눠 지게 돼 제품 하나당 원가가 오른다

# --- 주식·지분
- term: 지분율
  also: [지분]
  plain: 회사 전체 주식 중 내가 가진 비율. 50%를 넘으면 보통 회사를 지배한다
- term: 경영권
  plain: 이사 선임 등 회사의 중요한 결정을 좌우할 수 있는 힘. 보통 최대주주가 가진다
  signal: 경영권이 걸린 거래는 시세보다 비싼 값(경영권 프리미엄)에 주식이 거래된다
- term: 최대주주
  plain: 주식을 가장 많이 가진 주주(가족 등 특수관계인 포함)
- term: 소액주주
  plain: 지분이 적은 일반 개인 주주들
- term: 프리미엄
  also: [경영권 프리미엄, 웃돈]
  plain: 회사의 원래 가치보다 더 얹어 주는 값
- term: 시너지
  plain: 둘이 합쳐서 따로일 때보다 더 생기는 이익(1+1이 2보다 커지는 부분)
- term: 다각화
  plain: 본업과 다른 새 사업으로 넓히는 것
- term: 자회사
  also: [종속회사]
  plain: 다른 회사가 지배(보통 지분 50% 초과)하는 회사
- term: 계열사
  also: [계열회사]
  plain: 같은 그룹에 속한 회사들
- term: 지주회사
  also: [홀딩스, 지주사]
  plain: 직접 사업보다 다른 회사 주식을 가지고 지배하는 것이 주된 일인 회사
- term: 유상증자
  plain: 새 주식을 찍어 돈을 받고 파는 것. 회사는 돈이 생기고 기존 주주 몫은 묽어진다
  signal: 시장은 유상증자를 '주가가 비싸다고 본다'는 신호로 읽는 경우가 많아, 발표 뒤 주가가 떨어지기 쉽다
- term: 무상증자
  plain: 돈을 받지 않고 기존 주주에게 새 주식을 나눠 주는 것. 회사 가치는 그대로다
- term: 감자
  news: false   # 뉴스에서는 채소 '감자'와 헷갈려 쓰지 않는다
  plain: 자본금을 줄이는 것. 주식 수를 줄여 장부상 손실을 메우거나(무상), 주주에게 돈을 돌려준다(유상)
- term: 희석
  also: [지분 희석]
  plain: 새 주식이 늘어 기존 주주의 몫(지분율)과 한 주당 가치가 줄어드는 것
- term: 자사주
  also: [자기주식]
  plain: 회사가 사들여 가지고 있는 자기 회사 주식
  signal: 자사주를 사서 소각하면 주식 수가 줄어 남은 주주의 몫이 커진다. 소각 없이 쌓아 두면 효과가 약하다
- term: 소각
  news: false   # 뉴스에서는 쓰레기 소각과 헷갈려 쓰지 않는다
  plain: 사들인 자기 주식을 없애는 것. 주식 수가 줄어 남은 주주의 몫이 커진다
- term: 배당
  also: [배당금]
  plain: 이익의 일부를 주주에게 현금 등으로 나눠 주는 것
  signal: 배당을 늘리면 주주에게는 좋지만, 그만큼 재투자할 돈은 줄어든다
- term: 배당성향
  plain: 순이익 중 배당으로 나눠 준 비율
- term: 주주환원
  plain: 배당과 자사주 매입·소각으로 번 돈을 주주에게 돌려주는 것
- term: 전환사채
  also: [CB]
  plain: 빌린 돈(사채)이지만 투자자가 원하면 정해진 가격에 주식으로 바꿀 수 있는 채권
  signal: 주가가 오르면 빚이 주식으로 바뀌어 기존 주주 몫이 묽어지고, 주가가 떨어지면 전환가격이 낮아져 희석이 더 커질 수 있다
- term: 신주인수권부사채
  also: [BW]
  plain: 사채에 '정해진 가격에 새 주식을 살 권리'가 붙은 채권
- term: 교환사채
  also: [EB]
  plain: 회사가 가진 다른 주식(자사주 등)으로 바꿀 수 있는 채권
- term: 전환가액
  also: [전환가격]
  plain: 전환사채를 주식으로 바꿀 때 적용하는 1주당 가격
- term: 리픽싱
  plain: 주가가 떨어지면 전환가격을 낮춰 주는 조건. 바꿀 주식 수가 늘어 희석이 커진다
- term: 표면이자율
  plain: 채권에 적힌 이자율. 0%면 이자 대신 주식 전환 차익을 노린다
- term: 사모
  plain: 소수의 정해진 투자자에게만 파는 방식(공모의 반대)
- term: 공모
  plain: 불특정 다수의 일반 투자자에게 주식이나 채권을 파는 것
- term: 공모가
  plain: 상장 전에 일반 투자자에게 파는 주식 1주의 가격
- term: 수요예측
  plain: 공모가를 정하려고 기관투자자에게 얼마에 몇 주를 살지 미리 받아 보는 절차
  signal: 수요예측 경쟁률이 높고 공모가가 희망 범위 위쪽에서 정해질수록 시장 기대가 크다
- term: 상장
  also: [IPO, 기업공개]
  plain: 회사 주식을 증권시장에서 누구나 사고팔 수 있게 올리는 것
  signal: 처음 파는 주식은 일부러 조금 싸게 정하는 경향이 있어 상장 첫날 주가가 오르는 경우가 많다
- term: 상장폐지
  plain: 증권시장에서 퇴출돼 더는 시장에서 사고팔 수 없게 되는 것
- term: 제3자배정
  also: [제3자 배정]
  plain: 기존 주주가 아닌 특정인에게 새 주식을 파는 방식
- term: 주주배정
  plain: 기존 주주에게 가진 주식 비율대로 새 주식을 살 기회를 주는 방식
- term: 공개매수
  plain: 기간·가격·수량을 공개하고 시장 밖에서 주식을 사들이는 것. 보통 경영권 확보용
  signal: 공개매수 가격은 보통 시세보다 높아, 그 차이가 경영권에 매긴 웃돈이다
- term: 행동주의 펀드
  also: [행동주의, 주주행동주의]
  plain: 지분을 사서 배당 확대·지배구조 개선 같은 변화를 회사에 요구하는 투자자
- term: 밸류업
  also: [기업가치 제고]
  plain: 주가가 회사 가치에 비해 낮게 평가되는 문제를 풀려는 정책과 기업 계획

# --- 구조 개편
- term: 합병
  plain: 두 회사가 하나로 합치는 것. 없어지는 회사 주주는 남는 회사 주식을 받는다
- term: 합병비율
  plain: 없어지는 회사 주식 1주를 남는 회사 주식 몇 주로 바꿔 주는지
- term: 물적분할
  plain: 사업 일부를 떼어 새 회사를 만들고, 그 회사 주식을 기존 회사가 100% 갖는 분할
  signal: 떼어 낸 회사를 따로 상장하면 기존 회사 주주 몫이 묽어진다는 '쪼개기 상장' 논란이 따른다
- term: 인적분할
  plain: 사업 일부를 떼어 새 회사를 만들고, 그 주식을 기존 주주들이 지분대로 나눠 받는 분할
- term: 주식매수청구권
  plain: 합병·분할 등에 반대하는 주주가 회사에 '내 주식을 공정한 값에 사 달라'고 요구할 권리
- term: 영업양수
  also: [영업양도]
  plain: 회사의 사업 부문(인력·설비·거래처 포함)을 통째로 사고(양수) 파는(양도) 것
- term: 유형자산
  plain: 토지·건물·기계처럼 형체가 있고 오래 쓰는 자산
- term: 세일 앤 리스백
  also: [세일앤리스백, 리스백]
  plain: 가진 건물·설비를 판 뒤 다시 빌려 쓰는 것. 계속 쓰면서 현금을 먼저 받는다
- term: 구조조정
  plain: 사업이나 인력을 줄이거나 바꿔 회사를 다시 짜는 것
  signal: 구조조정은 당장 위로금·처분손실로 비용이 들지만, 성공하면 다음 해부터 고정비가 줄어든다
- term: 회생절차
  also: [법정관리, 기업회생]
  plain: 법원 관리 아래 빚을 조정하며 회사를 살리는 절차
- term: 워크아웃
  plain: 채권단(돈을 빌려준 금융회사들)이 주도해 빚을 조정하는 구조조정

# --- 회계
- term: 영업권
  plain: 회사를 살 때 순자산 가치보다 더 준 돈. 브랜드·고객 같은 보이지 않는 가치의 값
- term: 손상차손
  also: [손상]
  plain: 자산 가치가 장부값보다 떨어져 그 차이를 손실로 처리하는 것
  signal: 인수 때 비싸게 산 회사가 기대만큼 못 벌면 몇 년 뒤 영업권 손상으로 큰 손실이 잡힌다
- term: 연결재무제표
  also: [연결 기준]
  plain: 지배하는 회사들의 재무제표를 하나로 합친 것
- term: 지분법
  plain: 영향력만 있는 회사(보통 지분 20~50%)의 이익 중 내 몫만 내 이익에 더하는 회계 방법
- term: 공정가치
  plain: 지금 시장에서 거래된다면 받을 값
- term: 충당부채
  also: [충당금]
  plain: 아직 나가지 않았지만 나갈 가능성이 높은 돈을 미리 비용·부채로 잡은 것
- term: 감사의견
  also: [의견거절, 한정의견, 적정의견, 감사 의견]
  plain: 회계법인이 재무제표가 믿을 만한지 매긴 평가. '적정'이 정상이고 '한정·부적정·의견거절'은 문제 신호
  signal: 의견거절이나 부적정이 나오면 상장폐지 사유가 될 수 있어 주가가 크게 흔들린다
- term: 분식회계
  also: [회계부정, 회계 부정, 회계처리 위반]
  plain: 실적을 좋아 보이게 장부를 조작하는 것
- term: 이연법인세
  plain: 회계 이익과 세법상 소득의 시점 차이 때문에 '나중에 내거나 덜 낼 세금'으로 적어 두는 것

# --- 세금
- term: 법인세
  plain: 회사가 번 이익(과세표준)에 매기는 세금
  signal: 법인세를 올리면 세수는 늘지만 그 부담은 결국 주주·직원·소비자에게 나뉘어 돌아간다
- term: 상속세
  also: [증여세]
  plain: 재산을 물려받을 때(상속)나 살아 있을 때 받을 때(증여) 내는 세금
  signal: 최대주주 지분을 물려줄 때 세금이 커서, 승계 전후로 지분 매각·배당 확대·지배구조 개편이 함께 나온다
- term: 부가가치세
  also: [부가세]
  plain: 거래 단계마다 새로 붙은 가치에 매기는 10% 세금. 실제 부담은 최종 소비자가 진다
- term: 세액공제
  plain: 계산된 세금에서 일정 금액을 직접 깎아 주는 것
  signal: 투자나 연구개발에 세액공제를 늘리는 것은 기업이 그 활동을 늘리게 하려는 정책 신호다
- term: 감면
  also: [비과세, 면세]
  plain: 세금을 매기지 않거나 줄여 주는 것
- term: 양도소득세
  also: [양도세]
  plain: 주식·부동산을 팔아 남긴 차익에 매기는 세금
- term: 증권거래세
  also: [거래세]
  plain: 주식을 팔 때마다 판 금액에 붙는 세금
- term: 분리과세
  plain: 다른 소득과 합치지 않고 따로 정해진 세율로 세금을 매기는 것
  signal: 배당소득 분리과세는 고액 배당을 받는 대주주의 세 부담을 낮춰 회사가 배당을 늘리게 하려는 장치다
- term: 세수
  also: [세입]
  plain: 정부·지자체가 실제로 걷은 세금(세입은 들어올 돈 전체)
  signal: 세수가 늘면 예산을 늘릴 여력이 생기고, 줄면(세수 결손) 지출을 줄이거나 빚을 내야 한다
- term: 관세
  plain: 수입품에 매기는 세금
  signal: 관세가 오르면 수입품 값이 올라 그 나라 소비자와 수입 기업이 상당 부분을 떠안고, 수출 기업은 현지 생산을 늘리는 쪽으로 움직인다
- term: 글로벌 최저한세
  also: [최저한세]
  plain: 큰 다국적기업이 나라마다 최소 15%의 세금은 내게 하는 국제 규칙

# --- 법·지배구조
- term: 이사회
  plain: 주주가 뽑은 이사들이 모여 회사의 중요한 일을 결정하는 기구
- term: 사외이사
  also: [독립이사]
  plain: 회사 밖에서 뽑아 경영진을 견제하는 이사
- term: 주주총회
  also: [주총]
  plain: 주주들이 주식 수만큼 표를 던져 중요한 안건을 정하는 회의
  signal: 주총 표 대결은 소액주주와 기관투자자가 어느 편에 서느냐로 결과가 갈린다
- term: 집중투표제
  also: [집중투표]
  plain: 이사 여러 명을 뽑을 때 표를 한 후보에게 몰아줄 수 있게 해 소수주주도 이사를 뽑게 하는 제도
- term: 상법 개정
  also: [상법개정]
  plain: 회사 운영 규칙을 정한 상법을 바꾸는 것. 최근에는 소액주주 보호 강화가 핵심이다
  signal: 이사의 충실의무 확대, 자사주 소각 의무 같은 개정은 대주주보다 소액주주에게 유리한 방향이다
- term: 주주대표소송
  also: [대표소송]
  plain: 이사가 회사에 손해를 끼쳤는데 회사가 가만히 있으면 주주가 대신 내는 소송
- term: 공정거래위원회
  also: [공정위]
  plain: 독과점과 불공정 거래를 감시하는 정부 기관
- term: 과징금
  plain: 법을 어긴 기업에 정부가 매기는 금전 제재
  signal: 과징금은 관련 매출의 일정 비율로 매기는 경우가 많아, 회사 매출·이익과 견줘 봐야 실제 타격이 보인다
- term: 독과점
  also: [독점, 과점]
  plain: 한 회사(독점)나 몇 회사(과점)가 시장 대부분을 차지한 상태
  signal: 경쟁자가 적을수록 값을 올려도 손님이 갈 데가 없어 이익률이 높아지기 쉽다
- term: 일감 몰아주기
  plain: 총수 일가가 가진 회사에 그룹 일감을 몰아 이익을 넘겨주는 것

# --- 시장·경쟁·마케팅
- term: 점유율
  also: [시장점유율]
  plain: 시장 전체 판매 중 한 회사가 차지하는 비율
- term: 진입장벽
  plain: 새 경쟁자가 시장에 들어오기 어렵게 만드는 요인(큰 투자비, 규제, 특허, 브랜드)
- term: 플랫폼
  plain: 판매자와 구매자처럼 서로 다른 이용자를 연결해 주고 수수료를 받는 사업
  signal: 이용자가 많을수록 더 많은 이용자가 몰려 1등이 독식하기 쉽고, 그 힘으로 수수료를 올릴 수 있다
- term: 수수료
  plain: 거래를 연결하거나 대신 처리해 주고 받는 돈
- term: 구독
  plain: 매달 일정 금액을 내고 계속 이용하는 방식
- term: 가격 인상
  also: [가격인상, 요금 인상, 값 인상, 가격을 올]
  plain: 판매 가격을 올리는 것
  signal: 값을 올려도 손님이 별로 줄지 않는 상품이면 매출이 늘고, 대체품이 많으면 손님이 떠나 오히려 줄 수 있다
- term: 가격 인하
  also: [가격인하, 요금 인하, 값 인하]
  plain: 판매 가격을 내리는 것
  signal: 값을 내려 판매량이 그 이상 늘어야 매출이 늘어난다. 경쟁사가 따라 내리면 다 같이 이익만 줄어든다
- term: 원재료
  also: [원자재]
  plain: 제품을 만드는 데 들어가는 재료
  signal: 원재료 값이 오르면 판매 가격에 넘길 수 있는 회사(가격 결정력이 큰 회사)만 이익을 지킨다
- term: 브랜드
  plain: 이름과 이미지 덕분에 같은 제품이라도 더 비싸게, 더 많이 팔리게 하는 힘
- term: 마케팅
  plain: 고객을 찾고 제품을 알리고 사게 만드는 모든 활동
- term: 스타트업
  plain: 새 기술이나 사업 모델로 빠르게 크려는 초기 기업
- term: 시리즈
  also: [시리즈A, 시리즈B, 시리즈C, 프리IPO]
  plain: 스타트업이 단계별로 받는 투자 라운드. A에서 B, C로 갈수록 규모가 크다
- term: 기업가치
  also: [밸류에이션]
  plain: 회사 전체를 얼마로 보는지에 대한 값
  signal: 투자 금액 ÷ 받은 지분율로 기업가치를 거꾸로 계산해 매출·이익과 견줘 보면 비싼지 싼지 보인다
- term: 유니콘
  plain: 기업가치 1조원(10억 달러) 이상인 비상장 스타트업

# --- 인사·노동
- term: 임단협
  also: [임금협상, 단체협약, 임금 협상]
  plain: 노조와 회사가 임금과 근로조건을 정하는 협상
  signal: 임금이 오르면 고정비가 늘어 이익을 누르지만, 협상이 깨져 파업으로 가면 생산 차질 비용이 더 클 수 있다
- term: 파업
  plain: 노조가 요구를 관철하려고 집단으로 일을 멈추는 것
- term: 희망퇴직
  also: [명예퇴직]
  plain: 회사가 조건(위로금 등)을 걸고 스스로 그만둘 직원을 받는 것
- term: 성과급
  plain: 회사나 개인의 성과에 따라 추가로 주는 보상
  signal: 성과급 기준이 무엇이냐(영업이익, 주가)에 따라 직원과 경영진이 움직이는 방향이 달라진다
- term: 노조
  also: [노동조합]
  plain: 근로자들이 근로조건을 지키고 높이려고 만든 단체

# --- 거시경제
- term: 기준금리
  also: [금리 인하, 금리 인상, 금리인하, 금리인상]
  plain: 한국은행이 정하는 정책 금리. 시중 금리의 기준이 된다
  signal: 금리를 내리면 돈 빌리기가 쉬워져 소비·투자가 늘고, 올리면 반대로 물가와 대출을 누른다
- term: 환율
  also: [원·달러 환율, 원달러 환율, 원화 약세, 원화 강세]
  plain: 우리 돈과 외국 돈을 바꾸는 비율
  signal: 환율이 오르면(원화 약세) 수출 기업은 원화로 받는 돈이 늘어 유리하고, 수입 원자재를 쓰는 기업은 불리하다
- term: 물가
  also: [소비자물가, 인플레이션, 물가상승률]
  plain: 여러 물건·서비스 가격의 평균 수준
  signal: 물가가 빨리 오르면 한국은행이 금리를 올려 누르려 하고, 같은 월급으로 살 수 있는 양이 줄어든다
- term: 경기 침체
  also: [경기침체, 경기둔화, 경기 둔화, 경기 회복, 경기회복, 불황, 호황]
  plain: 경제 전체의 활동이 크게 위축되는 것(침체)과 다시 살아나는 것(회복). 경기는 확장과 수축을 되풀이한다
- term: 성장률
  also: [GDP, 국내총생산, 경제성장률]
  plain: 한 나라 안에서 1년 동안 새로 만든 가치(GDP)가 늘어난 비율
- term: 수출
  plain: 우리나라에서 만든 물건·서비스를 외국에 파는 것
- term: 무역수지
  also: [경상수지]
  plain: 수출에서 수입을 뺀 값. 플러스면 흑자
- term: 공급망
  plain: 원재료에서 부품, 완제품, 소비자까지 이어지는 생산·유통의 사슬
  signal: 공급망이 끊기면 부품 하나가 없어 전체 생산이 멈출 수 있어, 기업들은 공급처를 여러 곳으로 나눈다
- term: 반도체
  plain: 전자기기의 두뇌와 기억장치 역할을 하는 부품. 한국 수출 1위 품목
- term: HBM
  also: [고대역폭메모리, 고대역폭 메모리]
  plain: 여러 층의 D램을 쌓아 데이터를 아주 빠르게 주고받게 만든 AI용 고성능 메모리
- term: 파운드리
  plain: 다른 회사가 설계한 반도체를 주문받아 대신 만들어 주는 사업

# --- 재정·복지
- term: 본예산
  also: [예산안, 예산]
  plain: 정부·지자체가 한 해 동안 걷을 돈과 쓸 돈을 처음 정식으로 정한 계획(나중에 고치는 것은 추경)
  signal: 예산이 커졌다면 그 돈이 늘어난 세금에서 오는지 빚에서 오는지, 매년 반복될 지출인지가 핵심이다
- term: 추경
  also: [추가경정예산]
  plain: 한 해 예산을 확정한 뒤 돈이 더 필요해 고쳐 짜는 예산
  signal: 추경은 대개 경기 부양이나 재난 대응용이라, 재원을 국채(빚)로 마련하는지가 중요하다
- term: 국가채무
  also: [나랏빚, 국채]
  plain: 정부가 갚아야 할 빚. 국채는 정부가 돈을 빌리려고 발행하는 채권
  signal: 빚의 크기보다 GDP 대비 비율과 늘어나는 속도가 중요하다
- term: 재정적자
  also: [관리재정수지, 재정수지]
  plain: 정부가 쓴 돈이 걷은 돈보다 많은 상태
- term: 교부세
  also: [지방교부세]
  plain: 중앙정부가 국세 일부를 지자체에 나눠 주는 돈
- term: 국민연금
  plain: 일하는 동안 보험료를 내고 나이 들어 연금을 받는 공적 연금
  signal: 보험료율과 받는 돈(소득대체율)이 바뀌면 세대마다 부담과 혜택이 달라진다
- term: 건강보험
  plain: 보험료를 모아 병원비 일부를 대신 내 주는 공적 보험
- term: 복지
  also: [지원금, 소비쿠폰, 바우처]
  plain: 정부가 소득과 생활을 돕기 위해 주는 지원
  signal: 나눠 준 돈이 실제 소비로 얼마나 이어지느냐(재정승수)가 경기 효과를 가른다
- term: 공공요금
  also: [전기요금, 가스요금, 전기료]
  plain: 전기·가스·수도처럼 정부가 값을 정하거나 승인하는 요금
  signal: 요금을 원가보다 낮게 묶으면 그 차이가 공기업 빚으로 쌓였다가 결국 세금이나 요금으로 돌아온다

# --- ESG·에너지
- term: ESG
  plain: 환경(E)·사회(S)·지배구조(G)를 기업 평가에 함께 보는 기준
- term: 탄소배출권
  also: [배출권, 탄소중립, 온실가스, 탄소세]
  plain: 온실가스를 내보낼 수 있는 권리. 사고팔 수 있다
  signal: 배출에 값을 매기는 규제가 강해질수록 많이 배출하는 기업의 비용이 늘어난다
- term: 재생에너지
  also: [태양광, 풍력, 신재생]
  plain: 햇빛·바람처럼 다시 쓸 수 있는 자원으로 만드는 에너지
- term: 원전
  also: [원자력, SMR]
  plain: 원자력으로 전기를 만드는 발전소(SMR은 작은 모듈형 원전)
