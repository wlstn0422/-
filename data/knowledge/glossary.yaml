# 노트의 '용어 해설'에 쓰는 용어 사전(경영학·경제학 교과서 문체).
# term: 표제어, also: 같은 뜻으로 찾을 표현, plain: 정의,
# signal(선택): 뉴스 제목·요약에 이 용어가 나왔을 때의 의미(뉴스 사례의 '용어의 의미'로 쓴다),
# news: false 는 뉴스에서 다른 뜻으로 자주 쓰이는 말(채소 '감자', 쓰레기 '소각')이라 뉴스 매칭에서 뺀다는 뜻

- term: "매출"
  also: ["매출액"]
  plain: "일정 기간 동안 재화나 용역을 판매하여 얻은 수익의 총액(비용을 차감하기 전 금액)"
- term: "영업이익"
  also: ["영업손실"]
  plain: "매출액에서 매출원가와 판매비·관리비를 차감한 이익. 기업 본연의 영업활동 성과를 나타내며, 음수이면 영업손실이라 한다"
  signal: "영업이익이 매출액보다 빠르게 증감한다면 고정비 비중이 높은 기업일 가능성이 크다"
- term: "순이익"
  also: ["당기순이익", "순손실"]
  plain: "영업이익에 영업외손익을 가감하고 법인세비용을 차감한 최종 이익"
- term: "총자산"
  also: ["자산총액", "자산총계"]
  plain: "기업이 보유한 자산의 총액(부채로 조달한 자산을 포함한다)"
- term: "자기자본"
  also: ["자본총계"]
  plain: "총자산에서 부채를 차감한 금액으로, 주주에게 귀속되는 순자산"
- term: "부채비율"
  plain: "부채총계를 자기자본으로 나눈 비율. 100%이면 부채와 자기자본이 같고, 높을수록 부채 의존도가 크다"
- term: "차입금"
  also: ["차입"]
  plain: "금융기관 등으로부터 빌린 자금. 이자를 지급해야 하는 부채이다"
- term: "원가"
  also: ["매출원가"]
  plain: "재화를 생산하거나 용역을 제공하는 데 소요된 비용"
- term: "이익률"
  also: ["영업이익률", "마진"]
  plain: "매출액 대비 이익의 비율"
- term: "고정비"
  plain: "생산량이나 판매량과 관계없이 일정하게 발생하는 비용(임차료, 감가상각비, 정규직 인건비 등)"
- term: "변동비"
  plain: "생산량이나 판매량에 비례하여 증감하는 비용(원재료비 등)"
- term: "손익분기점"
  plain: "총수익과 총비용이 일치하여 이익이 0이 되는 매출액 또는 판매량"
- term: "감가상각비"
  also: ["감가상각"]
  plain: "유형자산의 취득원가를 내용연수에 걸쳐 체계적으로 배분하여 인식하는 비용"
- term: "현금흐름"
  plain: "일정 기간 동안 실제로 유입·유출된 현금. 발생주의 회계에 따른 이익과 다를 수 있다"
- term: "유동성"
  plain: "자산을 손실 없이 신속하게 현금으로 전환할 수 있는 정도, 또는 즉시 사용할 수 있는 현금의 여유"
  signal: "기업의 유동성이 부족하면 장부상 이익이 있더라도 지급 능력이 부족해 자산 매각이나 증자가 뒤따르기 쉽다(시장 전체의 유동성은 경제 내 자금 공급의 충분성을 뜻한다)"
- term: "재무구조 개선"
  also: ["재무구조개선"]
  plain: "부채를 줄이거나 자기자본을 늘려 재무 안정성을 높이는 것"
- term: "자본잠식"
  plain: "누적 결손으로 자기자본이 납입자본금보다 작아진 상태"
- term: "시가총액"
  also: ["시총"]
  plain: "주가에 발행주식 수를 곱한 금액. 시장이 평가한 기업의 지분 가치이다"
- term: "PER"
  plain: "주가를 주당순이익으로 나눈 값. 투자자가 이익 1원에 대해 지불하는 가격의 배수이다"
- term: "PBR"
  plain: "주가를 주당순자산으로 나눈 값. 1배 미만이면 시장이 기업을 장부상 순자산보다 낮게 평가한다는 의미이다"
- term: "주당순이익"
  also: ["EPS"]
  plain: "당기순이익을 발행주식 수로 나눈 값"
- term: "잠정실적"
  also: ["잠정 실적"]
  plain: "외부감사를 받기 전에 미리 공시하는 개략적인 영업실적"
- term: "컨센서스"
  also: ["시장 예상치", "시장예상치"]
  plain: "증권사 분석가들이 제시한 실적 전망치의 평균"
- term: "어닝쇼크"
  also: ["어닝 쇼크", "어닝서프라이즈", "어닝 서프라이즈"]
  plain: "실적이 시장 예상치를 크게 하회한 경우(크게 상회하면 어닝서프라이즈)"
  signal: "주가는 실적의 절대 수준보다 시장 예상치와의 차이에 반응한다"
- term: "흑자전환"
  also: ["흑자 전환", "적자전환", "적자 전환"]
  plain: "손실을 기록하던 기업이 이익을 기록하게 된 것(반대는 적자전환)"
- term: "수주"
  plain: "재화의 생산이나 공사 수행에 관한 주문을 받는 것"
  signal: "수주 금액은 여러 해에 걸쳐 매출로 인식되므로, 계약 기간으로 나누어 연간 매출액과 비교해야 규모를 판단할 수 있다"
- term: "수주잔고"
  plain: "수주하였으나 아직 매출로 인식되지 않은 계약 잔액"
- term: "재고"
  plain: "판매를 위해 보유하고 있는 재화(제품·상품·원재료 등)"
  signal: "재고가 빠르게 누적되면 수요 둔화의 신호일 수 있으며, 할인 판매로 이익률이 하락할 수 있다"
- term: "가동률"
  plain: "생산설비의 최대 생산능력 대비 실제 생산량의 비율"
  signal: "가동률이 하락하면 고정비를 적은 생산량이 분담하게 되어 단위당 원가가 상승한다"
- term: "지분율"
  also: ["지분"]
  plain: "발행주식 총수 중 특정 주주가 보유한 주식의 비율. 50%를 초과하면 통상 회사를 지배한다"
- term: "경영권"
  plain: "이사 선임 등 회사의 주요 의사결정을 좌우할 수 있는 권한. 통상 최대주주가 보유한다"
  signal: "경영권이 이전되는 거래에서는 주식이 시가보다 높은 가격(경영권 프리미엄)에 거래된다"
- term: "최대주주"
  plain: "특수관계인을 포함하여 가장 많은 주식을 보유한 주주"
- term: "소액주주"
  plain: "소량의 지분을 보유한 일반 주주"
- term: "프리미엄"
  also: ["경영권 프리미엄", "웃돈"]
  plain: "대상의 본래 가치를 초과하여 지급하는 금액"
- term: "시너지"
  plain: "둘 이상의 기업이 결합하여 개별적으로 존재할 때보다 추가로 창출하는 가치"
- term: "다각화"
  plain: "기존 사업과 다른 새로운 사업 영역으로 진출하는 것"
- term: "자회사"
  also: ["종속회사"]
  plain: "다른 회사(지배회사)가 지배하는 회사. 통상 지분 50%를 초과하여 보유한 경우를 말한다"
- term: "계열사"
  also: ["계열회사"]
  plain: "동일한 기업집단에 속한 회사"
- term: "지주회사"
  also: ["홀딩스", "지주사"]
  plain: "다른 회사의 주식을 소유하여 그 회사를 지배하는 것을 주된 사업으로 하는 회사"
- term: "유상증자"
  plain: "신주를 발행하여 대가를 받고 매각하는 것. 회사는 자금을 조달하고 기존 주주의 지분은 희석된다"
  signal: "시장은 유상증자를 경영진이 주가를 고평가로 판단한다는 신호로 해석하는 경우가 많아, 발표 후 주가가 하락하기 쉽다"
- term: "무상증자"
  plain: "대가 없이 기존 주주에게 신주를 배정하는 것. 회사의 가치는 변하지 않는다"
- term: "감자"
  news: false
  plain: "자본금을 감소시키는 것. 주식 수를 줄여 결손을 보전하거나(무상감자) 주주에게 자금을 반환한다(유상감자)"
- term: "희석"
  also: ["지분 희석"]
  plain: "신주 발행으로 기존 주주의 지분율과 주당 가치가 낮아지는 것"
- term: "자사주"
  also: ["자기주식"]
  plain: "회사가 취득하여 보유하고 있는 자사 발행 주식(자기주식)"
  signal: "취득한 자기주식을 소각하면 발행주식 수가 줄어 잔존 주주의 지분 가치가 높아진다. 소각하지 않으면 효과가 제한적이다"
- term: "소각"
  news: false
  plain: "취득한 자기주식을 소멸시켜 발행주식 수를 줄이는 것"
- term: "배당"
  also: ["배당금"]
  plain: "이익의 일부를 주주에게 현금 등으로 분배하는 것"
  signal: "배당 확대는 주주에게 유리하지만 재투자 재원은 그만큼 감소한다"
- term: "배당성향"
  plain: "당기순이익 중 배당금으로 지급한 비율"
- term: "주주환원"
  plain: "배당과 자기주식 취득·소각을 통해 이익을 주주에게 돌려주는 것"
- term: "전환사채"
  also: ["CB"]
  plain: "사채이지만 투자자가 원하면 미리 정한 가격에 주식으로 전환할 수 있는 채권"
  signal: "주가가 오르면 부채가 주식으로 전환되어 기존 주주의 지분이 희석되고, 주가가 하락하면 전환가액이 조정되어 희석 규모가 더 커질 수 있다"
- term: "신주인수권부사채"
  also: ["BW"]
  plain: "사채에 미리 정한 가격으로 신주를 인수할 수 있는 권리가 결합된 채권"
- term: "교환사채"
  also: ["EB"]
  plain: "발행회사가 보유한 다른 주식(자기주식 등)으로 교환할 수 있는 채권"
- term: "전환가액"
  also: ["전환가격"]
  plain: "전환사채를 주식으로 전환할 때 적용되는 1주당 가격"
- term: "리픽싱"
  plain: "주가 하락 시 전환가액을 하향 조정하는 조건. 전환으로 발행될 주식 수가 늘어 희석 효과가 커진다"
- term: "표면이자율"
  plain: "채권 발행 시 정한 이자율. 0%이면 투자자는 이자 대신 주식 전환에 따른 차익을 기대한다"
- term: "사모"
  plain: "소수의 특정 투자자를 대상으로 증권을 발행하는 방식(공모의 반대)"
- term: "공모"
  plain: "불특정 다수의 투자자를 대상으로 증권을 발행하거나 매각하는 방식"
- term: "공모가"
  plain: "상장 전 일반 투자자에게 매각하는 주식의 1주당 가격"
- term: "수요예측"
  plain: "공모가를 결정하기 위해 기관투자자로부터 희망 매수 가격과 수량을 미리 받는 절차"
  signal: "수요예측 경쟁률이 높고 공모가가 희망 범위 상단에서 결정될수록 시장의 기대가 크다"
- term: "상장"
  plain: "회사의 주식을 증권시장에서 매매할 수 있도록 등록하는 것"
- term: "IPO"
  also: ["기업공개"]
  plain: "회사가 처음으로 불특정 다수의 투자자에게 주식을 매각하고 증권시장에 상장하는 것(기업공개)"
- term: "상장폐지"
  plain: "증권시장에서 퇴출되어 더 이상 시장에서 매매할 수 없게 되는 것"
- term: "제3자배정"
  also: ["제3자 배정"]
  plain: "기존 주주가 아닌 특정인에게 신주를 배정하는 방식"
- term: "주주배정"
  plain: "기존 주주에게 보유 지분에 비례하여 신주 인수 기회를 부여하는 방식"
- term: "공개매수"
  plain: "매수 기간·가격·수량을 공개하고 증권시장 밖에서 주식을 매입하는 것. 주로 경영권 확보에 활용된다"
  signal: "공개매수 가격은 통상 시가보다 높으며, 그 차이는 경영권에 대해 지급하는 프리미엄이다"
- term: "행동주의 펀드"
  also: ["행동주의", "주주행동주의"]
  plain: "지분을 취득한 뒤 배당 확대나 지배구조 개선 등 경영 변화를 요구하는 투자자"
- term: "밸류업"
  also: ["기업가치 제고"]
  plain: "주가가 내재가치에 비해 낮게 평가되는 문제를 해소하기 위한 정책과 기업의 계획"
- term: "합병"
  plain: "둘 이상의 회사가 하나로 결합하는 것. 소멸회사의 주주는 존속회사의 주식을 받는다"
- term: "합병비율"
  plain: "소멸회사 주식 1주에 대해 교부하는 존속회사 주식의 수"
- term: "물적분할"
  plain: "사업 일부를 분리하여 신설회사를 세우고, 그 주식을 분할회사가 100% 보유하는 분할"
  signal: "분리된 회사를 별도로 상장하면 기존 주주의 지분 가치가 희석된다는 이른바 '쪼개기 상장' 논란이 따른다"
- term: "인적분할"
  plain: "사업 일부를 분리하여 신설회사를 세우고, 그 주식을 기존 주주가 지분율에 따라 배정받는 분할"
- term: "주식매수청구권"
  plain: "합병·분할 등에 반대하는 주주가 회사에 공정한 가격으로 보유 주식의 매수를 청구할 수 있는 권리"
- term: "영업양수"
  also: ["영업양도"]
  plain: "회사의 사업 부문(인력·설비·거래처 포함)을 일괄하여 인수(양수)하거나 매각(양도)하는 것"
- term: "유형자산"
  plain: "토지·건물·기계장치처럼 물리적 형태가 있고 장기간 사용하는 자산"
- term: "세일 앤 리스백"
  also: ["세일앤리스백", "리스백"]
  plain: "보유 자산을 매각한 뒤 다시 임차하여 사용하는 거래. 자산을 계속 사용하면서 현금을 먼저 확보한다"
- term: "구조조정"
  plain: "사업이나 인력을 축소·재편하여 기업 구조를 재설계하는 것"
  signal: "구조조정은 단기적으로 위로금·처분손실 등 비용을 발생시키지만, 성공하면 이후 고정비가 감소한다"
- term: "회생절차"
  also: ["법정관리", "기업회생"]
  plain: "법원의 관리 아래 채무를 조정하여 기업의 회생을 도모하는 절차"
- term: "워크아웃"
  plain: "채권단(자금을 대여한 금융기관)이 주도하여 채무를 조정하는 구조조정"
- term: "영업권"
  plain: "사업결합 시 피취득자의 순자산 공정가치를 초과하여 지급한 대가. 개별적으로 식별할 수 없는 무형의 가치를 나타낸다"
- term: "손상차손"
  also: ["영업권 손상", "손상 처리", "손상 인식"]
  plain: "자산의 회수가능액이 장부금액에 미달하여 그 차이를 손실로 인식하는 것"
  signal: "높은 가격에 인수한 기업이 기대만큼 성과를 내지 못하면 수년 후 영업권 손상차손으로 큰 손실이 인식된다"
- term: "연결재무제표"
  also: ["연결 기준"]
  plain: "지배기업과 종속기업의 재무제표를 하나의 경제적 실체로 합산한 재무제표"
- term: "지분법"
  plain: "유의적 영향력이 있는 피투자회사(통상 지분 20~50%)의 순이익 중 지분 해당액을 투자회사의 이익에 반영하는 회계처리"
- term: "공정가치"
  plain: "측정일에 시장참여자 사이의 정상적인 거래에서 자산을 매도할 때 받을 가격"
- term: "충당부채"
  also: ["충당금"]
  plain: "지출 시기나 금액이 불확실하지만 자원 유출 가능성이 높고 금액을 신뢰성 있게 추정할 수 있는 부채"
- term: "감사의견"
  also: ["의견거절", "한정의견", "적정의견", "감사 의견"]
  plain: "외부감사인이 재무제표의 신뢰성에 대해 표명한 의견. '적정'이 정상이며 '한정·부적정·의견거절'은 문제를 의미한다"
  signal: "의견거절이나 부적정 의견은 상장폐지 사유가 될 수 있어 주가에 큰 영향을 미친다"
- term: "분식회계"
  also: ["회계부정", "회계 부정", "회계처리 위반"]
  plain: "실적을 부풀리기 위해 회계 장부를 조작하는 행위"
- term: "이연법인세"
  plain: "회계상 이익과 세법상 과세소득의 일시적 차이로 인해 미래에 납부하거나 감면받을 법인세"
- term: "법인세"
  plain: "법인의 소득(과세표준)에 부과하는 조세"
  signal: "법인세를 인상하면 세수는 증가하지만 그 부담은 결국 주주·근로자·소비자에게 나뉘어 귀착된다"
- term: "상속세"
  also: ["증여세"]
  plain: "사망으로 재산을 무상 이전받을 때(상속) 또는 생전에 무상으로 받을 때(증여) 부과되는 조세"
  signal: "지배주주 지분을 승계할 때 세부담이 커서, 승계 전후로 지분 매각·배당 확대·지배구조 개편이 함께 나타난다"
- term: "부가가치세"
  also: ["부가세"]
  plain: "거래 단계마다 창출된 부가가치에 10%를 부과하는 조세. 최종소비자가 실질적으로 부담한다"
- term: "세액공제"
  plain: "산출세액에서 일정 금액을 직접 차감해 주는 것"
  signal: "투자나 연구개발에 대한 세액공제 확대는 기업의 해당 활동을 촉진하려는 정책 의도를 담고 있다"
- term: "감면"
  also: ["비과세", "면세"]
  plain: "조세를 부과하지 않거나 경감하는 것"
- term: "양도소득세"
  also: ["양도세"]
  plain: "주식·부동산 등을 양도하여 발생한 차익에 부과하는 조세"
- term: "증권거래세"
  also: ["거래세"]
  plain: "주식을 매도할 때마다 매도 금액에 부과하는 조세"
- term: "분리과세"
  plain: "다른 소득과 합산하지 않고 별도의 세율로 과세하는 방식"
  signal: "배당소득 분리과세는 고액 배당을 받는 지배주주의 세부담을 낮추어 기업의 배당 확대를 유도하려는 장치이다"
- term: "세수"
  also: ["세입"]
  plain: "정부·지방자치단체가 실제로 징수한 조세 수입(세입은 조세를 포함한 수입 전체)"
  signal: "세수가 증가하면 재정지출을 확대할 여력이 생기고, 감소하면(세수 결손) 지출을 축소하거나 국채를 발행해야 한다"
- term: "관세"
  plain: "수입품에 부과하는 조세"
  signal: "관세가 인상되면 수입품 가격이 올라 수입국의 소비자와 수입 기업이 상당 부분을 부담하며, 수출 기업은 현지 생산을 확대하는 방향으로 대응한다"
- term: "글로벌 최저한세"
  also: ["최저한세"]
  plain: "대규모 다국적기업이 각 국가에서 최소 15%의 실효세율을 부담하도록 하는 국제 조세 규범"
- term: "이사회"
  plain: "주주총회에서 선임된 이사들로 구성되어 회사의 업무집행에 관한 의사결정을 하는 기관"
- term: "사외이사"
  also: ["독립이사"]
  plain: "회사의 상무에 종사하지 않으며 경영진을 감시·견제하는 이사"
- term: "주주총회"
  also: ["주총"]
  plain: "주주들이 보유 주식 수에 비례한 의결권으로 회사의 주요 안건을 결정하는 기관"
  signal: "주주총회의 표 대결은 소액주주와 기관투자자의 의결권 향방에 따라 결과가 결정된다"
- term: "집중투표제"
  also: ["집중투표"]
  plain: "이사를 여러 명 선임할 때 의결권을 특정 후보에게 집중할 수 있게 하여 소수주주의 이사 선임을 가능하게 하는 제도"
- term: "상법 개정"
  also: ["상법개정"]
  plain: "회사의 조직과 운영에 관한 상법을 개정하는 것. 최근에는 소액주주 보호 강화가 핵심이다"
  signal: "이사의 충실의무 확대, 자기주식 소각 의무화 같은 개정은 지배주주보다 소액주주에게 유리한 방향이다"
- term: "주주대표소송"
  also: ["대표소송"]
  plain: "이사가 회사에 손해를 끼쳤음에도 회사가 책임을 추궁하지 않을 때 주주가 회사를 대신하여 제기하는 소송"
- term: "공정거래위원회"
  also: ["공정위"]
  plain: "독과점과 불공정거래를 규제하는 정부 기관"
- term: "과징금"
  plain: "법을 위반한 기업에 행정기관이 부과하는 금전적 제재"
  signal: "과징금은 관련 매출액의 일정 비율로 산정되는 경우가 많으므로, 기업의 매출액·이익과 비교해야 실질적 영향을 판단할 수 있다"
- term: "독과점"
  also: ["과점", "독점적 지위", "시장 지배력"]
  plain: "하나의 기업(독점)이나 소수의 기업(과점)이 시장의 대부분을 차지하는 상태"
  signal: "경쟁자가 적을수록 가격을 인상해도 수요가 다른 기업으로 이동하기 어려워 이익률이 높아지기 쉽다"
- term: "일감 몰아주기"
  plain: "지배주주 일가가 지분을 보유한 회사에 기업집단의 거래를 집중시켜 이익을 이전하는 행위"
- term: "점유율"
  also: ["시장점유율"]
  plain: "시장 전체 판매량(액) 중 특정 기업이 차지하는 비율"
- term: "진입장벽"
  plain: "신규 기업의 시장 진입을 어렵게 하는 요인(대규모 투자, 규제, 특허, 브랜드 등)"
- term: "플랫폼"
  plain: "판매자와 구매자처럼 서로 다른 이용자 집단을 연결하고 수수료를 받는 사업 모델"
  signal: "이용자가 많을수록 더 많은 이용자가 유입되어 선도 기업이 시장을 독식하기 쉬우며, 이를 바탕으로 수수료를 인상할 수 있다"
- term: "수수료"
  plain: "거래의 중개나 대행에 대한 대가로 받는 금액"
- term: "구독"
  plain: "정기적으로 일정 금액을 지불하고 지속적으로 이용하는 방식"
- term: "가격 인상"
  also: ["가격인상", "요금 인상", "값 인상", "가격을 올"]
  plain: "판매 가격을 올리는 것"
  signal: "가격탄력성이 낮은 상품은 가격을 인상해도 판매량 감소가 작아 매출이 증가하지만, 대체재가 많은 상품은 판매량이 크게 감소할 수 있다"
- term: "가격 인하"
  also: ["가격인하", "요금 인하", "값 인하"]
  plain: "판매 가격을 내리는 것"
  signal: "가격 인하로 판매량이 그 이상 증가해야 매출이 늘어난다. 경쟁사가 함께 가격을 인하하면 모두의 이익이 감소한다"
- term: "원재료"
  also: ["원자재"]
  plain: "제품 생산에 투입되는 재료"
  signal: "원재료 가격이 상승하면 이를 판매가격에 전가할 수 있는 기업(가격 결정력이 큰 기업)만 이익률을 유지한다"
- term: "브랜드"
  plain: "명칭과 이미지로 인해 동일한 제품이라도 더 높은 가격에, 더 많이 판매되게 하는 무형의 자산"
- term: "마케팅"
  plain: "고객의 필요를 파악하고 제품을 알려 구매로 이어지게 하는 일련의 활동"
- term: "스타트업"
  plain: "새로운 기술이나 사업 모델로 빠른 성장을 추구하는 초기 기업"
- term: "시리즈"
  also: ["시리즈A", "시리즈B", "시리즈C", "프리IPO"]
  plain: "스타트업이 성장 단계별로 유치하는 투자 라운드. A에서 B, C로 갈수록 규모가 커진다"
- term: "기업가치"
  also: ["밸류에이션"]
  plain: "기업 전체의 경제적 가치에 대한 평가액"
  signal: "투자 금액을 양도한 지분율로 나누면 기업가치를 역산할 수 있으며, 이를 매출액·이익과 비교하면 평가 수준을 판단할 수 있다"
- term: "유니콘"
  plain: "기업가치가 1조원(10억 달러) 이상인 비상장 스타트업"
- term: "임단협"
  also: ["임금협상", "단체협약", "임금 협상"]
  plain: "노동조합과 사용자가 임금과 근로조건을 정하기 위해 벌이는 단체교섭"
  signal: "임금 인상은 고정비를 증가시켜 이익을 압박하지만, 교섭이 결렬되어 파업으로 이어지면 생산 차질에 따른 비용이 더 클 수 있다"
- term: "파업"
  plain: "근로자가 요구를 관철하기 위해 집단적으로 노무 제공을 거부하는 쟁의행위"
- term: "희망퇴직"
  also: ["명예퇴직"]
  plain: "회사가 위로금 등의 조건을 제시하고 자발적으로 퇴직할 직원을 모집하는 것"
- term: "성과급"
  plain: "회사나 개인의 성과에 따라 추가로 지급하는 보상"
  signal: "성과급의 산정 기준(영업이익, 주가)에 따라 구성원과 경영진의 행동 방향이 달라진다"
- term: "노조"
  also: ["노동조합"]
  plain: "근로자가 근로조건의 유지·개선을 위해 조직한 단체(노동조합)"
- term: "기준금리"
  also: ["금리 인하", "금리 인상", "금리인하", "금리인상"]
  plain: "한국은행이 통화정책의 기준으로 정하는 정책금리. 시장금리의 기준이 된다"
  signal: "기준금리를 인하하면 차입 비용이 낮아져 소비와 투자가 증가하고, 인상하면 물가와 대출 증가를 억제한다"
- term: "환율"
  also: ["원·달러 환율", "원달러 환율", "원화 약세", "원화 강세"]
  plain: "자국 통화와 외국 통화의 교환 비율"
  signal: "환율이 상승하면(원화 약세) 수출 기업은 원화 환산 매출이 늘어 유리하고, 수입 원자재를 사용하는 기업은 원가가 상승하여 불리하다"
- term: "물가"
  also: ["소비자물가", "인플레이션", "물가상승률"]
  plain: "여러 재화와 서비스 가격의 평균적인 수준"
  signal: "물가가 빠르게 상승하면 중앙은행이 금리 인상으로 대응하고, 같은 소득으로 구매할 수 있는 양(실질소득)이 감소한다"
- term: "경기 침체"
  also: ["경기침체", "경기둔화", "경기 둔화", "경기 회복", "경기회복", "불황", "호황"]
  plain: "경제 활동이 크게 위축되는 국면(반대는 경기 회복). 경기는 확장과 수축을 반복한다"
- term: "성장률"
  also: ["GDP", "국내총생산", "경제성장률"]
  plain: "한 나라에서 일정 기간 새로 생산된 부가가치(국내총생산, GDP)의 증가율"
- term: "수출"
  plain: "국내에서 생산한 재화와 서비스를 외국에 판매하는 것"
- term: "무역수지"
  also: ["경상수지"]
  plain: "수출액에서 수입액을 뺀 값. 양수이면 흑자이다"
- term: "공급망"
  plain: "원재료에서 부품, 완제품, 최종소비자에 이르는 생산·유통의 연쇄"
  signal: "공급망이 단절되면 부품 하나의 부족으로 전체 생산이 중단될 수 있어 기업들은 조달처를 다변화한다"
- term: "반도체"
  plain: "전자기기의 연산과 기억을 담당하는 핵심 부품. 한국의 최대 수출 품목이다"
- term: "HBM"
  also: ["고대역폭메모리", "고대역폭 메모리"]
  plain: "여러 층의 D램을 적층하여 데이터 전송 속도를 크게 높인 인공지능용 고성능 메모리"
- term: "파운드리"
  plain: "다른 기업이 설계한 반도체를 위탁받아 생산하는 사업"
- term: "본예산"
  also: ["예산안", "예산"]
  plain: "정부·지방자치단체가 한 회계연도의 세입과 세출을 처음 확정한 예산(이후 수정하는 것은 추가경정예산)"
  signal: "예산이 증가했다면 그 재원이 세수 증가인지 국채 발행인지, 증가한 지출이 매년 반복되는 지출인지가 핵심이다"
- term: "추경"
  also: ["추가경정예산"]
  plain: "본예산 확정 후 추가 재정 수요가 생겨 편성하는 수정 예산(추가경정예산)"
  signal: "추경은 주로 경기 부양이나 재난 대응을 위해 편성되므로, 재원을 국채 발행으로 마련하는지가 중요하다"
- term: "국가채무"
  also: ["나랏빚", "국채"]
  plain: "정부가 상환해야 하는 채무. 국채는 정부가 자금을 차입하기 위해 발행하는 채권이다"
  signal: "국가채무는 절대 규모보다 국내총생산(GDP) 대비 비율과 증가 속도가 중요하다"
- term: "재정적자"
  also: ["관리재정수지", "재정수지"]
  plain: "정부의 지출이 수입을 초과하는 상태"
- term: "교부세"
  also: ["지방교부세"]
  plain: "중앙정부가 내국세의 일정 비율을 지방자치단체에 배분하는 재원"
- term: "국민연금"
  plain: "가입 기간 동안 보험료를 납부하고 노후에 연금을 받는 공적 연금. 적립 기금을 주식 등에 투자하는 국내 최대의 기관투자자이기도 하다"
- term: "건강보험"
  plain: "보험료를 재원으로 의료비의 일부를 보장하는 공적 보험"
- term: "복지"
  also: ["재난지원금", "소비쿠폰", "바우처", "복지 예산"]
  plain: "정부가 국민의 소득과 생활을 보장하기 위해 제공하는 지원"
  signal: "지급된 재원이 실제 소비로 이어지는 정도(재정승수)가 경기 부양 효과를 결정한다"
- term: "공공요금"
  also: ["전기요금", "가스요금", "전기료"]
  plain: "전기·가스·수도처럼 정부가 가격을 결정하거나 승인하는 요금"
  signal: "요금을 원가보다 낮게 유지하면 그 차액이 공기업 부채로 누적되었다가 결국 세금이나 요금 인상으로 귀결된다"
- term: "ESG"
  plain: "환경(E)·사회(S)·지배구조(G)를 기업 평가에 함께 반영하는 기준"
- term: "탄소배출권"
  also: ["배출권", "탄소중립", "온실가스", "탄소세"]
  plain: "온실가스를 배출할 수 있는 권리. 시장에서 거래할 수 있다"
  signal: "배출에 가격을 매기는 규제가 강화될수록 배출량이 많은 기업의 비용이 증가한다"
- term: "재생에너지"
  also: ["태양광", "풍력", "신재생"]
  plain: "태양광·풍력처럼 재생 가능한 자원으로 생산하는 에너지"
- term: "원전"
  also: ["원자력", "SMR"]
  plain: "원자력으로 전기를 생산하는 발전소(SMR은 소형모듈원전)"
