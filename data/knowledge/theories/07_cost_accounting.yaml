# 원가관리회계 카드
# - field: 원가관리회계. 화요일 '오늘의 전공 수업'에서 하나씩 다룬다.
# - worked: 숫자로 풀어 보기. law: 기법이 나온 이야기(나온 이유, 배경, 이론, 효과, 사례, 실제 효과)

- id: ca_cost_behavior_cvp
  title: 원가행태와 CVP 분석(손익분기점)
  field: 원가관리회계
  one_line: "원가를 조업도에 따라 변하는 변동비와 변하지 않는 고정비로 구분하여, 원가·조업도·이익의 관계(CVP)와 손익분기점을 분석하는 기법이다."
  easy: |
    치킨집을 예로 들자. 닭과 기름, 포장재처럼 한 마리 팔 때마다 드는 돈은 변동비, 월세와 직원 월급처럼 장사가 안 돼도 나가는 돈은 고정비다. 한 마리 2만원에 팔고 변동비가 1만2천원이면 한 마리당 8천원이 남는데, 이것이 공헌이익이다. 고정비를 갚는 데 '공헌'한다는 뜻이다.
    월 고정비가 800만원이면 1,000마리(800만원 ÷ 8천원)를 팔아야 본전이다. 이것이 손익분기점이다. 원가(Cost), 판매량(Volume), 이익(Profit)의 관계를 따지는 이 분석을 CVP 분석이라 하고, 예산 짜기, 가격 정하기, 신사업 타당성 검토의 기본 계산이다.
  deep:
    - "공헌이익률 = 단위당 공헌이익 ÷ 판매가. 손익분기 매출액 = 고정비 ÷ 공헌이익률."
    - "목표이익 판매량 = (고정비 + 목표이익) ÷ 단위당 공헌이익. 세후 목표이익이면 목표이익 ÷ (1 − 세율)로 세전 금액으로 바꿔 넣는다."
    - "안전한계율 = (실제 매출 − 손익분기 매출) ÷ 실제 매출. 매출이 몇 % 줄어도 적자가 안 나는지 보여준다."
    - "영업레버리지도 = 공헌이익 ÷ 영업이익 = 1 ÷ 안전한계율. 고정비 비중이 큰 회사일수록 매출 변화에 이익이 크게 출렁인다."
    - "전기료처럼 기본료와 사용료가 섞인 준변동비는 고저점법이나 회귀분석으로 고정 부분과 변동 부분을 나눈다."
  worked:
    - "판매가 2만원, 변동비 1만2천원, 월 고정비 800만원. 손익분기 판매량 = 800만 ÷ 8천 = 1,000마리. 월 1,250마리를 팔면 영업이익 = 1,250 × 8천 − 800만 = 200만원."
    - "안전한계율 = (1,250 − 1,000) ÷ 1,250 = 20%, 영업레버리지도 = 공헌이익 1,000만 ÷ 영업이익 200만 = 5배. 매출이 10% 늘면 이익은 50% 늘고, 10% 줄면 50% 준다."
  how_to:
    - "오늘 사례 회사의 원가 중 고정비 성격(감가상각비, 인건비, 임차료)과 변동비 성격(원재료, 운반비)을 어림해 나눈다."
    - "과거 실적에서 매출이 10% 바뀔 때 영업이익이 몇 % 바뀌었는지 보고 영업레버리지를 거꾸로 추정한다."
    - "가격 인상·할인 기사라면 공헌이익률 변화로 판매량이 얼마나 줄어도(늘어야) 이익이 같은지 계산한다."
  example: "항공사는 비행기와 인력 고정비가 커서 손익분기 탑승률을 넘기면 승객 한 명이 늘 때마다 운임 대부분이 이익이 된다. 탑승률 몇 %p 차이로 실적이 크게 엇갈리는 이유다."
  pitfalls:
    - "고정비도 영원히 고정은 아니다. 판매량이 일정 범위(관련범위)를 넘으면 공장 증설로 고정비가 계단식으로 뛴다."
    - "손익분기점은 회계상 본전이다. 투자한 돈의 기회비용(자본비용)까지 벌려면 더 팔아야 한다."
  related: [operating_leverage, ca_relevant_costing, ca_budgeting, pricing_strategy]
  keywords: [변동비, 고정비, 공헌이익, 손익분기점, 안전한계, 영업레버리지도]
  applies_to:
    filings: [earnings, contract]
    news: [earnings, pricing]
  quiz:
    - q: "판매가 5만원, 단위당 변동비 3만원, 고정비 1억원이면 손익분기 판매량은?"
      choices: ["2,000개", "3,334개", "5,000개", "10,000개"]
      answer: 2
      explain: "단위당 공헌이익 2만원. 1억 ÷ 2만 = 5,000개."
    - q: "안전한계율이 25%인 회사의 영업레버리지도는?"
      choices: ["0.25배", "2.5배", "4배", "25배"]
      answer: 2
      explain: "영업레버리지도 = 1 ÷ 안전한계율 = 1 ÷ 0.25 = 4배."

- id: ca_relevant_costing
  title: 관련원가와 의사결정(특별주문·외주·사업 중단)
  field: 원가관리회계
  one_line: "의사결정 대안 간에 차이가 나는 미래원가(관련원가)만 비교하고, 이미 발생한 매몰원가는 제외하며 포기한 이익(기회원가)은 포함하는 의사결정 기법이다."
  easy: |
    공장 설비가 남는데 해외 바이어가 평소보다 싼 값에 대량 주문을 했다고 하자. 장부상 단위당 원가(고정비 배부액 포함)보다 싸면 손해 같지만, 남는 설비로 만들면 고정비는 어차피 나가는 돈이라 주문을 받든 안 받든 똑같다. 받을지 말지는 '이 주문 때문에 새로 드는 돈'과 '이 주문으로 들어오는 돈'만 비교하면 된다.
    같은 논리로 부품을 직접 만들지 사 올지, 적자 사업부를 접을지를 따진다. 핵심은 세 가지다. 이미 써 버린 돈은 결정과 무관하다(매몰원가). 결정에 따라 달라지는 미래 현금만 본다(관련원가). 그 자원을 다른 데 썼을 때 벌 수 있었던 돈도 비용이다(기회원가).
  deep:
    - "특별주문: 유휴설비가 있으면 증분수익 − 증분원가(변동비와 추가 고정비)로 판단한다. 설비가 꽉 찼다면 밀려나는 기존 주문의 공헌이익이 기회원가가 된다."
    - "자가제조와 외부구매: 외부 구입가와 '자가제조를 그만두면 피할 수 있는 원가'를 비교한다. 공장 감가상각비처럼 외주해도 안 없어지는 원가는 무관원가다. 남는 설비를 다른 데 쓸 수 있으면 그 이익을 더한다."
    - "사업 중단: 그 사업부의 공헌이익과 '중단하면 없어지는 고정비'를 비교한다. 본사 공통비 배부액은 중단해도 안 없어지므로 장부상 적자여도 남기는 게 나을 수 있다."
    - "제약자원이 있으면 '제약자원 단위당 공헌이익'이 큰 제품부터 만든다(예: 기계 시간당 공헌이익)."
  worked:
    - "단위당 장부원가 1만원(변동비 6천원 + 고정비 배부 4천원)인 제품에 개당 8천원짜리 특별주문 1천 개가 들어왔다. 유휴설비로 만들 수 있으면 증분이익 = (8천 − 6천) × 1천 = 200만원이라 받는 게 낫다."
    - "적자 사업부 매출 10억원, 변동비 6억원, 그 사업부 고유 고정비 2억원, 본사 공통비 배부 3억원이면 장부상 1억원 적자다. 하지만 접으면 공헌이익 4억원을 잃고 고유 고정비 2억원만 아끼므로 회사 전체 이익이 2억원 줄어든다."
  how_to:
    - "사업 매각·중단·외주화 기사라면 그 결정으로 없어지는 매출, 없어지는 비용, 남는 비용을 나눠 적는다."
    - "회사가 '적자 사업 정리'라고 할 때 그 적자가 공통비 배부 때문인지, 실제 공헌이익이 마이너스인지 구분한다."
    - "공급망 기사라면 외주화와 내재화 중 무엇이 피할 수 있는 원가와 기회원가 기준으로 유리한지 따진다."
  example: "반도체 회사가 칩 생산을 파운드리에 맡길지 직접 공장을 지을지도 같은 계산이다. 공장을 지으면 막대한 고정비가 생기지만, 남는 설비로 다른 회사 물량을 받으면 기회원가를 줄일 수 있다."
  pitfalls:
    - "이미 들인 돈이 아까워 계속하는 매몰비용 오류가 가장 흔한 실수다. 콩코드 여객기 개발이 대표 사례로 꼽힌다."
    - "단기 결정에서 고정비를 무시해도 장기적으로는 고정비까지 회수해야 한다. 특별주문 가격을 계속 쓰면 회사가 버티지 못한다."
  related: [ca_cost_behavior_cvp, ca_target_costing, vertical_integration, behavioral_econ]
  keywords: [관련원가, 매몰원가, 기회원가, 특별주문, 자가제조, 제약자원]
  applies_to:
    filings: [business_trf, asset_trf, stock_trf]
    news: [supply, strategy]
  quiz:
    - q: "작년에 5억원을 들여 산 기계를 계속 쓸지 새 기계로 바꿀지 정할 때, 작년 구입가 5억원은?"
      choices: ["관련원가", "매몰원가", "기회원가", "증분원가"]
      answer: 1
      explain: "이미 지출돼 어떤 선택을 해도 되돌릴 수 없는 돈은 매몰원가라 의사결정에서 뺀다. 지금 팔 때 받을 수 있는 처분가치는 관련원가다."

- id: ca_absorption_variable
  title: 전부원가와 변동원가(재고로 이익이 바뀌는 이유)
  field: 원가관리회계
  one_line: "고정제조간접원가를 제품원가에 포함하는 전부원가계산과 기간비용으로 처리하는 변동원가계산의 차이로 인해, 재고 수준에 따라 보고이익이 달라지는 현상을 다룬다."
  easy: |
    공장 고정비가 1년에 100억원인 회사가 10만 개를 만들면 개당 고정비는 10만원, 20만 개를 만들면 5만원이다. 재무제표에 쓰는 전부원가계산은 이 고정 제조원가를 제품 원가에 포함한다. 그래서 만든 것을 다 못 팔고 창고에 쌓으면 고정비 일부가 재고자산에 묻혀 그해 비용에서 빠지고 이익이 커진다.
    변동원가계산은 고정 제조원가를 생산량과 상관없이 그해 비용으로 처리한다. 이익이 판매량에만 따라 움직여 경영 성과를 보기 좋다. 외부 보고는 전부원가가 원칙이지만, 내부 관리용으로는 두 숫자를 같이 보는 것이 좋다.
  deep:
    - "두 방법의 이익 차이 = 기말재고에 포함된 고정제조간접비 − 기초재고에 포함된 고정제조간접비. 생산량이 판매량보다 많으면 전부원가 이익이 더 크다."
    - "감산의 회계 효과: 생산을 줄이면 개당 고정비가 올라가고, 쓰지 않은 설비의 고정비는 정상조업도에 못 미친 만큼 바로 비용(저조업 손실)이 된다."
    - "재고자산 평가: 원가보다 순실현가능가치(팔 수 있는 가격 − 추가 비용)가 낮으면 재고자산평가손실을 잡는다. 가격이 급락하는 업종(메모리 반도체, 석유화학)에서 크게 나온다."
  worked:
    - "고정 제조원가 100억원, 개당 변동비 5만원, 판매가 20만원. 10만 개를 만들어 8만 개를 팔면 전부원가 개당 원가는 15만원, 매출원가 120억원, 이익 40억원(판관비 무시). 변동원가로는 매출 160억 − 변동비 40억 − 고정비 100억 = 20억원."
    - "차이 20억원 = 기말재고 2만 개 × 개당 고정비 10만원. 재고에 묻힌 고정비만큼 전부원가 이익이 크다."
  law:
    basis: "K-IFRS 제1002호 '재고자산'(고정제조간접원가는 정상조업도 기준으로 배부하고 저조업 부분은 비용 처리)"
    purpose: "외부 보고에서는 생산에 든 모든 원가를 재고자산 원가에 담아야 수익과 비용이 대응된다는 원칙(전부원가)을 쓰되, 과잉 생산으로 이익을 부풀리지 못하게 고정비 배부를 정상조업도 기준으로 제한했다."
    background:
      - "1930년대 미국에서 변동원가계산(직접원가계산)이 제안된 뒤 외부 보고(전부원가)와 내부 관리(변동원가) 중 무엇이 맞는지 논쟁이 이어져 왔다."
    theory:
      - "이익조정 유인: 경영자 보상이 회계 이익에 연동되면 과잉 생산으로 이익을 끌어올리는 유인이 생긴다."
    economic_effects:
      - "업황이 꺾일 때 재고가 쌓이면 전부원가 이익은 늦게 나빠지고, 이후 감산과 재고평가손실이 한꺼번에 오면서 이익이 급락한다."
    cases:
      - "메모리 반도체 불황기(2022년 하반기~2023년)에 국내 반도체 회사들은 재고 급증과 가격 하락으로 대규모 재고평가손실과 감산에 따른 원가 부담을 안고 분기 적자를 냈다."
    evidence:
      - "연구들은 재고가 비정상적으로 늘어난 회사의 이후 이익과 주가 수익률이 나빠지는 경향을 보고한다. 재고 증가율이 매출 증가율보다 빠르면 경고 신호로 본다."
  how_to:
    - "실적 기사에서 재고자산 증가율과 매출 증가율을 비교한다. 재고가 훨씬 빨리 늘면 이익의 질을 의심한다."
    - "감산 발표가 나오면 단위당 고정비 상승과 저조업 손실이 다음 분기 이익에 얼마나 반영될지 가늠한다."
    - "재고자산평가손실 변동을 주석에서 확인하고, 가격 회복 때 환입될 여지가 있는지 본다."
  example: "제조업체가 분기 말에 생산을 늘리면 그 분기 전부원가 이익은 좋아 보일 수 있다. 다음 분기 판매가 따라오지 않으면 재고가 쌓이고 할인 판매로 이익이 꺾인다."
  pitfalls:
    - "생산을 늘리면 개당 원가가 낮아져 '효율이 좋아졌다'고 오해하기 쉽다. 팔리지 않으면 비용을 미룬 것뿐이다."
  related: [ca_cost_behavior_cvp, lean_inventory, supply_chain, fa_revenue]
  keywords: [전부원가, 변동원가, 조업도차이, 재고자산평가손실, 정상조업도, 감산]
  applies_to:
    filings: [earnings]
    news: [earnings, supply]
  quiz:
    - q: "생산량이 판매량보다 많아 재고가 늘어난 해에는 보통 어느 방법의 영업이익이 더 클까?"
      choices: ["전부원가계산", "변동원가계산", "항상 같다", "알 수 없다"]
      answer: 0
      explain: "전부원가계산은 고정제조간접비 일부가 기말재고에 남아 비용에서 빠지므로 이익이 더 크다."

- id: ca_abc
  title: 활동기준원가(ABC)와 고객·제품 수익성
  field: 원가관리회계
  one_line: "간접원가를 생산량이 아니라 원가를 유발한 활동(작업 준비, 검사, 배송 등)의 원가동인에 따라 배부하여 제품과 고객의 실제 수익성을 파악하는 원가계산 방법이다."
  easy: |
    공장에서 대량으로 찍어내는 표준 제품과 소량 주문 맞춤 제품을 함께 만든다고 하자. 간접비를 생산량이나 직접노동시간 기준으로 나누면 많이 만드는 표준 제품이 간접비를 대부분 떠안는다. 하지만 실제로 설비를 자주 바꾸고 검사를 많이 하는 쪽은 맞춤 제품이다. 그 결과 표준 제품은 원가가 부풀고 맞춤 제품은 원가가 낮아 보여, 손해 보는 제품을 더 열심히 파는 일이 생긴다.
    활동기준원가(ABC)는 간접비를 활동별로 모은 뒤 각 활동을 얼마나 썼는지(원가동인)로 제품과 고객에게 나눈다. 고객별로 해 보면 매출은 큰데 반품, 긴급 배송, 맞춤 요구가 많아 실제로는 손해인 고객이 드러나기도 한다.
  deep:
    - "원가 계층: 단위 수준(개당), 배치 수준(작업 준비·검사), 제품 유지 수준(설계 변경), 설비 유지 수준(공장 관리). 생산량 기준 배부는 단위 수준만 잘 설명한다."
    - "원가동인 예: 작업 준비 횟수, 구매 주문 건수, 검사 시간, 배송 건수, 고객 상담 횟수."
    - "고객 수익성 분석: 고객별 매출 − 제품원가 − 고객 서비스 활동원가. 상위 고객이 이익의 대부분을 내고 하위 고객이 이익을 깎는 모양(고래 곡선)이 자주 나온다."
    - "시간동인 ABC(TDABC): 활동 단가를 '분당 원가'로 잡아 유지 비용을 낮춘 실무형 방식."
  worked:
    - "작업 준비 원가 1억원, 연간 준비 100회(회당 100만원). 표준 제품은 10회, 맞춤 제품은 90회 준비했다면 준비 원가는 표준 1천만원, 맞춤 9천만원이다. 생산량 비율(표준 90%, 맞춤 10%)로 나누면 정반대로 배부된다."
  law:
    basis: "Cooper & Kaplan(1988) 'Measure Costs Right: Make the Right Decisions'(하버드비즈니스리뷰) 등"
    purpose: "자동화로 직접노무비 비중이 줄고 간접비가 커진 공장에서 노동시간 기준 배부가 원가를 왜곡하는 문제를 고치려고 나온 기법이다."
    background:
      - "1980년대 미국 제조업이 일본 기업에 밀리던 시기, 하버드의 로버트 캐플런과 로빈 쿠퍼는 원가 정보가 경영 의사결정을 그르친다고 진단하고 활동 기준 배부를 제안했다."
    theory:
      - "원가 왜곡과 교차 보조: 잘못된 배부는 한 제품이 다른 제품의 원가를 대신 떠안게 만들어 가격과 제품 구성 결정을 그르친다."
    economic_effects:
      - "정확한 원가는 소량 다품종 맞춤 서비스에 제값을 받게 하고, 손해 고객에게 최소 주문량이나 수수료를 도입하는 근거가 된다."
    cases:
      - "택배·물류 회사가 같은 무게라도 반품, 새벽 배송, 도서산간 배송에 다른 요금을 매기는 것은 활동별 원가 차이를 반영한 것이다."
      - "은행이 창구 거래와 모바일 거래의 원가를 따로 계산해 수수료를 달리하는 것도 같은 원리다."
    evidence:
      - "ABC는 정확하지만 설계와 유지 비용이 커서 전면 도입보다 일부 공정이나 고객 분석에만 쓰는 기업이 많다는 조사 결과가 반복해서 나왔다. TDABC가 그 대안으로 나왔다."
  how_to:
    - "사례 회사가 여러 제품이나 고객군을 갖고 있다면 어느 쪽이 활동(서비스, 맞춤, 반품)을 많이 쓰는지 적는다."
    - "배송비 유료화, 최소 주문 금액, 수수료 개편 같은 가격 정책 기사를 보면 어떤 활동원가를 고객에게 넘기려는 것인지 해석한다."
    - "매출 상위 고객이 이익 상위 고객과 같은지 의심해 본다."
  example: "온라인 쇼핑몰이 무료 반품을 줄이거나 반품 배송비를 받기 시작하는 것은 반품이라는 활동의 원가가 일부 고객에게 몰려 있다는 분석에서 나오는 경우가 많다."
  pitfalls:
    - "ABC 원가도 고정비를 나눈 것이라 특별주문 같은 단기 의사결정에 그대로 쓰면 안 된다. 그 원가를 실제로 피할 수 있는지 다시 따져야 한다."
  related: [ca_relevant_costing, clv_cac, pricing_strategy, value_chain]
  keywords: [활동기준원가, 원가동인, 고객수익성, 교차보조, TDABC]
  applies_to:
    filings: []
    news: [marketing, pricing, strategy]
  quiz:
    - q: "생산량 기준으로 간접비를 배부할 때 원가가 낮게 계산되기 쉬운 제품은?"
      choices: ["대량 표준 제품", "소량 맞춤 제품", "둘 다 정확하다", "직접재료비가 큰 제품"]
      answer: 1
      explain: "소량 맞춤 제품은 작업 준비·검사 같은 활동을 많이 쓰지만 생산량이 적어 간접비를 적게 배부받는다."

- id: ca_standard_costing
  title: 표준원가와 차이분석(원가가 왜 예산과 달랐나)
  field: 원가관리회계
  one_line: "제품 단위당 표준 재료비·노무비·제조간접비를 설정하고, 실제원가와의 차이를 가격 차이와 능률 차이로 분석하는 원가관리 기법이다."
  easy: |
    라면 한 봉지에 밀가루 100g, 1g당 2원이 표준이라고 하자. 이번 달 실제로는 1g당 2.4원에 사서 봉지당 105g씩 썼다면 원가가 예상보다 늘었는데, 원인은 두 가지다. 밀가루 값이 올랐고(가격차이), 생산 과정에서 더 썼다(수량차이). 앞의 것은 구매나 국제 곡물 시세 탓, 뒤의 것은 생산 현장의 효율 문제다.
    표준원가 제도는 이렇게 차이를 쪼개 책임을 가린다. 큰 차이만 골라 집중 점검하는 예외 관리가 가능하고, 가격 결정과 예산 편성에도 쓰인다. 원자재 가격이 크게 오르는 시기에 식품·화학 회사 실적 기사를 읽는 기본 틀이다.
  deep:
    - "재료 가격차이 = (실제 단가 − 표준 단가) × 실제 사용량. 재료 수량차이 = (실제 사용량 − 실제 생산량에 허용된 표준 사용량) × 표준 단가."
    - "노무비는 임률차이와 능률차이, 변동제조간접비는 소비차이와 능률차이, 고정제조간접비는 예산차이와 조업도차이로 나눈다."
    - "불리한 차이가 꼭 나쁜 것은 아니다. 값싼 재료를 사서 가격차이가 유리해지면 불량이 늘어 수량차이가 불리해질 수 있다(차이 간 상호작용)."
  worked:
    - "표준: 100g × 2원 = 봉지당 200원. 실제: 1만 봉 생산에 105만 g을 g당 2.4원에 구입·사용. 가격차이 = (2.4 − 2) × 105만 = 42만원 불리. 수량차이 = (105만 − 100만) × 2 = 10만원 불리. 총차이 52만원 불리."
  how_to:
    - "원자재 가격 급등 기사에서 원가 상승이 가격 요인인지, 수율·효율 요인인지 나눠 생각한다."
    - "식품·화학 회사의 매출총이익률 변화를 판매가 인상분과 원재료 가격차이로 나눠 본다."
    - "회사가 '원가 절감'을 말하면 단가 협상(가격차이)인지 공정 개선(수량차이)인지 확인한다."
  example: "2022년 밀, 팜유, 옥수수 같은 곡물 가격이 급등하자 식품 회사들은 불리한 가격차이를 판매가 인상으로 넘기려 했고, 정부와 인상 시기를 두고 줄다리기가 이어졌다."
  pitfalls:
    - "표준을 너무 느슨하게 잡으면 늘 유리한 차이가 나 성과가 좋아 보인다. 표준 자체가 적정한지 먼저 본다."
    - "차이의 책임을 한 부서에만 돌리면 협업이 깨진다. 구매와 생산의 차이는 함께 봐야 한다."
  related: [ca_budgeting, ca_performance, elasticity, supply_chain]
  keywords: [표준원가, 가격차이, 수량차이, 능률차이, 예외관리, 원자재]
  applies_to:
    filings: [earnings]
    news: [supply, pricing]
  quiz:
    - q: "표준 단가 1,000원, 실제 단가 1,100원, 실제 사용량 500개일 때 재료 가격차이는?"
      choices: ["5만원 유리", "5만원 불리", "50만원 불리", "0원"]
      answer: 1
      explain: "(1,100 − 1,000) × 500 = 5만원. 실제 단가가 더 비싸므로 불리한 차이다."

- id: ca_budgeting
  title: 종합예산과 변동예산(예산 편성의 순서)
  field: 원가관리회계
  one_line: "판매예산에서 출발하여 생산·구매·인력·현금 예산으로 이어지는 종합예산 편성 절차와, 실제 조업도에 맞춘 변동예산으로 성과를 평가하는 방법이다."
  easy: |
    회사 예산은 매출 목표 하나에서 출발한다. 내년에 10만 개를 팔 계획이면 재고 목표를 반영해 생산량을 정하고, 생산량에서 재료 구매와 인력 계획이, 그 모든 것에서 비용 예산과 현금 예산이 나온다. 마지막에 예상 손익계산서와 재무상태표가 만들어진다. 이것을 종합예산이라 한다.
    연말에 실적을 볼 때 '예산 대비 매출 20% 초과, 비용도 15% 초과'만 보면 비용 관리가 엉망인 것 같다. 하지만 많이 팔았으니 재료비가 늘어난 것은 당연하다. 그래서 실제 판매량에 맞춰 예산을 다시 계산한 변동예산과 비교해야 판매 성과와 비용 효율을 공정하게 나눌 수 있다.
  deep:
    - "편성 순서: 판매예산 → 생산예산(판매량 + 기말재고 목표 − 기초재고) → 재료·노무·제조간접비 예산 → 판매관리비 예산 → 현금예산 → 예산 손익계산서·재무상태표."
    - "현금예산이 가장 중요하다. 이익이 나도 매출채권 회수가 늦고 재고가 쌓이면 현금이 마른다(흑자 도산)."
    - "고정예산차이 = 매출조업도차이(판매량 차이 효과) + 변동예산차이(가격·효율 차이 효과)."
    - "예산 여유: 성과평가가 예산 달성에 묶이면 담당자가 목표를 낮게 잡는 유인이 생긴다. 참여예산과 보상 설계로 줄인다."
    - "제로베이스예산: 전년도 예산에 증감하는 대신 매년 0에서 필요성을 다시 따진다. 공공부문 지출 구조조정에도 쓰인다."
  worked:
    - "예산: 1만 개 × 판매가 1만원, 변동비 6천원, 고정비 2천만원이면 예산 이익 2천만원. 실제: 1만2천 개를 9,800원에 팔고 변동비 6,300원, 고정비 2,100만원이면 실제 이익 = 1만2천 × 3,500 − 2,100만 = 2,100만원."
    - "변동예산(1만2천 개 기준) 이익 = 1만2천 × 4천 − 2천만 = 2,800만원. 매출조업도차이 = 2,800만 − 2,000만 = 800만원 유리(많이 팔았다). 변동예산차이 = 2,100만 − 2,800만 = 700만원 불리(싸게 팔고 비용이 늘었다)."
  how_to:
    - "회사가 내년 매출 목표나 투자 계획을 발표하면 그 숫자에서 생산·인력·현금이 어떻게 따라 움직일지 연결해 본다."
    - "'실적이 가이던스(예산)를 넘었다'는 기사라면 판매량 효과인지 가격·원가 효과인지 나눠 본다."
    - "현금예산 관점에서 매출채권 회수 기간과 재고 회전일수가 늘고 있는지 확인한다."
  example: "정부 예산도 같은 구조다. 세입 예산(기업의 판매예산에 해당)을 잘못 추정하면 세출 계획 전체가 흔들린다. 2023~2025년 3년 연속 본예산 대비 세수 결손이 그 예다(재정학 '국가 예산' 카드 참고)."
  pitfalls:
    - "고정예산과 실적만 비교하면 판매가 늘어 비용이 는 것을 낭비로 오해한다."
    - "예산을 다 쓰지 않으면 다음 해 깎이는 관행이 연말 '예산 소진' 지출을 만든다."
  related: [ca_standard_costing, ca_performance, pf_budget, ca_cost_behavior_cvp]
  keywords: [종합예산, 변동예산, 현금예산, 매출조업도차이, 예산여유, 제로베이스예산]
  applies_to:
    filings: [contract, earnings]
    news: [earnings, strategy, fiscal]
  quiz:
    - q: "판매예산 1만 개, 기초재고 2천 개, 목표 기말재고 3천 개일 때 생산예산은?"
      choices: ["9천 개", "1만 개", "1만1천 개", "1만5천 개"]
      answer: 2
      explain: "생산량 = 판매량 + 기말재고 − 기초재고 = 1만 + 3천 − 2천 = 1만1천 개."

- id: ca_performance
  title: 책임회계와 성과평가(ROI·RI·EVA·BSC)
  field: 원가관리회계
  one_line: "책임중심점의 성과를 투자수익률(ROI), 잔여이익(RI), 경제적 부가가치(EVA), 균형성과표(BSC) 등으로 평가하는 체계와, 평가 지표가 경영자 행동에 미치는 영향을 다룬다."
  easy: |
    회사는 공장(원가중심점), 영업(수익중심점), 사업부(이익중심점), 독립 사업부(투자중심점)처럼 조직을 나누고 각자 통제할 수 있는 숫자로 책임을 묻는다. 투자중심점의 대표 지표가 투자수익률(ROI = 영업이익 ÷ 투자액)이다.
    그런데 ROI 20%인 사업부장은 수익률 15%짜리 투자를 거절한다. 회사의 자본비용이 10%라 회사 전체로는 이득인데도 자기 사업부 ROI 평균이 낮아지기 때문이다. 그래서 '자본비용을 넘는 이익 금액'을 보는 잔여이익(RI)과 경제적부가가치(EVA)가 나왔다. 또 재무 숫자는 과거 결과일 뿐이라 고객, 내부 프로세스, 학습과 성장까지 함께 보는 균형성과표(BSC)가 널리 쓰인다.
  deep:
    - "ROI = 매출이익률 × 자산회전율(듀퐁 분해). 이익률을 높이거나 자산을 덜 쓰면 오른다."
    - "RI = 영업이익 − 투자액 × 최저필수수익률. EVA = 세후영업이익 − 투하자본 × 가중평균자본비용. 연구개발비 비용 처리 같은 회계 왜곡을 조정해 계산한다."
    - "BSC 4관점: 재무, 고객, 내부 프로세스, 학습과 성장. 관점 사이 인과관계(직원 역량 → 공정 품질 → 고객 만족 → 매출)를 전략 지도로 그린다."
    - "단기 지표에만 성과급을 묶으면 연구개발, 교육, 정비를 줄여 당장의 숫자를 만드는 근시안 문제가 생긴다."
  worked:
    - "A사업부: 투자 100억원, 영업이익 20억원(ROI 20%). 새 투자 50억원에 이익 7.5억원(15%) 기회가 있다. 받으면 ROI = 27.5 ÷ 150 = 18.3%로 떨어져 거절하고 싶어진다."
    - "자본비용 10%로 RI를 보면 투자 전 20 − 10 = 10억원, 투자 후 27.5 − 15 = 12.5억원. RI가 늘어나니 회사에 이로운 투자임이 드러난다."
  law:
    basis: "Stern Stewart의 EVA(1990년대), Kaplan & Norton(1992) '균형성과표'"
    purpose: "회계 이익과 주주가치 사이의 간극을 줄이고(EVA), 재무 숫자 너머의 성과 동인을 관리하려는(BSC) 시도다."
    background:
      - "1980~90년대 미국 기업들이 분기 이익에 매달려 장기 경쟁력을 잃는다는 비판 속에, 자본비용을 반영한 EVA와 비재무 지표를 담은 BSC가 컨설팅 업계를 통해 퍼졌다."
      - "국내에서도 외환위기 뒤 대기업 성과관리와 공공기관 경영평가에 EVA·BSC 개념이 도입됐다."
    theory:
      - "대리인 이론과 목표 일치: 성과지표는 사업부장의 이익이 회사와 주주의 이익과 같은 방향으로 움직이게 설계해야 한다."
      - "굿하트의 법칙: 지표가 목표가 되면 더 이상 좋은 지표가 아니게 된다. 측정하는 것만 관리되는 부작용을 경계한다."
    economic_effects:
      - "EVA 보상은 불필요한 자산을 줄이고 자본 효율을 높이는 행동을 유도하지만, 장기 투자를 줄이는 부작용도 생길 수 있다."
    cases:
      - "공공기관 경영평가는 재무 지표 외에 사회적 가치와 안전 지표를 함께 보는 BSC형 구조이고, 평가 결과가 성과급과 기관장 거취에 연결된다."
    evidence:
      - "EVA 도입 기업이 자산 처분과 자사주 매입을 늘리고 자본 효율이 좋아졌다는 연구가 있지만, 장기 주가 성과 개선은 일관되게 확인되지 않았다."
  how_to:
    - "성과급·KPI 개편 기사라면 새 지표가 어떤 행동을 유도할지 좋은 쪽과 나쁜 쪽을 둘 다 적는다."
    - "사업부별 실적이 공시되면 사업부 수익률과 회사 자본비용을 비교해 가치를 만드는 사업과 깎는 사업을 가른다."
    - "회사의 중장기 목표에 재무 지표만 있는지, 고객·인재·품질 지표가 함께 있는지 본다."
  example: "성과급 논란 기사에서 '영업이익의 일정 %를 나눈다'는 방식은 자본을 얼마나 썼는지 반영하지 않는다. 같은 이익이라도 투자를 두 배로 해서 번 것이면 EVA는 더 작을 수 있다."
  pitfalls:
    - "ROI가 높다고 좋은 사업부가 아니다. 감가상각이 거의 끝난 오래된 설비로 운영하면 ROI가 부풀려진다."
  related: [agency_theory, incentives, ca_transfer_pricing, capital_structure]
  keywords: [책임중심점, ROI, 잔여이익, EVA, 균형성과표, 성과지표]
  applies_to:
    filings: [split, earnings]
    news: [hr, strategy]
  quiz:
    - q: "투자액 200억원, 영업이익 30억원, 최저필수수익률 12%인 사업부의 잔여이익(RI)은?"
      choices: ["30억원", "6억원", "−6억원", "24억원"]
      answer: 1
      explain: "RI = 30억 − 200억 × 12% = 30 − 24 = 6억원."

- id: ca_transfer_pricing
  title: 사내 대체가격과 국제 이전가격
  field: 원가관리회계
  one_line: "기업 내부 또는 기업집단 내 거래에 적용하는 가격(대체가격·이전가격)이 사업부 성과와 국가별 세부담을 동시에 결정한다는 점을 다룬다."
  easy: |
    부품 사업부가 완성품 사업부에 부품을 넘길 때 얼마를 받아야 할까. 비싸게 매기면 부품 사업부 이익이 커지고 완성품 사업부 이익이 줄어든다. 회사 전체 이익은 같지만 사업부 평가와 성과급이 달라지니 다툼이 생긴다. 이 내부 거래 가격이 대체가격이다.
    그룹이 여러 나라에 있으면 문제가 커진다. 세율이 낮은 나라의 자회사에 이익이 많이 남도록 값을 정하면 그룹 전체 세금이 줄어든다. 그래서 세법은 특수관계 회사 사이의 거래도 남남끼리 거래하듯(정상가격) 값을 매기라고 요구한다. 관리회계 문제가 국제조세 문제로 이어지는 지점이다.
  deep:
    - "대체가격 기준: 시장가격(외부 시장이 있을 때 가장 객관적), 원가 기준(변동원가, 전부원가, 원가 가산), 협상가격."
    - "최소 대체가격 = 단위당 증분원가 + 기회원가(외부에 팔았다면 얻었을 공헌이익). 남는 설비가 있으면 변동비만, 설비가 꽉 차 외부 판매를 포기해야 하면 시장가가 하한이다."
    - "목표 일치성: 각 사업부가 자기 이익만 좇아도 회사 전체 이익이 가장 커지도록 가격을 정해야 한다."
    - "세법상 정상가격 산출 방법: 비교가능 제3자 가격법, 재판매가격법, 원가가산법, 거래순이익률법, 이익분할법. 세무당국과 미리 합의하는 정상가격 산출방법 사전승인(APA)도 있다."
  worked:
    - "부품 변동비 3만원, 외부 판매가 5만원, 부품 사업부 설비 여유 없음. 완성품 사업부에 넘기면 외부 판매를 포기하므로 최소 대체가격 = 3만 + (5만 − 3만) = 5만원. 설비 여유가 있다면 3만원까지 내려갈 수 있다."
  law:
    basis: "국제조세조정에 관한 법률(정상가격에 의한 과세조정), 법인세법 제52조(부당행위계산 부인), OECD 이전가격 지침"
    purpose: "세법 쪽 취지는 다국적기업이 그룹 내부 가격을 조정해 이익을 세율 낮은 나라로 옮기는 것을 막아 각국의 과세권을 지키는 것이다."
    background:
      - "1990년대 다국적기업 거래가 급증하자 OECD가 1995년 이전가격 지침을 정비했고, 한국도 1995년 국제조세조정법을 제정했다."
      - "2010년대 글로벌 IT 기업들의 조세 회피가 문제 되며 OECD·G20의 BEPS(소득 이전을 통한 세원 잠식 방지) 프로젝트가 2015년 결과물을 냈고, 국가별 보고서 같은 이전가격 문서화가 강화됐다."
    theory:
      - "관리회계 관점: 분권화된 조직에서 사업부 자율성과 회사 전체 최적을 맞추는 조정 장치다."
      - "조세 관점: 독립기업 원칙. 특수관계가 없었다면 정했을 가격으로 거래를 다시 본다."
    economic_effects:
      - "이전가격 과세가 강해지면 다국적기업은 특허·상표 같은 무형자산의 위치와 기능·위험 배분을 근거로 나라별 이익 배분을 설명해야 한다."
    cases:
      - "국내 대기업 해외 법인과의 거래를 두고 국세청 이전가격 과세, 조세불복, APA 체결이 매년 이어진다. 해외 판매법인의 영업이익률이 업종 평균보다 지나치게 낮거나 높으면 조사 대상이 되기 쉽다."
    evidence:
      - "연구들은 세율 차이가 큰 나라 사이에서 다국적기업 계열사 이익이 세율 낮은 쪽으로 몰리는 경향을 반복해서 확인했고, 이것이 글로벌 최저한세 도입의 근거가 됐다."
  how_to:
    - "그룹 내부거래 비중이 큰 회사라면 사업부·계열사별 이익이 대체가격에 따라 얼마나 달라질지 생각한다."
    - "해외 법인 이익률이 업종 평균과 크게 다르면 이전가격 과세 위험을 의심한다."
    - "물적분할로 사업부가 자회사가 되면 사내 거래가 계열사 간 거래로 바뀌어, 가격 결정이 소수주주와 세무 문제로 커진다는 점을 기억한다."
  example: "반도체 회사의 해외 판매법인은 본사에서 칩을 사 와 현지에 판다. 판매법인 이익률을 얼마로 둘지가 한국과 현지 국가의 세수를 나누는 문제라 양국 세무당국과 사전 합의(APA)를 하기도 한다."
  pitfalls:
    - "대체가격은 회사 전체 이익을 바꾸지 않는다고 무시하기 쉽다. 세금, 성과급, 소수주주 몫이 모두 바뀐다."
  related: [ca_performance, tax_international, tax_related_party, agency_theory]
  keywords: [대체가격, 이전가격, 정상가격, 독립기업원칙, APA, BEPS]
  applies_to:
    filings: [split, business_trf]
    news: [global, tax]
  quiz:
    - q: "부품 사업부가 설비 여유 없이 외부에 개당 8만원(변동비 5만원)에 팔고 있다. 사내 이전의 최소 대체가격은?"
      choices: ["5만원", "6만5천원", "8만원", "13만원"]
      answer: 2
      explain: "최소 대체가격 = 변동비 5만원 + 기회원가(포기하는 공헌이익) 3만원 = 8만원."

- id: ca_target_costing
  title: 목표원가·수명주기원가·품질원가
  field: 원가관리회계
  one_line: "시장에서 수용될 목표가격에서 목표이익을 차감하여 허용원가를 먼저 정하고 설계 단계부터 원가를 관리하는 기법으로, 수명주기원가와 품질원가를 함께 다룬다."
  easy: |
    전통적인 방식은 원가에 이익을 붙여 가격을 정한다(원가 + 이익 = 가격). 경쟁이 치열한 시장에서는 이것이 통하지 않는다. 목표원가 방식은 거꾸로 간다. 시장 가격 − 목표 이익 = 허용 원가. 소비자가 낼 가격이 정해져 있으니 그 안에 원가를 맞추도록 설계와 부품 선택을 바꾼다. 원가의 대부분(흔히 70~80%)이 설계 단계에서 이미 정해지기 때문이다.
    수명주기원가는 연구개발부터 생산, 판매, 사후 서비스와 폐기까지 제품 일생의 원가를 함께 보는 것이고, 품질원가는 불량을 막는 데 드는 돈(예방·평가)과 불량이 나서 드는 돈(내부·외부 실패)을 비교하는 것이다. 리콜 한 번의 외부 실패원가는 예방원가보다 훨씬 비싸다.
  deep:
    - "가치공학: 기능은 유지하면서 원가를 낮추는 설계 대안을 찾는다. 협력업체와 함께 부품 원가를 목표에 맞추는 공동 개발이 핵심이다."
    - "카이젠(개선) 원가: 생산에 들어간 뒤 매년 조금씩 원가를 낮추는 목표를 세운다. 설계 단계의 목표원가와 짝을 이룬다."
    - "품질원가 4분류: 예방(교육, 설계 검토), 평가(검사), 내부 실패(재작업, 폐기), 외부 실패(리콜, 보증 수리, 브랜드 손상)."
    - "수명주기 관점: 초기 개발비가 큰 제품(신약, 반도체, 게임)은 출시 후 수명 동안의 매출로 개발비를 회수할 수 있는지가 관건이다."
  worked:
    - "경쟁 제품 가격이 50만원이고 목표 영업이익률이 20%면 허용 원가는 40만원이다. 현재 설계 원가가 46만원이면 6만원(13%)을 설계 변경, 부품 공용화, 공급사 협상으로 줄여야 출시할 수 있다."
  law:
    basis: "도요타의 원가기획(1960년대), 전사적 품질경영(TQM)과 6시그마"
    purpose: "원가가 결정되는 기획·설계 단계에서 원가를 관리하고, 불량을 사후에 고치기보다 처음부터 막는 것이 싸다는 생각에서 나온 기법이다."
    background:
