  example: "스마트폰 신제품은 출고가를 먼저 정하고 그 가격에 맞춰 카메라·메모리 사양과 부품 공급사를 고른다. 원가가 안 맞으면 사양을 낮추거나 출고가를 올리는데, 출고가를 올리면 판매량이 줄 위험이 있다."
