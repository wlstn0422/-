# 조직·인사, 생산·운영 이론 카드

- id: org_structure
  title: 조직구조(기능별·사업부제·매트릭스·지주회사)
  field: 조직·인사
  one_line: "기업의 규모와 사업 범위에 따라 업무 분담과 권한 배분의 방식(기능별, 사업부제, 매트릭스, 지주회사)이 달라져야 한다는 이론이다(구조는 전략을 따른다)."
  easy: |
    작은 회사는 영업팀, 생산팀처럼 기능별로 나눠도 충분하다. 사업이 여러 개가 되면 사업마다 생산·영업을 다 갖춘 사업부제가 낫다. 사업부가 스스로 손익을 책임져 빠르게 움직인다. 기능과 사업을 교차해 두 상사에게 보고하는 매트릭스 구조도 있다. 더 커지면 사업마다 별도 법인을 두고 그 위에 지주회사를 세운다.
    조직개편, 분사, 지주사 전환 뉴스는 '전략이 바뀌어서 구조를 바꾸는 것'으로 읽으면 된다. 그러니 구조 변화 기사를 보면 먼저 어떤 전략 변화가 있었는지 찾아야 한다.
  deep:
    - "기능별 조직: 전문성과 효율이 높지만 부서 간 벽(사일로)이 생긴다."
    - "사업부제: 책임경영과 시장 대응이 빠르지만 기능이 중복돼 비용이 든다."
    - "매트릭스: 자원을 함께 쓰지만 보고 체계가 혼란스럽다."
    - "지주회사: 사업 간 위험을 차단하고 인수합병이 유연하지만 지주사 할인이 생긴다."
    - "집권과 분권의 균형: 본사가 얼마나 결정하고 현장에 얼마나 맡길지."
  how_to:
    - "오늘 사례의 구조 변화 전과 후를 그림으로 그려 본다."
    - "그 변화를 부른 전략 변화(신사업, 해외 확장, 위기 대응)를 찾는다."
    - "보상과 의사결정 권한도 같이 바뀌었는지 확인한다."
  example: "대기업 그룹의 지주회사 전환, 사업부를 독립 법인으로 떼어내는 분사, 연말 조직개편 발표가 모두 이 이론으로 읽힌다."
  pitfalls:
    - "구조만 바꾸고 보상과 의사결정 방식이 그대로면 효과가 없다."
  related: [conglomerate_discount, incentives, agency_theory]
  keywords: [사업부제, 매트릭스, 사일로, 분권화]
  quiz:
    - q: "'구조는 전략을 따른다'고 한 학자는?"
      choices: ["포터", "챈들러", "코터", "드러커"]
      answer: 1
      explain: "알프레드 챈들러가 미국 대기업의 사업부제 도입 과정을 연구하며 남긴 말이다."

- id: incentives
  title: 보상과 동기부여
  field: 조직·인사
  one_line: "보상의 기준과 크기가 구성원의 행동을 결정한다는 관점에서 보상 체계를 설계하는 이론이다."
  easy: |
    동기부여 이론은 두 갈래다. 하나는 사람이 무엇을 원하는가다. 허즈버그의 2요인 이론에 따르면 급여·근무환경 같은 위생요인은 불만을 줄일 뿐 만족을 만들지 못하고, 성장·인정·성취 같은 동기요인이 만족을 만든다. 다른 하나는 사람이 어떻게 움직이는가다. 브룸의 기대이론은 노력하면 성과가 나고, 성과가 보상으로 이어지고, 그 보상이 나에게 가치 있을 때 사람이 움직인다고 본다.
    성과급, 스톡옵션, 양도제한조건부주식(RSU) 같은 보상 설계 기사를 보면 이 고리 중 어디를 강화하려는지 보면 된다.
  deep:
    - "측정한 것만 관리된다: 매출만 보상하면 이익이 무시되고, 단기 실적만 보상하면 장기 투자가 줄어든다."
    - "주식 보상: 경영자·직원과 주주의 이해를 맞추는 대리인 비용 해법. 회계상으로는 주식보상비용(K-IFRS 1102)으로 인식된다."
    - "공정성 이론: 남과 비교해 불공정하다고 느끼면 동기가 떨어진다(성과급 논란의 핵심)."
    - "과도한 금전 보상은 일 자체의 흥미(내재적 동기)를 떨어뜨릴 수 있다."
  how_to:
    - "오늘 사례의 보상 기준이 무엇인지(매출, 영업이익, 주가, 개인·팀 성과) 적는다."
    - "그 기준이 회사가 원하는 행동과 맞는지 본다."
    - "인건비 증가가 이익에 미치는 영향을 숫자로 확인한다."
  example: "성과급 산정 기준을 둘러싼 노사 갈등, 임직원 주식 보상 확대 공시가 이 이론의 실제 사례다."
  pitfalls:
    - "협업이 필요한 일에 개인 성과급을 크게 걸면 오히려 팀 성과가 떨어질 수 있다."
  related: [agency_theory, org_structure, restructuring_labor]
  keywords: [2요인 이론, 기대이론, 공정성 이론, RSU]
  quiz:
    - q: "허즈버그 2요인 이론에서 급여는 어디에 속할까?"
      choices: ["동기요인", "위생요인", "성장요인", "공정요인"]
      answer: 1
      explain: "급여가 부족하면 불만이 생기지만, 많다고 해서 만족과 몰입이 계속 늘지는 않는다고 본다."

- id: restructuring_labor
  title: 구조조정·변화관리·노사관계
  field: 조직·인사
  one_line: "사업을 축소하거나 재편할 때 인력과 비용을 조정하는 방법과, 노사 간 교섭의 원리에 관한 이론과 실무이다."
  easy: |
    실적이 나빠진 회사는 비용을 줄여야 하는데 인건비는 가장 크고 민감한 고정비다. 희망퇴직, 순환휴직, 사업 매각·철수 같은 구조조정은 당장 비용(퇴직위로금)을 치르고 장기 고정비를 낮추는 선택이다.
    노동조합과의 협상은 협상력의 게임이다. 파업 때 회사가 잃는 매출과 노동자가 잃는 임금, 대체 인력의 가능성, 여론이 각자의 협상력을 정한다. 코터의 변화관리 8단계(위기감 조성, 추진팀 구성, 비전 수립, 소통, 장애 제거, 단기 성과, 확산, 정착)는 구조조정이 실패하지 않게 하는 실무 지침이다.
  deep:
    - "회계: 희망퇴직 비용은 그해 비용(퇴직급여, 구조조정 충당부채)으로 잡혀 이익을 줄이지만 다음 해 인건비를 낮춘다."
    - "경제학: 임금이 쉽게 내려가지 않는 임금 경직성 때문에 불황기에는 임금 조정 대신 고용 조정(해고·채용 축소)이 일어나기 쉽다."
    - "근로기준법 제24조 경영상 해고 요건: 긴박한 경영상 필요, 해고 회피 노력, 합리적이고 공정한 기준, 근로자대표와의 협의."
  how_to:
    - "오늘 사례의 구조조정 규모(인원, 비용)를 회사 전체 인건비와 비교한다."
    - "일회성 비용이 언제 반영되고 절감 효과는 언제 나타날지 시점을 나눠 본다."
    - "노사 협상이라면 양쪽의 협상력(파업 손실, 대체 가능성)을 적는다."
  example: "업황 부진 업종에서 희망퇴직 공시가 나오면, 그해는 일회성 비용으로 이익이 줄고 이듬해 고정비 감소로 이익이 개선되는 흐름이 흔하다."
  pitfalls:
    - "인력 감축이 핵심 인재 유출로 이어지면 장기 경쟁력이 약해진다."
  related: [incentives, org_structure, operating_leverage, game_theory]
  keywords: [희망퇴직, 변화관리 8단계, 임금 경직성, 교섭력]
  quiz:
    - q: "근로기준법상 경영상 해고(정리해고)의 요건이 아닌 것은?"
      choices: ["긴박한 경영상의 필요", "해고를 피하려는 노력", "합리적이고 공정한 해고 기준", "주주총회 특별결의"]
      answer: 3
      explain: "근로기준법 제24조의 요건은 앞의 세 가지와 근로자대표와의 성실한 협의다."

- id: supply_chain
  title: 공급망 관리와 채찍효과
  field: 생산·운영
  one_line: "원재료에서 최종소비자에 이르는 공급망을 관리하는 원리로, 최종 수요의 작은 변화가 상류로 갈수록 확대되는 채찍효과를 포함한다."
  easy: |
    소비자 수요가 조금 늘면 소매점은 혹시 몰라 조금 더 주문하고, 도매상은 그보다 더, 제조사는 또 더 주문한다. 끝단의 작은 흔들림이 위로 갈수록 채찍처럼 크게 휘는 것을 채찍효과라고 한다. 주문이 몰렸다가 끊기면서 재고가 쌓이거나 모자란다.
    코로나 시기의 반도체·물류 대란과 그 뒤의 재고 과잉이 대표적이다. 그 뒤로는 효율보다 안정을 중시해 공급처를 여러 곳으로 나누거나(다변화), 생산을 본국이나 가까운 나라로 옮기는(리쇼어링·니어쇼어링) 흐름이 강해졌다.
  deep:
    - "채찍효과의 원인: 수요 예측을 자꾸 고침, 주문을 몰아서 함, 가격 변동 때 사재기, 공급 부족 때 실제보다 많이 주문(부족 게임)."
    - "대응: 판매 데이터 공유, 공급자가 재고를 관리(VMI), 리드타임 단축."
    - "지표: 재고자산회전율, 재고 보유일수, 리드타임, 가동률."
    - "지정학 리스크: 관세, 수출 규제, 해상 운임이 공급망 원가를 흔든다."
  how_to:
    - "오늘 사례(감산, 증설, 공급 차질)가 공급망의 어느 단계에서 일어났는지 표시한다."
    - "재고자산과 재고 보유일수가 어떻게 변하고 있는지 본다."
    - "원가 상승분을 고객에게 넘길 수 있는지(가격 전가력) 생각한다."
  example: "2021년 차량용 반도체 부족으로 자동차 회사들이 생산을 줄였고, 그 뒤 반도체·전자 업계는 재고 과잉으로 실적이 꺾이는 흐름을 겪었다."
  pitfalls:
    - "공급망을 지나치게 안정 위주로 바꾸면 원가가 올라 가격 경쟁력이 떨어진다."
  related: [lean_inventory, vertical_integration, trade_tariff, value_chain]
  keywords: [채찍효과, 리쇼어링, VMI, 리드타임]
  quiz:
    - q: "끝단의 작은 수요 변화가 공급망 위로 갈수록 커지는 현상은?"
      choices: ["채찍효과", "학습곡선", "승수효과", "네트워크 효과"]
      answer: 0
      explain: "P&G 기저귀 사례로 널리 알려진 현상이다."

- id: lean_inventory
  title: 린 생산(JIT)과 재고관리
  field: 생산·운영
  one_line: "낭비를 제거하고 필요한 것을 필요한 때에 필요한 양만큼 생산하는 방식(JIT)과, 적정 재고 수준을 결정하는 원리이다."
  easy: |
    도요타가 만든 린 생산의 핵심은 '재고는 문제를 숨긴다'는 생각이다. 재고를 줄이면 불량, 지연, 비효율이 바로 드러나 고칠 수 있다. 그래서 부품을 필요한 시점에 맞춰 받는 JIT(적시생산)를 쓴다.
    다만 재고가 너무 적으면 공급이 끊길 때 공장이 바로 멈춘다. 그래서 수요와 공급의 불확실성에 대비한 안전재고를 따로 둔다. 한 번에 얼마씩 주문할지는 주문비용과 보관비용의 균형점인 경제적 주문량(EOQ)으로 계산한다.
  deep:
    - "7대 낭비: 과잉생산, 대기, 운반, 불필요한 가공, 재고, 동작, 불량."
    - "EOQ = √(2 × 연간 수요 × 1회 주문비용 ÷ 단위당 연간 보관비용)."
    - "재고자산회전율 = 매출원가 ÷ 평균 재고, 재고 보유일수 = 365 ÷ 회전율."
    - "재고가 쌓이면 재고자산평가손실(저가법) 위험이 커진다. 회계와 이어지는 지점이다."
  how_to:
    - "오늘 사례 회사의 재고 보유일수를 전년, 경쟁사와 비교한다."
    - "재고 변화가 판매 증가 때문인지 생산 감축 때문인지 구분한다."
    - "공급망 위험이 큰 부품에 안전재고를 늘렸는지 본다."
  example: "2021년 공급망 위기 이후 JIT만 고집하던 제조업체들이 핵심 부품에 한해 안전재고를 늘리는 '저스트 인 케이스' 방식으로 일부 돌아섰다."
  pitfalls:
    - "재고 감소가 늘 좋은 신호는 아니다. 생산을 줄여서 재고가 준 것일 수도 있다."
  related: [supply_chain, generic_strategy, operating_leverage]
  keywords: [도요타 생산방식, 안전재고, EOQ, 재고회전]
  quiz:
    - q: "연간 수요 800개, 1회 주문비용 50원, 단위당 연간 보관비용 2원일 때 경제적 주문량(EOQ)은?"
      choices: ["100개", "200개", "400개", "800개"]
      answer: 1
      explain: "√(2 × 800 × 50 ÷ 2) = √40,000 = 200개."
