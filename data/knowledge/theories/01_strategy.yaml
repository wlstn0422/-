# 경영전략 이론 카드
# 필드: id, title, field, one_line(한 줄 정의), easy(쉬운 설명), deep(조금 더 깊게), how_to(사례에 적용하는 순서),
#       example(실제 예), pitfalls(자주 하는 오해), related(같이 볼 이론), keywords(더 찾아볼 말), quiz

- id: five_forces
  title: 포터의 5가지 경쟁요인(5 Forces)
  field: 경영전략
  one_line: "어떤 산업이 구조적으로 돈을 벌기 쉬운지를 다섯 가지 힘의 세기로 따져보는 틀."
  easy: |
    장사가 잘되는지는 회사 실력만이 아니라 그 회사가 서 있는 '판'의 구조에도 달려 있다. 마이클 포터는 그 판을 다섯 가지 힘으로 봤다. 기존 경쟁자끼리 얼마나 치열하게 싸우는지, 새 경쟁자가 들어오기 쉬운지, 대신 쓸 수 있는 대체재가 있는지, 원재료를 파는 공급자가 갑인지, 물건을 사 가는 구매자가 갑인지다.
    다섯 힘이 셀수록 회사가 만든 이익이 경쟁자·공급자·고객에게 새어 나가 산업 평균 이익률이 낮아진다. 반대로 진입이 어렵고, 대체재가 없고, 공급자와 구매자가 약한 산업은 평범한 회사도 돈을 잘 번다.
  deep:
    - "진입장벽: 규모의 경제, 막대한 초기 투자, 규제·인허가, 브랜드, 유통망, 고객의 전환비용이 높을수록 새 경쟁자가 들어오기 어렵다."
    - "공급자 교섭력: 공급자가 소수이거나 대체 공급처가 없으면 원가를 올려도 받아들여야 한다."
    - "구매자 교섭력: 구매자가 소수의 대형 고객이거나 제품이 표준화돼 비교가 쉬우면 가격 인하 압박이 커진다."
    - "대체재 위협: 같은 필요를 다른 방식으로 채우는 상품(항공 대 고속철)이 가격의 상한을 만든다."
    - "경쟁 강도: 경쟁사가 많고 비슷하며, 고정비가 크고 시장 성장이 느리면 가격 전쟁이 잦다."
  how_to:
    - "산업을 좁게 정의한다('식품'이 아니라 '라면', '반도체'가 아니라 'D램')."
    - "다섯 힘 각각을 강·중·약으로 매기고 근거(점유율, 고객 집중도, 원가 비중)를 붙인다."
    - "가장 센 힘이 이 회사의 이익률을 어떻게 깎는지 연결한다."
    - "오늘 사례(가격 인상, 인수, 규제, 신규 진입)가 다섯 힘 중 무엇을 바꾸는지 적는다."
  example: "항공산업은 비행기를 파는 회사가 보잉·에어버스 둘뿐이라 공급자 힘이 세고, 고객은 가격 비교가 쉬워 구매자 힘도 세며, 고정비가 커서 가격 경쟁이 잦다. 그래서 매출 규모에 비해 이익률이 낮은 대표 산업으로 꼽힌다."
  pitfalls:
    - "산업 구조는 '평균 수익성'을 설명할 뿐, 같은 산업에서 누가 이기는지는 경쟁전략과 역량으로 따로 봐야 한다."
    - "플랫폼처럼 생태계가 얽힌 산업에서는 함께 쓰일 때 가치가 커지는 보완재의 역할도 봐야 한다."
  related: [generic_strategy, market_structure, network_platform]
  keywords: [산업구조분석, 진입장벽, 교섭력, 보완재]
  quiz:
    - q: "산업의 평균 수익성을 낮추는 요인으로 보기 어려운 것은?"
      choices: ["진입장벽이 높다", "구매자가 소수의 대형 고객이다", "대체재가 많다", "고정비가 커서 가격 경쟁이 잦다"]
      answer: 0
      explain: "진입장벽이 높으면 새 경쟁자가 들어오기 어려워 기존 회사의 수익성이 지켜진다."

- id: generic_strategy
  title: 본원적 경쟁전략(원가우위·차별화·집중)
  field: 경영전략
  one_line: "경쟁에서 이기는 길은 '더 싸게 만들기(원가우위)'와 '더 비싸게 받을 이유 만들기(차별화)', 그리고 좁은 시장에 집중하기다."
  easy: |
    같은 산업 안에서도 돈을 잘 버는 회사와 못 버는 회사가 갈린다. 포터는 경쟁우위의 원천을 두 가지로 정리했다. 경쟁사보다 낮은 원가로 만들어 같은 가격에도 더 많이 남기는 원가우위, 그리고 고객이 기꺼이 더 비싼 값을 내게 만드는 차별화다. 여기에 시장 전체가 아니라 특정 고객층만 노리는 집중 전략이 더해진다.
    포터는 둘 다 잡으려다 둘 다 놓친 회사를 '어중간하게 끼인(stuck in the middle)' 상태라고 경고했다. 원가도 경쟁사보다 높고 고객이 더 낼 이유도 없으면 가격 경쟁에서 가장 먼저 밀린다.
  deep:
    - "원가우위의 원천: 규모의 경제, 학습곡선, 공정 혁신, 싼 원재료 조달, 제품 표준화."
    - "차별화의 원천: 품질, 디자인, 브랜드, 기술, 서비스, 생태계. 핵심은 고객의 지불의사(더 낼 의향)가 올라가는 것."
    - "집중 전략: 좁은 시장에서 원가로 이기거나(원가 집중) 맞춤형으로 이기기(차별화 집중)."
    - "재무 신호: 원가우위 기업은 매출총이익률이 낮아도 자산회전율이 높고, 차별화 기업은 매출총이익률과 광고·연구개발 비중이 높은 편이다. 듀퐁 분해와 같이 보면 잘 보인다."
  how_to:
    - "회사가 내세우는 강점이 '싸다' 쪽인지 '다르다' 쪽인지 고른다."
    - "매출총이익률, 판관비율, 자산회전율을 경쟁사와 비교해 그 주장이 숫자로 맞는지 본다."
    - "오늘 사례(가격 인하, 프리미엄 제품 출시, 원가 절감)가 원래 전략과 같은 방향인지 확인한다."
  example: "코스트코·이케아는 원가우위, 애플은 차별화의 교과서다. 같은 커피라도 저가 커피 브랜드와 스페셜티 커피 매장은 서로 다른 전략으로 돈을 번다."
  pitfalls:
    - "원가우위는 '싸구려'가 아니다. 고객이 받아들이는 품질은 유지하면서 원가가 낮아야 한다."
    - "데이터·플랫폼 기업처럼 규모가 커질수록 원가는 내려가고 품질은 올라가 두 가지를 함께 달성하는 경우도 있다."
  related: [five_forces, value_chain, scale_scope_learning, brand_equity]
  keywords: [경쟁우위, 지불의사, 어중간한 위치]
  quiz:
    - q: "매출총이익률은 낮지만 재고와 자산 회전이 매우 빠른 유통기업이 주로 택한 전략은?"
      choices: ["원가우위", "차별화", "비관련 다각화", "수직계열화"]
      answer: 0
      explain: "적게 남기고 많이 파는 구조다. 듀퐁 분해로 보면 이익률보다 회전율이 ROE를 만든다."

- id: value_chain
  title: 가치사슬
  field: 경영전략
  one_line: "회사가 고객 가치를 만드는 과정을 활동 단위로 쪼개, 어디서 돈을 벌고 어디서 새는지 찾는 틀."
  easy: |
    회사는 원재료를 들여오고(구매물류), 만들고(생산), 내보내고(출하물류), 팔고(마케팅·영업), 사후관리(서비스)를 한다. 이 다섯 가지 본원적 활동을 인사, 기술개발, 조달, 기획·재무 같은 지원 활동이 받친다.
    활동마다 드는 비용과 그 활동이 만드는 가치를 비교하면 어떤 단계를 직접 하고 어떤 단계를 외부에 맡길지, 경쟁우위가 어디서 나오는지가 보인다. 인수·매각·외주화 기사는 대부분 가치사슬의 어느 고리를 바꾸는 이야기다.
  deep:
    - "스마일 커브: 전자·IT 산업에서는 연구개발·디자인(앞단)과 브랜드·서비스(뒷단)의 부가가치가 높고 조립·생산(가운데)이 낮다는 관찰."
    - "외주화와 내재화: 핵심 활동은 직접, 비핵심은 외부에 맡기는 판단의 근거가 된다(수직계열화 이론과 연결)."
    - "산업 가치사슬: 원재료부터 최종 소비자까지 산업 전체에서 이익이 어느 단계에 몰리는지도 볼 수 있다."
  how_to:
    - "회사의 활동을 단계별로 나누고 각 단계의 큰 비용 항목(매출원가·판관비 주석)을 붙인다."
    - "경쟁사와 다르게 하는 활동을 찾는다. 그게 경쟁우위 후보다."
    - "오늘 사례가 어느 단계를 사거나 팔거나 외부에 맡기는지 표시한다."
  example: "애플은 설계와 브랜드·소프트웨어 생태계에 집중하고 조립은 위탁생산 업체에 맡긴다. 반대로 많은 국내 제조 대기업은 부품부터 완제품까지 직접 하는 수직계열화로 원가와 속도를 잡았다."
  pitfalls:
    - "활동을 나열하는 데서 끝내면 의미가 없다. 경쟁사 대비 차이와 숫자로 이어져야 분석이다."
  related: [vertical_integration, generic_strategy, supply_chain]
  keywords: [스마일커브, 아웃소싱, 핵심활동]
  quiz:
    - q: "스마일 커브에서 부가가치가 가장 낮다고 보는 단계는?"
      choices: ["연구개발", "디자인", "조립·생산", "브랜드·서비스"]
      answer: 2
      explain: "가운데 조립·생산 단계는 표준화돼 경쟁이 심하고 부가가치가 낮다고 본다."

- id: rbv_vrio
  title: 자원기반관점과 VRIO
  field: 경영전략
  one_line: "오래가는 경쟁우위는 남이 쉽게 따라 하지 못하는 회사 내부 자원에서 나온다는 관점과 그 판별법."
  easy: |
    같은 시장에 있는데 왜 어떤 회사만 계속 잘할까. 자원기반관점은 그 답을 회사 안에서 찾는다. 특허, 브랜드, 노하우, 조직문화, 고객 데이터 같은 자원이 가치 있고(Valuable), 드물고(Rare), 따라 하기 어렵고(Inimitable), 그 자원을 제대로 쓸 조직(Organized)이 갖춰져 있으면 오래가는 경쟁우위가 된다.
    네 질문에 차례로 답해 보는 게 VRIO 분석이다. 어느 질문에서 '아니오'가 나오는지에 따라 경쟁 동등, 일시적 우위, 지속적 우위가 갈린다.
  deep:
    - "가치만 있으면 경쟁 동등, 가치와 희소성까지면 일시적 우위, 네 가지를 다 갖추면 지속적 우위."
    - "따라 하기 어려운 이유: 오랜 시간이 쌓여 만들어진 것(경로 의존), 무엇이 성공 요인인지 분명하지 않은 것(인과 모호성), 사람과 문화가 복잡하게 얽힌 것(사회적 복잡성)."
    - "핵심역량: 여러 사업에 두루 쓰이는 회사 고유 능력. 다각화와 인수가 성공하려면 이 역량이 새 사업에도 통해야 한다."
  how_to:
    - "오늘 사례 회사가 내세우는 강점을 자원 단위로 적는다."
    - "각 자원에 V·R·I·O 질문을 던져 어디서 막히는지 본다."
    - "인수·매각 사례라면 무엇을 사 오고 무엇을 넘기는지를 자원 관점에서 본다."
  example: "반도체 공정 노하우나 제약사의 임상 경험은 돈만으로 빨리 살 수 없어 모방이 어렵다. 반면 누구나 살 수 있는 장비만으로는 오래가는 우위가 되기 어렵다."
  pitfalls:
    - "강점 자원이 시장 변화 뒤에는 오히려 짐(핵심 경직성)이 될 수 있다."
  related: [generic_strategy, ansoff_diversification, ma_synergy]
  keywords: [핵심역량, 모방 불가능성, 경로 의존]
  quiz:
    - q: "VRIO에서 지속적 경쟁우위가 되려면 필요한 조건은?"
      choices: ["가치만 있으면 된다", "가치와 희소성", "가치·희소성·모방 불가능성·조직", "희소성과 조직"]
      answer: 2
      explain: "네 가지를 모두 갖춰야 경쟁사가 따라오지 못하는 우위가 오래간다."

- id: ansoff_diversification
  title: 성장전략(앤소프 매트릭스)과 다각화
  field: 경영전략
  one_line: "기존·새 제품과 기존·새 시장을 조합해 성장 경로를 네 가지로 나누고, 멀리 갈수록 위험이 커진다는 틀."
  easy: |
    회사가 크는 길은 네 가지다. 지금 제품을 지금 시장에 더 파는 시장침투, 지금 제품으로 해외나 새 고객층에 가는 시장개발, 지금 시장에 새 제품을 내놓는 제품개발, 제품과 시장이 모두 새로운 다각화다. 다각화 쪽으로 갈수록 아는 게 적어 실패 확률이 높다.
    다각화 중에서도 기존 사업과 기술·고객·유통이 겹치는 관련 다각화가 무관한 사업으로 가는 비관련 다각화보다 성과가 낫다는 연구가 많다. '신성장동력'을 발표하는 기사를 보면 이 네 칸 중 어디인지부터 짚어 보자.
  deep:
    - "관련 다각화의 이점: 설비·브랜드·유통을 함께 쓰는 범위의 경제, 핵심역량 이전."
    - "비관련 다각화의 한계: 위험 분산을 내세우지만 주주는 스스로 분산투자를 할 수 있어 회사가 대신할 이유가 약하다. 그래서 복합기업 할인으로 이어지기 쉽다."
    - "성장 방식: 직접 개발(build), 제휴(ally), 인수(buy) 중 무엇을 골랐는지도 같이 본다."
  how_to:
    - "오늘 사례가 네 칸 중 어디에 해당하는지 고른다."
    - "본업의 어떤 역량(기술, 고객, 유통, 브랜드)이 새 사업에 쓰이는지 적는다."
    - "자체 개발·제휴·인수 중 무엇을 택했고 왜 그랬을지 생각한다."
  example: "해외 법인 설립은 시장개발, 식품회사의 건강기능식품 출시는 제품개발, 본업과 무관한 업종 인수는 다각화에 가깝다."
  pitfalls:
    - "발표만으로 성공을 판단하지 말고, 본업 역량이 새 사업에 실제로 쓰이는지와 투자 규모를 본다."
  related: [ma_synergy, conglomerate_discount, rbv_vrio, bcg_portfolio]
  keywords: [시장침투, 시장개발, 관련다각화]
  quiz:
    - q: "앤소프 매트릭스에서 일반적으로 위험이 가장 큰 성장 경로는?"
      choices: ["시장침투", "시장개발", "제품개발", "다각화"]
      answer: 3
      explain: "제품과 시장이 모두 새로워 회사가 아는 것이 가장 적다."

- id: vertical_integration
  title: 수직계열화와 거래비용이론
  field: 경영전략
  one_line: "부품이나 유통을 직접 할지(만들기) 시장에서 살지(사기)는 시장 거래에 드는 비용과 직접 할 때 드는 비용을 비교해 정한다."
  easy: |
    회사가 모든 걸 직접 하지 않고 시장에서 사 오는 이유는 보통 그게 더 싸고 효율적이어서다. 그런데 거래 상대를 찾고, 계약을 맺고, 약속을 지키는지 감시하는 데도 비용이 든다. 이걸 거래비용이라고 한다.
    특히 그 거래에만 쓰이는 특수한 설비나 기술에 투자해야 하면, 상대가 나중에 값을 올려도 꼼짝 못 하는 '볼모 문제'가 생긴다. 이런 비용이 크면 직접 하는 쪽, 즉 수직계열화가 낫다. 코스와 윌리엄슨이 발전시킨 거래비용이론이다.
  deep:
    - "후방 통합(원재료·부품 쪽으로 확장)과 전방 통합(유통·판매 쪽으로 확장)."
    - "장점: 공급 안정, 품질·일정 통제, 이윤 내재화, 기술 유출 방지."
    - "단점: 고정비와 투자 부담 증가, 외부 경쟁 압력이 사라져 효율 저하, 기술 변화에 둔해짐."
    - "중간 형태: 장기공급계약, 합작투자, 지분 투자처럼 '반만 묶는' 방법도 있다."
  how_to:
    - "오늘 사례가 가치사슬의 앞쪽(공급)인지 뒤쪽(유통·판매)인지 표시한다."
    - "그 거래에만 쓰이는 특수 자산이 있는지, 공급처가 몇 곳인지 본다."
    - "계열화 후 고정비와 부채가 얼마나 늘어나는지 숫자로 확인한다."
  example: "전기차 회사들이 배터리를 직접 만들거나 배터리 회사와 합작공장을 세우는 것은 핵심 부품의 공급 안정과 원가 통제를 위한 후방 통합이다."
  pitfalls:
    - "계열화가 늘 효율적인 건 아니다. 경기 침체기에는 커진 고정비가 부담이 된다."
  related: [value_chain, supply_chain, ma_synergy]
  keywords: [거래비용, 특수자산, 볼모문제, 합작투자]
  quiz:
    - q: "거래비용이론에서 수직계열화 유인이 커지는 상황은?"
      choices: ["공급자가 많고 제품이 표준화돼 있을 때", "그 거래에만 쓰이는 특수 자산 투자가 클 때", "거래가 한 번뿐일 때", "시장 가격이 투명할 때"]
      answer: 1
      explain: "특수 자산에 투자하면 상대에게 묶여 볼모가 되기 쉬워 직접 하는 편이 안전해진다."

- id: scale_scope_learning
  title: 규모의 경제·범위의 경제·학습곡선
  field: 경영전략
  one_line: "많이 만들수록(규모), 여러 가지를 함께 만들수록(범위), 오래 만들수록(학습) 단위당 원가가 떨어진다."
  easy: |
    공장을 짓는 데 1조원이 들었다면 제품을 1개 만들 때와 100만 개 만들 때 개당 공장비 부담이 전혀 다르다. 이게 규모의 경제다. 같은 설비·브랜드·유통망으로 여러 제품을 팔면 따로 할 때보다 싸게 되는 건 범위의 경제다.
    생산 경험이 쌓일수록 불량이 줄고 속도가 빨라져 원가가 떨어지는 건 학습곡선이다. 누적 생산량이 두 배가 될 때마다 단위원가가 일정 비율씩 떨어진다고 해서 경험곡선이라고도 한다. 합병의 명분으로 가장 자주 나오는 말이 바로 이 세 가지다.
  deep:
    - "고정비 비중이 큰 산업(반도체, 통신, 소프트웨어, 플랫폼)일수록 규모의 경제가 강하고, 그래서 소수 기업이 시장을 나눠 갖는 과점이 되기 쉽다."
    - "규모의 불경제: 너무 커지면 관리 비용과 관료주의 때문에 오히려 효율이 떨어진다."
    - "범위의 경제는 합병·다각화의 대표 근거이고, 학습곡선은 먼저 시작한 회사가 앞서 나가는 선점 효과의 근거다."
  how_to:
    - "오늘 사례가 생산량(규모), 제품 종류(범위), 경험(학습) 중 무엇을 늘리는지 고른다."
    - "회사가 말하는 원가 절감 효과가 매출원가율이나 판관비율로 확인되는지 본다."
    - "합병이라면 중복되는 설비·인력·유통이 실제로 얼마나 되는지 따져본다."
  example: "반도체는 공장 하나에 수십조원이 드는 대표적 규모의 경제 산업이고, 정상 제품 비율(수율)이 생산 경험으로 올라가는 학습곡선이 경쟁력을 가른다."
  pitfalls:
    - "'규모를 키우면 원가가 내려간다'는 명분은 합병 1~2년 뒤 원가율 변화로 반드시 확인해야 한다."
  related: [generic_strategy, market_structure, ma_synergy, operating_leverage]
  keywords: [경험곡선, 고정비, 수율, 선점효과]
  quiz:
    - q: "누적 생산량이 늘수록 단위원가가 떨어지는 현상은?"
      choices: ["범위의 경제", "학습곡선(경험곡선)", "채찍효과", "네트워크 효과"]
      answer: 1
      explain: "경험이 쌓이며 효율이 오르는 현상이다. 반도체 수율 개선이 대표 예다."

- id: network_platform
  title: 네트워크 효과와 플랫폼(양면시장)
  field: 경영전략
  one_line: "쓰는 사람이 많을수록 가치가 커지는 상품은 한번 앞서면 격차가 벌어지고, 두 집단을 연결하는 플랫폼은 이 힘으로 성장한다."
  easy: |
    메신저는 친구들이 다 쓰니까 쓴다. 사용자가 늘수록 모두에게 가치가 커지는 걸 네트워크 효과라고 한다. 배달앱처럼 식당과 손님 두 집단을 연결하는 플랫폼에서는 식당이 많아야 손님이 오고, 손님이 많아야 식당이 들어온다. 이를 양면시장, 또는 교차 네트워크 효과라고 한다.
    그래서 플랫폼은 초기에 한쪽에 보조금(할인·쿠폰)을 뿌려 판을 키우고, 일단 1위가 되면 승자독식에 가까운 구조가 된다. 그 뒤 수수료를 올리면서 입점 업체와 갈등이 생기고, 독점 규제 논의가 따라오는 흐름이 반복된다.
  deep:
    - "직접 네트워크 효과(같은 쪽 사용자끼리)와 간접 네트워크 효과(반대편 사용자 수)."
    - "임계점(critical mass)을 넘기 전까지는 적자를 감수하는 경우가 많다."
    - "수수료(테이크레이트)를 얼마나, 어느 쪽에 받을지가 플랫폼의 핵심 가격 결정이다."
    - "여러 플랫폼을 동시에 쓰기 쉬우면(멀티호밍) 승자독식이 약해진다."
  how_to:
    - "오늘 사례의 플랫폼이 연결하는 두 집단이 누구인지 적는다."
    - "어느 쪽이 돈을 내고 어느 쪽이 보조를 받는지 본다."
    - "이용자 수, 거래액(GMV), 수수료율, 이탈률 숫자를 찾는다."
  example: "배달앱, 오픈마켓, 차량호출 앱이 대표적이다. 초기 할인으로 이용자를 모으고 시장을 장악한 뒤 수수료를 올리면서 입점 업체와 갈등이 생기는 흐름이 반복됐다."
  pitfalls:
    - "네트워크 효과가 지역 단위로만 작동하면(배달, 차량호출) 전국 1위라도 지역마다 경쟁이 남는다."
  related: [market_structure, clv_cac, pricing_strategy, disruptive_innovation]
  keywords: [양면시장, 승자독식, 멀티호밍, 테이크레이트]
  quiz:
    - q: "식당이 많아야 손님이 오고 손님이 많아야 식당이 오는 구조를 뭐라고 할까?"
      choices: ["규모의 경제", "양면시장(교차 네트워크 효과)", "수직계열화", "가격차별"]
      answer: 1
      explain: "두 집단이 서로의 규모 때문에 모여드는 구조다."

- id: disruptive_innovation
  title: 파괴적 혁신과 기술 S곡선
  field: 경영전략
  one_line: "처음엔 성능이 떨어지고 싸 보여서 1등 기업이 무시한 기술이 점점 좋아져 결국 시장을 뒤집는 현상."
  easy: |
    1등 기업은 가장 돈 되는 고객을 위해 제품을 계속 좋게 만든다(존속적 혁신). 그런데 시장 아래쪽에서 '덜 좋지만 훨씬 싸고 편한' 제품이 나오면 1등 기업은 수익성이 낮아 보여 무시하기 쉽다. 그 제품이 빠르게 좋아져 주류 고객까지 만족시키면 판이 뒤집힌다.
    크리스텐슨이 말한 '혁신기업의 딜레마'다. 1등이 무능해서가 아니라 기존 고객과 수익성만 보고 합리적으로 판단했기 때문에 당한다는 게 핵심이다.
  deep:
    - "저가 시장 파괴(싼 대안)와 신시장 파괴(이전에 쓰지 않던 사람을 끌어들임)."
    - "기술 S곡선: 기술은 처음엔 느리게, 중간에 빠르게, 성숙기엔 다시 느리게 발전한다. 다음 곡선으로 갈아타는 시점이 승부처다."
    - "대응: 새 사업을 기존 사업 잣대로 평가하지 않도록 별도 조직을 만든다."
  how_to:
    - "오늘 사례의 새 기술·서비스가 처음에 어떤 고객을 노리는지 본다(저가·비주류인가)."
    - "기존 1등 기업이 그 시장을 왜 무시하거나 늦게 대응하는지 적는다."
    - "성능 개선 속도가 주류 고객의 요구를 언제 따라잡을지 생각한다."
  example: "디지털카메라를 일찍 개발하고도 필름 사업을 지키려다 몰락한 코닥, 매장 대여에서 스트리밍으로 넘어가지 못한 비디오 대여점이 대표 사례다."
  pitfalls:
    - "새롭고 좋은 기술이 모두 파괴적 혁신은 아니다. 처음엔 성능이 낮고 저가·비주류 시장에서 시작한다는 게 정의의 핵심이다."
  related: [diffusion_chasm, network_platform, rbv_vrio]
  keywords: [혁신기업의 딜레마, 존속적 혁신, S곡선]
  quiz:
    - q: "파괴적 혁신이 처음 자리 잡는 곳은 주로 어디일까?"
      choices: ["기존 기업의 가장 수익성 높은 고객층", "기존 기업이 관심 없는 저가·비주류 시장", "정부 조달 시장", "명품 시장"]
      answer: 1
      explain: "1등 기업이 무시하는 시장에서 시작해 위로 올라온다."

- id: bcg_portfolio
  title: BCG 매트릭스(사업 포트폴리오)
  field: 경영전략
  one_line: "여러 사업을 시장 성장률과 상대적 점유율로 네 칸에 놓고, 어디에 돈을 넣고 어디서 돈을 뺄지 정하는 틀."
  easy: |
    사업이 여러 개인 회사는 한정된 돈을 어디에 쓸지 정해야 한다. BCG 매트릭스는 사업을 넷으로 나눈다. 시장도 크고 점유율도 높은 스타(계속 투자), 시장 성장은 끝났지만 점유율이 높아 현금을 잘 버는 캐시카우(돈줄), 시장은 크는데 점유율이 낮은 물음표(투자할지 접을지 결정), 둘 다 낮은 개(정리 후보).
    캐시카우에서 번 돈으로 스타와 유망한 물음표를 키우는 게 기본 흐름이다. 사업 매각·분할·철수 공시를 보면 '이 사업은 네 칸 중 어디였을까'부터 생각해 보자.
  deep:
    - "사업 매각 공시는 대개 '개'나 가망 없는 '물음표'의 정리, 또는 캐시카우를 팔아 신사업 자금을 마련하는 경우다."
    - "한계: 점유율과 수익성이 늘 비례하지 않고 사업 간 시너지를 무시한다. 산업 매력도와 사업 경쟁력으로 보는 GE-맥킨지 매트릭스 같은 변형도 있다."
  how_to:
    - "회사의 사업부문별 매출·영업이익(사업보고서 부문 정보)을 찾는다."
    - "각 부문 시장의 성장률과 회사 점유율을 대략 매겨 네 칸에 놓는다."
    - "오늘 사례(매각·투자·철수)가 그 배치와 맞는 결정인지 본다."
  example: "성숙한 내수 사업에서 번 현금으로 해외 사업이나 신사업에 투자하는 국내 기업이 많다. 비핵심 사업 매각으로 마련한 돈을 주력 사업에 다시 넣는 '선택과 집중' 발표도 같은 논리다."
  pitfalls:
    - "'개' 사업이라도 다른 사업과 고객·원가를 공유하면 정리하는 순간 다른 사업이 손해를 볼 수 있다."
  related: [ansoff_diversification, conglomerate_discount, diffusion_chasm]
  keywords: [캐시카우, 선택과 집중, 사업부문 정보]
  quiz:
    - q: "시장 성장률은 낮지만 점유율이 높아 현금을 많이 버는 사업은?"
      choices: ["스타", "캐시카우", "물음표", "개"]
      answer: 1
      explain: "추가 투자 부담이 적고 현금이 많이 남아 다른 사업의 돈줄 역할을 한다."

- id: ma_synergy
  title: M&A 시너지와 승자의 저주
  field: 경영전략
  one_line: "인수가 성공하려면 합쳐서 생기는 추가 가치(시너지)가 더 얹어 준 값(프리미엄)보다 커야 한다."
  easy: |
    두 회사를 합쳤을 때 각자 따로일 때보다 커지는 가치가 시너지다. 매출이 늘거나(교차판매, 시장 확대) 비용이 줄어(중복 인력·설비 정리, 구매력 강화) 생긴다. 그런데 인수자는 경쟁 입찰에서 이기려고 시장가격보다 비싸게, 즉 경영권 프리미엄을 얹어 사는 경우가 많다.
    시너지보다 프리미엄이 크면 인수자 주주는 손해를 보고 이득은 파는 쪽 주주에게 간다. 경매에서 가장 높게 부른 사람이 이겼지만 비싸게 산 상황을 승자의 저주라고 한다.
  deep:
    - "인수자 주주의 이익 = 시너지 − 프리미엄 − 거래·통합 비용."
    - "비용 시너지가 매출 시너지보다 실현될 가능성이 높다고 본다."
    - "오만 가설: 경영자가 자기 능력을 과신해 너무 비싸게 산다."
    - "여러 실증 연구에서 인수 발표 때 피인수회사 주가는 크게 오르고 인수회사 주가는 평균적으로 변화가 작거나 떨어지는 경향이 보고됐다."
    - "인수 후 통합(PMI) 실패가 시너지가 안 나는 주된 이유다."
  how_to:
    - "거래 금액을 대상 회사의 이익·순자산과 비교해 프리미엄 크기를 가늠한다(PER, PBR)."
    - "회사가 말하는 시너지가 비용 쪽인지 매출 쪽인지, 숫자가 제시됐는지 본다."
    - "자금 조달 방법(보유 현금·차입·주식)과 인수 후 부채비율 변화를 확인한다."
    - "1~2년 뒤 영업권 손상 여부로 사후 평가한다."
  example: "고가 인수 뒤 몇 년 지나 영업권 손상이 대규모로 잡히는 사례가 여러 업종에서 반복된다. 회계·세무 카드의 '영업권 손상검사'와 같이 보면 좋다."
  pitfalls:
    - "인수 발표 직후 주가 반응만으로 성패를 단정하기 어렵다. 통합 결과는 몇 년에 걸쳐 나타난다."
  related: [scale_scope_learning, valuation, agency_theory, ansoff_diversification]
  keywords: [경영권 프리미엄, 오만가설, PMI, 영업권 손상]
  quiz:
    - q: "인수자 주주에게 이익이 되는 조건은?"
      choices: ["시너지가 지급 프리미엄과 거래비용보다 클 때", "인수 대상의 매출이 클 때", "인수 금액이 클 때", "현금으로 인수할 때"]
      answer: 0
      explain: "얹어 준 값보다 더 많은 가치를 만들어야 인수자 주주에게 남는 게 있다."

- id: conglomerate_discount
  title: 복합기업 할인과 분할의 논리
  field: 경영전략
  one_line: "여러 사업을 한 회사에 묶어 두면 사업별 가치의 합보다 낮게 평가받는 경향이 있고, 분할은 이 할인을 풀려는 시도다."
  easy: |
    반도체 사업과 식품 사업을 한 회사가 같이 하면 투자자는 둘을 따로 평가하기 어렵고, 좋은 사업이 번 돈을 나쁜 사업에 쓰지 않을까 걱정한다. 그래서 회사 전체 시가총액이 사업별 적정가치를 더한 값보다 낮게 나오는 일이 많다. 이를 복합기업 할인이라고 한다.
    지주회사가 보유한 자회사 지분 가치보다 싸게 거래되는 지주사 할인도 같은 원리다. 사업을 떼어 내 따로 평가받게 하면 할인이 줄 수 있다는 것이 분할·분사의 논리다.
  deep:
    - "SOTP(사업부별 가치 합산): 사업마다 맞는 배수(PER, EV/EBITDA)를 적용해 더한 값과 시가총액을 비교한다."
    - "할인의 원인: 정보 불투명성, 잘 버는 사업이 못 버는 사업을 먹여 살리는 내부 보조, 대리인 문제."
    - "한국적 쟁점: 자회사를 다시 상장시키는 중복상장은 같은 이익을 모회사와 자회사에서 두 번 세는 셈이라 모회사 할인을 키운다는 비판이 있다."
  how_to:
    - "회사의 사업부문을 나누고 부문별 이익에 비교기업 배수를 곱해 대략의 SOTP를 만든다."
    - "SOTP와 시가총액의 차이(할인율)를 계산한다."
    - "분할·분사 후 그 할인이 줄어들 근거(투명성, 독립 경영, 자금 조달)가 있는지 본다."
  example: "물적분할 뒤 알짜 사업을 자회사로 상장하면 모회사 주가가 약해지는 일이 잦아 2022년 이후 반대주주 주식매수청구권 같은 보호장치가 생겼다."
  pitfalls:
    - "분할하면 무조건 가치가 오르지 않는다. 공통비용이 늘고 규모의 경제가 사라질 수 있다."
  related: [agency_theory, valuation, bcg_portfolio, org_structure]
  keywords: [SOTP, 지주사 할인, 중복상장]
  quiz:
    - q: "사업부별 가치를 각각 평가해 합산하는 방법은?"
      choices: ["DCF", "SOTP", "EOQ", "HHI"]
      answer: 1
      explain: "Sum of the Parts. 분할·지주사 분석에서 가장 많이 쓴다."
