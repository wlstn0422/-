# 마케팅 이론 카드

- id: stp
  title: STP(시장 세분화·표적시장·포지셔닝)
  field: 마케팅
  one_line: "시장을 세분화(Segmentation)하고, 표적시장을 선정(Targeting)하며, 고객 인식 속의 위치를 정하는(Positioning) 마케팅 전략의 기본 절차이다."
  easy: |
    모든 사람에게 다 팔려는 제품은 결국 누구에게도 매력이 없다. 그래서 먼저 고객을 비슷한 필요끼리 묶는다. 나이·소득 같은 인구통계, 라이프스타일, 구매 동기, 사용 빈도 같은 기준을 쓴다. 그중 회사가 잘 맞출 수 있고 돈이 되는 집단을 고르고, 그 고객에게 '우리는 ○○한 브랜드'라는 한 문장을 심는다.
    신제품 출시, 리브랜딩, 광고 모델 교체 기사는 대부분 STP를 새로 짜거나 강화하는 시도다. 기사를 읽을 때 '누구를 노리고, 어떤 자리를 차지하려는가'를 한 줄로 적어 보면 핵심이 보인다.
  deep:
    - "좋은 세분시장의 조건: 측정할 수 있고, 충분히 크고, 접근할 수 있고, 다른 집단과 반응이 다르다."
    - "포지셔닝 맵: 가격과 품질, 기능과 감성 같은 두 축에 경쟁 브랜드를 놓고 비어 있는 자리를 찾는다."
    - "리포지셔닝: 이미지가 낡았거나 핵심 고객이 나이 들었을 때 자리를 다시 잡는 것. 리브랜딩이 대표적이다."
  how_to:
    - "오늘 사례가 노리는 고객층을 한 줄로 적는다."
    - "경쟁 브랜드를 포지셔닝 맵 두 축에 놓고 이 회사가 어디로 움직이는지 본다."
    - "새 타깃을 잡으면서 기존 고객이 떠날 위험은 없는지 생각한다."
  example: "같은 회사가 가격대가 다른 여러 브랜드를 따로 운영하는 멀티브랜드 전략은 세분시장마다 다른 포지셔닝을 하려는 것이다. 자동차 회사의 고급 브랜드 분리가 대표적이다."
  pitfalls:
    - "새 타깃을 노리다 기존 핵심 고객이 떠나는 경우가 있다."
  related: [marketing_mix, brand_equity, pricing_strategy]
  keywords: [세분화 기준, 포지셔닝 맵, 리브랜딩]
  quiz:
    - q: "STP 중 '고객 머릿속에 어떤 자리를 차지할지' 정하는 단계는?"
      choices: ["세분화", "표적시장 선정", "포지셔닝", "유통"]
      answer: 2
      explain: "포지셔닝은 경쟁 브랜드와 비교해 고객이 우리를 어떻게 기억하게 할지 정하는 단계다."

- id: marketing_mix
  title: 4P(마케팅 믹스)와 7P
  field: 마케팅
  one_line: "제품(Product), 가격(Price), 유통(Place), 촉진(Promotion)의 네 가지 마케팅 수단을 표적시장에 맞게 조합하는 실행 도구이다."
  easy: |
    STP로 '누구에게 어떤 브랜드로' 다가갈지 정했다면, 4P는 '어떻게'다. 무엇을 만들고, 얼마에 팔고, 어디서 팔고, 어떻게 알릴지를 정한다. 네 가지가 서로 어긋나면 효과가 반감된다. 고급 브랜드인데 할인 행사를 남발하거나, 젊은 층이 타깃인데 오프라인 대형마트에서만 판다면 앞뒤가 맞지 않는다.
    서비스업에서는 사람(People), 과정(Process), 물리적 환경(Physical evidence)을 더해 7P로 본다. 같은 커피라도 매장 분위기와 직원 응대가 상품의 일부이기 때문이다.
  deep:
    - "제품: 품질, 기능, 디자인, 포장, 브랜드, 제품 라인 구성."
    - "가격: 원가·경쟁·고객 가치 중 무엇을 기준으로 정하는지(가격 전략 카드)."
    - "유통: 직영·대리점·온라인, 채널 간 갈등, 직접 판매(D2C)."
    - "촉진: 광고, 판촉, 홍보, 인플루언서·콘텐츠 마케팅과 그 효과 지표(광고비 대비 매출, ROAS)."
  how_to:
    - "오늘 사례가 4P 중 무엇을 바꿨는지 표시한다."
    - "바뀐 하나가 나머지 셋과 어울리는지 본다."
    - "회사 입장의 4P를 고객 입장(고객가치, 비용, 편의, 소통)으로 뒤집어 다시 읽는다."
  example: "편의점 협업 한정판은 제품(한정판), 유통(편의점 채널), 촉진(화제성)을 묶은 4P 조합이다."
  pitfalls:
    - "광고(촉진)만 바꾸고 제품·가격·유통이 그대로면 효과가 짧게 끝나기 쉽다."
  related: [stp, pricing_strategy, brand_equity, clv_cac]
  keywords: [4C, D2C, ROAS, 채널 갈등]
  quiz:
    - q: "서비스 마케팅에서 4P에 더해지는 3P가 아닌 것은?"
      choices: ["사람", "과정", "물리적 환경", "생산성"]
      answer: 3
      explain: "7P는 4P에 사람(People), 과정(Process), 물리적 환경(Physical evidence)을 더한 것이다."

- id: brand_equity
  title: 브랜드 자산
  field: 마케팅
  one_line: "브랜드로 인해 동일한 제품이 더 높은 가격과 더 많은 판매량을 얻게 되는 부가가치로, 브랜드 인지도와 브랜드 연상으로 구성된다."
  easy: |
    상표를 가린 시음에서는 비슷하다던 음료를, 상표를 보여주면 특정 브랜드가 더 맛있다고 답하는 경우가 많다. 이 차이가 브랜드 자산이다. 켈러의 고객 기반 브랜드 자산 모형에 따르면 사람들이 브랜드를 알고(인지도), 좋은 이미지를 떠올리고(연상), 좋게 평가하고 느끼며(판단·감정), 계속 찾는 관계(충성도)로 차례차례 쌓인다.
    재미있는 점은 회사가 스스로 키운 브랜드는 재무상태표에 자산으로 잡히지 않는다는 것이다. 다른 회사를 인수할 때에야 상표권·영업권 같은 큰 금액으로 드러난다.
  deep:
    - "브랜드 자산이 크면 가격 프리미엄, 유통 협상력, 신제품 성공률이 올라간다."
    - "브랜드 확장의 위험: 본래 이미지와 안 맞는 분야로 가면 기존 브랜드까지 흐려진다."
    - "측정: 인지도·선호도 조사, 가격 프리미엄, 외부 브랜드 가치 평가."
  how_to:
    - "오늘 사례(모델 교체, 리브랜딩, 협업)가 인지도와 연상 중 무엇을 바꾸려는지 본다."
    - "그 연상이 회사의 포지셔닝과 맞는지 확인한다."
    - "가격 인상을 했다면 고객이 따라오는지(브랜드 힘)로 브랜드 자산을 가늠한다."
  example: "광고 모델 교체, 로고 변경, 협업 한정판은 브랜드 연상을 바꾸거나 강화하려는 시도다. 식품·화장품 회사가 원가가 올라도 가격을 올릴 수 있는지는 상당 부분 브랜드 자산에 달려 있다."
  pitfalls:
    - "광고 노출만 늘고 떠오르는 이미지가 흐릿하면 브랜드 자산은 잘 쌓이지 않는다."
  related: [stp, marketing_mix, pricing_strategy, rbv_vrio]
  keywords: [CBBE 모형, 브랜드 확장, 가격 프리미엄]
  quiz:
    - q: "회사가 스스로 키운 브랜드는 재무상태표에 무형자산으로 인식할 수 있을까?"
      choices: ["항상 인식한다", "인식할 수 없다", "광고비만큼 인식한다", "감정평가액으로 인식한다"]
      answer: 1
      explain: "내부적으로 창출한 브랜드는 무형자산으로 인식하지 않는다(K-IFRS 1038). 인수할 때만 공정가치로 잡힌다."

- id: pricing_strategy
  title: 가격 전략과 가격차별
  field: 마케팅
  one_line: "가격을 원가에 이윤을 더한 값이 아니라 고객이 인식하는 가치와 경쟁 상황을 반영하여 이익을 극대화하도록 결정하는 전략이다."
  easy: |
    가격을 정하는 방법은 크게 셋이다. 원가에 일정 이윤을 붙이는 원가 기준, 경쟁사 가격에 맞추는 경쟁 기준, 고객이 얼마까지 낼 의향이 있는지에서 출발하는 가치 기준. 신제품은 처음에 비싸게 받고 점점 내리는 스키밍이나, 처음부터 싸게 해서 점유율을 잡는 침투가격을 쓴다.
    같은 상품을 사람·시간·수량에 따라 다르게 받는 가격차별(조조할인, 학생할인, 항공권 시기별 가격, 요금제 차등)은 각 고객이 낼 수 있는 만큼 받아 이익을 키우는 방법이다. 가격 인상 기사를 보면 '이 회사는 무엇을 기준으로 가격을 정하나'와 '고객이 떠날까'를 같이 생각하자.
  deep:
    - "가격 인상이 매출을 늘릴지 줄일지는 가격탄력성에 달려 있다(가격탄력성 카드)."
    - "가격차별 3종: 1급(사람마다 최대 지불의사만큼), 2급(수량·버전별, 요금제), 3급(집단별, 학생·노인 할인)."
    - "번들링(묶음 판매), 버전 차등(기본·프리미엄), 미끼 상품."
    - "심리적 가격: 9,900원 같은 끝자리 가격, 정가 대비 할인 표시(앵커링), 가격 대신 용량을 줄이는 슈링크플레이션."
  how_to:
    - "가격 변동 폭과 함께 판매량 변화가 나와 있는지 찾는다."
    - "경쟁사가 따라올지(과점이면 게임이론), 고객이 대체재로 옮길지 본다."
    - "공헌이익률로 손익을 계산한다. 가격을 10% 내리면 같은 이익을 내기 위해 판매량이 얼마나 늘어야 하는가."
  example: "동영상 구독 서비스가 광고를 보는 대신 싼 요금제를 추가하는 것은 지불의사가 낮은 고객을 따로 받아내는 2급 가격차별이다."
  pitfalls:
    - "가격 인하로 매출이 늘어도 이익이 늘었다는 뜻은 아니다. 공헌이익률이 낮으면 판매량이 크게 늘어야 본전이다."
  related: [elasticity, behavioral_econ, marketing_mix, network_platform]
  keywords: [스키밍, 침투가격, 가격차별, 슈링크플레이션]
  quiz:
    - q: "공헌이익률 40%인 제품의 가격을 10% 내리면 같은 공헌이익을 내기 위해 판매량은 약 몇 % 늘어야 할까?"
      choices: ["10%", "25%", "33%", "50%"]
      answer: 2
      explain: "가격 100, 변동비 60이면 단위 공헌이익 40. 가격 90이면 30. 40 ÷ 30 = 1.33, 약 33% 더 팔아야 한다."

- id: clv_cac
  title: 고객 생애가치(LTV)·고객획득비용(CAC)·락인
  field: 마케팅
  one_line: "고객 한 명을 획득하는 데 드는 비용(CAC)과 그 고객이 거래 기간 동안 창출하는 이익(LTV)을 비교하여 고객 확보 활동의 수익성을 판단하는 지표 체계이다."
  easy: |
    앱 가입자를 늘리려고 쿠폰과 광고에 1인당 3만원을 썼는데, 그 고객이 평균 1년 쓰다 떠나며 남기는 이익이 2만원이면 고객이 늘수록 손해다. 그래서 구독·플랫폼 사업은 LTV를 CAC로 나눈 비율과 이탈률을 핵심 지표로 본다. 업계에서는 이 비율이 3배 이상이면 건강하다고 보는 경우가 많다.
    고객이 다른 서비스로 옮기기 귀찮게 만드는 전환비용(포인트, 약정, 쌓인 데이터, 기기 생태계)은 이탈률을 낮춰 LTV를 키운다. 이를 락인 효과라고 한다.
  deep:
    - "LTV ≈ 고객당 월 공헌이익 × 평균 유지 기간(= 1 ÷ 월 이탈률). 미래 이익을 할인해 계산하기도 한다."
    - "CAC = 마케팅·판촉비 ÷ 새로 얻은 고객 수."
    - "퍼널: 인지 → 관심 → 가입 → 결제 → 재구매·추천. 단계별 전환율이 어디서 새는지 본다."
    - "회수 기간: CAC를 고객 월 이익으로 나눈 값. 짧을수록 현금이 빨리 돌아온다."
  how_to:
    - "오늘 사례(멤버십 가격 인상, 대규모 프로모션)가 LTV와 CAC 중 무엇을 바꾸는지 본다."
    - "가입자 수, 이탈률, 고객당 매출(ARPU) 숫자를 찾는다."
    - "할인으로 데려온 고객이 할인 뒤에도 남을지 생각한다."
  example: "유료 멤버십 가격을 올리는 기업은 '이탈률이 얼마나 오를까'와 '남은 고객의 객단가가 얼마나 늘까'를 저울질한다. 통신사의 약정·결합할인도 이탈을 막는 락인 장치다."
  pitfalls:
    - "할인으로 데려온 고객은 할인이 끝나면 떠나기 쉬워, 첫 달 가입자 수만 보고 판단하면 안 된다."
  related: [network_platform, pricing_strategy, behavioral_econ, marketing_mix]
  keywords: [이탈률, ARPU, 퍼널, 전환비용]
  quiz:
    - q: "월 이탈률이 5%면 고객의 평균 유지 기간은 대략 얼마일까?"
      choices: ["5개월", "10개월", "20개월", "50개월"]
      answer: 2
      explain: "평균 유지 기간 ≈ 1 ÷ 월 이탈률 = 1 ÷ 0.05 = 20개월."

- id: diffusion_chasm
  title: 혁신 확산·캐즘·제품수명주기
  field: 마케팅
  one_line: "신제품이 혁신 수용자, 조기 수용자, 다수 수용자, 지각 수용자의 순으로 확산되며, 초기 시장과 주류 시장 사이에 넘기 어려운 간극(캐즘)이 존재한다는 이론이다."
  easy: |
    로저스의 혁신 확산 이론에 따르면 신기술은 혁신가(2.5%), 조기 수용자(13.5%), 조기 다수(34%), 후기 다수(34%), 지각 수용자(16%) 순서로 퍼진다. 무어는 새것을 좋아하는 초기 고객과 실용성을 따지는 주류 고객 사이에 큰 간극이 있어 많은 제품이 여기서 멈춘다고 보고 이를 캐즘이라 불렀다.
    제품수명주기(도입기 → 성장기 → 성숙기 → 쇠퇴기)와 함께 보면 지금 이 시장이 어디쯤인지 판단할 수 있다. 단계마다 회사가 써야 할 전략과 재무 숫자의 모양이 다르다.
  deep:
