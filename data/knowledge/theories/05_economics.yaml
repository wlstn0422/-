# 경제학 이론 카드(미시·거시·행동경제)

- id: elasticity
  title: 수요·공급과 가격탄력성
  field: 미시경제
  one_line: "가격 변화율에 대한 수요량 변화율(가격탄력성)을 통해 가격 변화가 매출에 미치는 영향을 분석하는 개념이다."
  easy: |
    가격을 올리면 보통 덜 팔린다. 문제는 '얼마나' 덜 팔리느냐다. 가격이 10% 오를 때 판매량이 5%만 줄면 매출은 오히려 늘고(비탄력적), 20% 줄면 매출이 준다(탄력적). 담배나 전기처럼 꼭 필요하거나 대체재가 없으면 비탄력적이고, 대체재가 많거나 지출 비중이 큰 상품은 탄력적이다.
    시장 가격은 수요와 공급이 만나는 곳에서 정해진다. 원자재 가격이 오르면 공급곡선이 왼쪽으로 이동해 가격이 오르고, 인기 상품이 되면 수요곡선이 오른쪽으로 이동해 가격이 오른다. 기업의 가격 인상, 정부의 세금 부과 효과를 볼 때 늘 쓰는 기본 도구다.
  deep:
    - "가격탄력성 = 수요량 변화율 ÷ 가격 변화율(절댓값). 1보다 크면 탄력적, 작으면 비탄력적."
    - "탄력적이면 가격을 내릴 때 매출이 늘고, 비탄력적이면 가격을 올릴 때 매출이 는다."
    - "교차탄력성: 대체재는 플러스(커피값이 오르면 차 수요 증가), 보완재는 마이너스(프린터와 잉크)."
    - "소득탄력성: 소득이 늘 때 더 사는 정상재, 덜 사는 열등재."
    - "조세 귀착: 세금 부담은 덜 탄력적인 쪽(쉽게 피하지 못하는 쪽)이 더 많이 진다."
  how_to:
    - "오늘 사례의 상품이 필수재인지, 대체재가 많은지부터 판단한다."
    - "가격 변화율과 판매량 변화율이 나와 있으면 탄력성을 직접 계산한다."
    - "단기와 장기 반응이 다를지(시간이 지나면 대체재를 찾는다) 생각한다."
  example: "2015년 담뱃값이 2,500원에서 4,500원으로 오른 뒤 판매량은 줄었지만 줄어든 비율이 가격 인상률보다 훨씬 작아 담배 관련 세수는 크게 늘었다. 담배 수요가 비탄력적이라는 뜻이다."
  pitfalls:
    - "단기 탄력성과 장기 탄력성은 다르다. 시간이 지나면 대체재를 찾아 수요가 더 많이 줄어든다."
  related: [pricing_strategy, market_structure, trade_tariff, behavioral_econ]
  keywords: [수요곡선 이동, 교차탄력성, 조세 귀착]
  quiz:
    - q: "가격을 10% 올렸더니 판매량이 4% 줄었다. 매출은 어떻게 될까?"
      choices: ["늘었다", "줄었다", "그대로다", "알 수 없다"]
      answer: 0
      explain: "탄력성 0.4로 비탄력적이다. 매출 ≈ 1.10 × 0.96 = 1.056, 약 5.6% 증가."

- id: market_structure
  title: 시장구조와 진입장벽
  field: 미시경제
  one_line: "시장 참여 기업의 수와 제품의 동질성에 따라 시장을 완전경쟁, 독점적 경쟁, 과점, 독점으로 구분하고 각 구조에서 가격과 이윤이 결정되는 원리를 설명한다."
  easy: |
    판매자가 아주 많고 상품이 똑같으면(완전경쟁) 누구도 가격을 마음대로 정하지 못하고 장기적으로 초과이익이 사라진다. 판매자가 하나뿐이면(독점) 가격을 높게 받을 수 있지만 사회 전체로는 거래가 줄어드는 손실이 생긴다.
    현실의 많은 산업은 소수 기업이 서로 눈치를 보는 과점(통신, 정유, 항공, 메모리 반도체)이거나, 많은 기업이 조금씩 다른 상품을 파는 독점적 경쟁(식당, 화장품)이다. 진입장벽이 높을수록 과점·독점이 오래 유지된다.
  deep:
    - "시장집중도: 상위 3사 점유율(CR3), 허핀달-허쉬만 지수(HHI = 점유율 제곱의 합). 공정위 기업결합 심사에도 쓰인다."
    - "진입장벽: 규모의 경제, 규제·면허, 특허, 네트워크 효과, 브랜드, 유통망."
    - "과점의 행동: 가격 경쟁을 피하고 광고·서비스 같은 비가격 경쟁에 집중하거나 담합 유혹이 생긴다(게임이론 카드)."
    - "독점 규제: 시장지배적 지위 남용 금지, 기업결합 심사."
  how_to:
    - "오늘 사례의 산업에 주요 경쟁자가 몇 곳인지, 점유율이 어떤지 적는다."
    - "HHI를 대략 계산해 집중도를 본다."
    - "진입장벽이 무엇이고 오늘 사례가 그 장벽을 높이는지 낮추는지 본다."
  example: "이동통신 시장은 3사 과점이라 요금이 비슷하게 움직이고, 정부는 알뜰폰 활성화 같은 방식으로 경쟁을 늘리려 해 왔다."
  pitfalls:
    - "점유율이 높다고 늘 독점 이윤을 누리는 건 아니다. 진입이 쉬우면 높은 가격이 오래가지 못한다(경합시장 이론)."
  related: [five_forces, game_theory, network_platform, scale_scope_learning]
  keywords: [과점, HHI, 진입장벽, 경합시장]
  quiz:
    - q: "점유율이 각각 50%, 30%, 20%인 시장의 HHI는?"
      choices: ["1,000", "2,500", "3,800", "10,000"]
      answer: 2
      explain: "50² + 30² + 20² = 2,500 + 900 + 400 = 3,800."

- id: game_theory
  title: 게임이론(죄수의 딜레마·내쉬균형·치킨게임)
  field: 미시경제
  one_line: "경제주체의 결과가 상대방의 선택에 의존하는 상황에서 상호 반응을 예상하여 최적의 전략을 찾는 분석 방법이다."
  easy: |
    두 회사가 가격을 정한다. 둘 다 높게 받으면 둘 다 좋지만, 나만 내리면 손님을 다 뺏어 더 좋고, 나만 높게 받으면 손님을 잃는다. 그래서 결국 둘 다 내려 둘 다 손해를 보는 결과로 간다. 이것이 죄수의 딜레마다.
    상대의 전략이 정해져 있다고 볼 때 누구도 혼자 전략을 바꿀 이유가 없는 상태를 내쉬균형이라고 한다. 담합이 생기는 이유(협조하면 둘 다 이득)와 담합이 잘 깨지는 이유(배신하면 혼자 더 이득)가 모두 이 틀로 설명된다.
  deep:
    - "반복게임: 게임이 계속 반복되면 '배신하면 다음에 보복'이 가능해 협조가 유지되기도 한다(맞대응 전략)."
    - "치킨게임: 서로 물러서지 않으면 둘 다 큰 손해, 먼저 물러서는 쪽이 진다. 과거 메모리 반도체의 공격적 증설 경쟁이 자주 예로 든다."
    - "신빙성 있는 위협과 선점: 대규모 투자를 먼저 발표해 경쟁자의 진입을 막는다."
    - "리니언시(자진신고 감면): 담합 참여자가 먼저 자백하면 과징금을 깎아 줘 일부러 죄수의 딜레마를 만들어 담합을 깨뜨린다."
  how_to:
    - "오늘 사례의 '선수'(경쟁사, 노사, 국가)가 누구인지 적는다."
    - "각자의 선택지와 결과를 2×2 표로 그려 본다."
    - "한 번으로 끝나는 게임인지 반복되는 게임인지, 누가 먼저 움직이는지 본다."
  example: "공정위 담합 적발 기사에는 리니언시 자진신고가 계기였다는 내용이 자주 나온다. 담합 참여자들이 서로를 믿지 못하게 만드는 게임이론의 응용이다."
  pitfalls:
    - "현실의 기업은 완벽히 합리적이지 않고 정보도 불완전해 이론 예측이 그대로 맞지 않을 수 있다."
  related: [market_structure, restructuring_labor, trade_tariff]
  keywords: [내쉬균형, 반복게임, 리니언시, 선점]
  quiz:
    - q: "담합 참여자가 먼저 자진신고하면 과징금을 감면해 주는 제도는?"
      choices: ["리니언시", "리픽싱", "스튜어드십", "그린워싱"]
      answer: 0
      explain: "먼저 자백하는 쪽이 유리하게 만들어 담합의 신뢰를 깨뜨린다."

- id: externality_esg
  title: 외부효과와 ESG
  field: 미시경제
  one_line: "거래 당사자가 아닌 제3자에게 비용이나 편익이 전가되는 외부효과와, 이를 기업 경영과 투자 판단에 반영하려는 ESG의 경제학적 근거를 설명한다."
  easy: |
    공장이 오염물질을 내보내면 그 피해는 주민이 지지만 공장 원가에는 들어가지 않는다. 그러면 사회적으로 적정한 양보다 더 많이 생산된다(부정적 외부효과). 해법은 피해만큼 비용을 물리는 것이다. 피구세라 불리는 탄소세나 배출권거래제가 대표적이다.
    반대로 백신·연구개발처럼 남에게도 이익을 주는 활동은 시장에 맡기면 너무 적게 이뤄져 보조금이 정당화된다. ESG(환경·사회·지배구조)는 이런 외부효과와 장기 위험을 투자자가 기업 가치에 반영하려는 흐름이다.
  deep:
    - "코즈 정리: 재산권이 분명하고 거래비용이 낮으면 당사자끼리 협상해서도 외부효과를 해결할 수 있다."
    - "배출권거래제: 전체 배출 총량을 정하고 배출권을 사고팔게 해 줄이기 쉬운 곳부터 줄이게 만든다. 한국은 2015년에 시작했다."
    - "이해관계자 이론: 기업은 주주뿐 아니라 직원·고객·지역사회를 고려해야 장기 가치가 커진다는 관점(주주 중심 관점과 논쟁)."
    - "기후 관련 공시를 의무화하는 논의가 국내외에서 단계적으로 진행되고 있다."
  how_to:
    - "오늘 사례에서 비용이나 혜택이 제3자에게 넘어가는 부분이 있는지 찾는다."
    - "규제(탄소 가격, 환경 기준)가 회사 원가에 얼마나 영향을 주는지 어림한다."
    - "ESG 발표가 실제 투자와 숫자로 뒷받침되는지 본다."
  example: "철강·정유·화학처럼 탄소 배출이 많은 업종은 배출권 가격과 탄소 규제가 원가에 직접 영향을 준다."
  pitfalls:
    - "ESG 홍보와 실제 투자·성과가 다른 그린워싱을 구분해야 한다."
  related: [elasticity, business_cycle, agency_theory]
  keywords: [피구세, 배출권거래제, 코즈정리, 그린워싱]
  quiz:
    - q: "오염 피해만큼 세금을 매겨 외부효과를 바로잡는 세금을 뭐라고 할까?"
      choices: ["피구세", "토빈세", "관세", "누진세"]
      answer: 0
      explain: "경제학자 피구의 이름을 땄다. 탄소세가 대표적이다."

- id: monetary_policy
  title: 기준금리와 통화정책 전달 경로
  field: 거시경제
  one_line: "중앙은행의 기준금리 변경이 시장금리, 대출, 환율, 자산가격을 거쳐 소비·투자·물가에 파급되는 경로를 설명하는 이론이다."
  easy: |
    기준금리는 한국은행이 금융기관과 거래할 때 기준이 되는 정책 금리다. 이걸 올리면 은행 예금·대출 금리가 따라 오르고, 빚 부담이 커진 가계와 기업은 소비와 투자를 줄인다. 그러면 경기가 식고 물가 상승이 진정된다. 동시에 원화 자산의 금리가 높아져 원화 가치가 오르는(환율이 내려가는) 압력도 생긴다.
    반대로 금리를 내리면 경기를 띄우지만 물가와 집값이 오를 위험이 있다. 이 연결 고리를 통화정책 전달 경로라고 한다. 금리 뉴스를 보면 '이 회사는 이 경로의 어디에 걸려 있나'를 생각하자.
  deep:
    - "전달 경로: 금리 경로(대출·저축), 자산가격 경로(주식·부동산), 환율 경로, 신용 경로, 기대 경로."
    - "테일러 준칙: 물가가 목표(한국은 2%)보다 높거나 경기가 과열이면 금리를 올려야 한다는 기준."
    - "한미 금리차: 미국 금리가 더 높으면 자본이 빠져나가 원화 약세 압력이 생긴다."
    - "기업 영향: 변동금리 차입이 많은 회사, 부동산·건설, 미래 이익 비중이 큰 성장주가 금리에 민감하다. 은행은 예대마진이 커질 수 있다."
  how_to:
    - "오늘 사례 회사의 차입금 규모와 변동금리 비중을 본다."
    - "금리 1%p 변화가 이자비용을 얼마나 바꾸는지 어림한다(차입금 × 1%)."
    - "수요가 금리에 민감한 업종(주택, 자동차 할부, 내구재)인지 판단한다."
  example: "기준금리 결정이 있는 날 은행주, 건설주, 성장주의 주가 반응이 서로 다르게 나타나는 걸 비교해 보면 전달 경로가 보인다."
  pitfalls:
    - "금리 효과는 시차(보통 수개월에서 1년 넘게)를 두고 나타난다."
  related: [exchange_rate, business_cycle, capital_structure, valuation]
  keywords: [기준금리, 전달경로, 테일러준칙, 한미금리차]
  quiz:
    - q: "기준금리를 올렸을 때 일반적으로 기대되는 효과가 아닌 것은?"
      choices: ["대출 감소", "물가 상승 압력 완화", "원화 약세 압력", "성장주 가치 하락 압력"]
      answer: 2
      explain: "금리 인상은 원화 자산의 매력을 높여 원화 강세(환율 하락) 쪽 압력을 준다."

- id: exchange_rate
  title: 환율의 결정과 기업 영향
  field: 거시경제
  one_line: "환율은 두 나라 통화의 교환 비율로, 금리 차이·경상수지·위험 선호에 따라 결정되며 수출입 기업의 이익에 큰 영향을 미친다."
  easy: |
    원/달러 환율이 1,300원에서 1,400원으로 오르면 1달러를 사는 데 원화가 더 든다. 원화 가치가 떨어진 것(원화 약세)이다. 그러면 달러로 파는 수출기업은 같은 물건을 팔아도 원화 매출이 늘고, 달러로 원재료를 사는 수입기업이나 항공사는 비용이 는다.
    환율은 금리가 높은 나라로 돈이 몰리는 힘(금리차), 수출이 수입보다 많아 달러가 들어오는 힘(경상수지), 세계가 불안할 때 안전자산인 달러로 몰리는 힘(위험회피)이 합쳐져 정해진다.
  deep:
    - "구매력평가설: 장기적으로 환율은 두 나라 물가 수준의 차이를 반영한다(빅맥지수)."
    - "기업 영향 분석: 외화 매출 비중, 외화 원가 비중, 외화 부채(환산손익), 해외 자회사(환산차이는 기타포괄손익)."
    - "헤지 수단: 선물환, 통화스와프, 자연헤지(외화 매출과 외화 비용 맞추기)."
  how_to:
    - "오늘 사례 회사의 수출 비중과 원재료 수입 비중을 찾는다."
    - "사업보고서 주석의 '환율 변동 민감도'로 환율 10% 변화의 이익 영향을 확인한다."
    - "외화 부채가 많으면 환산손실이 순이익을 흔들 수 있다는 점을 본다."
  example: "원화 약세 국면에서는 자동차·조선처럼 수출 비중이 큰 업종에 유리하고, 항공·정유처럼 달러 비용이 큰 업종은 부담이 커진다는 분석이 반복된다."
  pitfalls:
    - "환율 효과는 회사마다 원가 구조와 헤지에 따라 다르다. 업종 일반론으로 단정하지 말 것."
  related: [monetary_policy, trade_tariff, business_cycle]
  keywords: [원화약세, 구매력평가, 환헤지, 환산손익]
  quiz:
    - q: "원/달러 환율이 오르면(원화 약세) 일반적으로 유리한 쪽은?"
      choices: ["달러 매출 비중이 큰 수출기업", "달러 원재료 비중이 큰 수입기업", "달러 부채가 많은 기업", "해외여행객"]
      answer: 0
      explain: "같은 달러 매출이 더 많은 원화로 바뀐다."

- id: business_cycle
  title: 경기순환·물가와 재정정책
  field: 거시경제
  one_line: "경제가 확장과 수축을 반복하는 경기순환과, 물가·고용·재정정책이 그 흐름에 미치는 영향을 설명하는 이론이다."
  easy: |
    경기는 회복 → 호황 → 후퇴 → 불황을 오간다. 호황에는 소비와 투자가 늘고 물가가 오르며, 불황에는 반대가 된다. 물가 상승은 수요가 넘쳐서(수요견인) 생기기도 하고, 원자재·임금 같은 비용이 올라서(비용인상) 생기기도 한다.
    정부는 불황에 지출을 늘리거나 세금을 줄여 수요를 받치고(확장 재정), 과열 때는 반대로 한다. 정부가 1조원을 더 쓰면 그 돈이 누군가의 소득이 되고 다시 소비로 이어져 경제 전체에 1조원보다 큰 효과를 낸다는 게 승수효과다.
  deep:
    - "주요 지표: GDP 성장률, 산업활동동향, 소비자물가(CPI), 실업률·취업자 수, 경기선행지수."
    - "필립스 곡선: 단기적으로 실업과 물가가 반대로 움직이는 관계(장기에는 성립하지 않는다는 반론이 있다)."
    - "스태그플레이션: 경기 침체와 물가 상승이 겹치는 상황(비용인상 충격)."
    - "업종별 경기 민감도: 경기민감 업종(철강·화학·건설)과 경기방어 업종(통신·필수소비재)."
    - "구축효과: 정부 차입이 늘어 금리가 오르면 민간 투자가 줄 수 있다."
  how_to:
    - "오늘 사례의 업종이 경기에 민감한지 방어적인지 고른다."
    - "최근 지표(성장률, 물가, 고용)가 경기의 어느 국면을 가리키는지 본다."
    - "정부 정책(예산, 세제, 보조금)이 이 업종 수요를 늘리는지 줄이는지 본다."
  example: "정부 예산 규모(2026년 727.9조원)와 재정적자 비율 기사는 확장·긴축 재정 기조를 보여준다."
  pitfalls:
    - "지표 하나로 경기를 판단하지 말고 선행·동행·후행 지표를 같이 본다."
  related: [monetary_policy, exchange_rate, operating_leverage, elasticity]
  keywords: [경기선행지수, 승수효과, 스태그플레이션, 필립스곡선]
  quiz:
    - q: "경기 침체와 물가 상승이 동시에 나타나는 현상은?"
      choices: ["디플레이션", "스태그플레이션", "골디락스", "리플레이션"]
      answer: 1
      explain: "원자재 가격 급등 같은 비용 충격이 대표적인 원인이다."

- id: trade_tariff
  title: 비교우위와 관세의 경제학
  field: 국제경제
  one_line: "각국이 상대적으로 효율적인 재화를 생산하여 교환하면 모두 이득을 얻는다는 비교우위론과, 관세의 실제 부담이 누구에게 귀착되는지에 관한 분석이다."
  easy: |
    리카도의 비교우위에 따르면, 어떤 나라가 모든 걸 더 잘 만들어도(절대우위) 상대적으로 더 잘하는 것에 집중하고 교환하면 양국 모두 이득이다. 무역이 서로에게 이익이 되는 근본 이유다.
    관세는 수입품에 매기는 세금이라 국내 생산자를 보호하지만, 소비자는 비싸게 사고 세금 수입보다 더 큰 거래가 사라지는 손실(사중손실)이 생긴다. 관세 부담이 실제로 누구에게 가는지는 탄력성에 달렸다. 수출기업이 값을 못 올리면 수출기업이, 올릴 수 있으면 수입국 소비자가 부담한다.
  deep:
    - "관세의 효과: 소비자 잉여 감소, 생산자 잉여와 관세 수입 증가, 그리고 어디에도 돌아가지 않는 사중손실."
    - "기업의 대응: 현지 생산(관세 회피), 원산지 다변화, 가격 전가, 원가 절감."
    - "자유무역협정(FTA)과 원산지 규정: 어느 나라 제품으로 인정받는지가 관세율을 정한다."
    - "보호무역의 논리: 유치산업 보호, 국가 안보와 공급망, 불공정 무역 대응."
  how_to:
    - "오늘 사례 회사의 해당 국가 매출 비중을 찾는다."
    - "관세를 가격에 넘길 수 있는지(브랜드 힘, 경쟁 상황) 판단한다."
    - "현지 생산 투자 같은 대응이 비용을 얼마나 늘리는지 본다."
  example: "미국이 수입품 관세를 크게 올리자 국내 자동차·가전·배터리 기업들이 미국 현지 공장 투자를 늘리고 가격 전가 여부를 고민하는 기사가 이어졌다."
  pitfalls:
    - "관세의 단기 효과(관세 전 미리 수출해 수출 급증)와 장기 효과(공급망 재편)를 구분해야 한다."
  related: [exchange_rate, supply_chain, elasticity, game_theory]
  keywords: [비교우위, 사중손실, 원산지 규정, 리쇼어링]
  quiz:
    - q: "관세 때문에 아무에게도 돌아가지 않고 사라지는 후생 손실은?"
      choices: ["사중손실", "매몰비용", "기회비용", "거래비용"]
      answer: 0
      explain: "관세가 없었다면 이뤄졌을 거래가 사라지면서 생기는 손실이다."

- id: behavioral_econ
  title: 행동경제학(손실회피·앵커링·프레이밍·디폴트)
  field: 행동경제
  one_line: "사람은 항상 합리적으로 판단하지 않으며 손실 회피, 기준점 효과(앵커링), 프레이밍, 기본값 효과 등의 체계적 편향을 보인다는 경제학 분야이다."
  easy: |
    카너먼과 트버스키의 전망이론에 따르면 사람은 같은 크기라도 이익보다 손실을 약 2배 크게 느낀다(손실회피). 그래서 '1만원 할인'보다 '안 사면 1만원 손해'라는 표현이 더 잘 먹힌다(프레이밍). 정가 30만원을 지우고 19만원이라고 쓰면 처음 본 30만원이 기준점이 돼 싸게 느껴진다(앵커링).
    자동 가입을 기본값으로 두면 가입률이 크게 오르는 디폴트 효과도 있다. 마케팅의 가격 표시, 구독 자동 갱신, 정부 정책의 넛지가 모두 이 원리를 쓴다.
  deep:
    - "전망이론: 사람은 결과의 절대 크기보다 기준점 대비 변화로 판단하고, 이익 앞에서는 위험을 피하고 손실 앞에서는 위험을 감수한다."
    - "심적 회계: 같은 돈도 어디서 왔는지에 따라 다르게 쓴다(보너스는 쉽게 쓴다)."
    - "현재 편향: 미래의 큰 이익보다 지금의 작은 이익을 고른다(첫 달 무료 구독)."
    - "투자 행동: 오른 주식은 빨리 팔고 내린 주식은 붙드는 처분효과, 과잉확신, 군집행동."
  how_to:
    - "오늘 사례의 마케팅·정책이 어떤 심리 효과를 쓰는지 찾는다."
    - "같은 내용을 다르게 표현(프레이밍)하면 반응이 어떻게 달라질지 생각한다."
    - "소비자를 오도하는 수준(다크 패턴)인지 판단한다."
  example: "미국 기업연금(401k)에서 자동 가입을 기본값으로 바꾸자 가입률이 크게 높아졌다는 연구(매드리언·셰이, 2001)가 넛지 정책을 널리 알린 계기가 됐다."
  pitfalls:
    - "행동경제학 기법이 소비자를 속이는 다크 패턴으로 쓰이면 규제 대상이 된다."
  related: [pricing_strategy, clv_cac, ipo_underpricing, elasticity]
  keywords: [전망이론, 넛지, 심적회계, 다크패턴]
  quiz:
    - q: "정가를 먼저 보여주고 할인가를 제시하면 싸게 느껴지는 효과는?"
      choices: ["앵커링", "손실회피", "디폴트 효과", "현재 편향"]
      answer: 0
      explain: "처음 본 숫자(정가)가 판단의 기준점(닻)이 된다."
