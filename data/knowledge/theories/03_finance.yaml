# 재무관리 이론 카드

- id: valuation
  title: 기업가치 평가(DCF·상대가치)
  field: 재무관리
  one_line: "회사 가치는 앞으로 벌 현금을 지금 가치로 바꾼 것(DCF)이거나, 비슷한 회사가 시장에서 받는 값에 비춰 본 것(상대가치)이다."
  easy: |
    매년 100만원씩 영원히 받는 권리는 얼마일까. 금리가 5%라면 약 2,000만원이다(100만원 ÷ 5%). 회사도 같다. 앞으로 벌 잉여현금흐름을 위험을 반영한 할인율(자본비용)로 나눠 현재가치를 구하는 것이 DCF(현금흐름할인법)다.
    계산이 번거롭고 가정이 많아서 실무에서는 비슷한 회사들의 주가 배수를 빌려 오는 상대가치 평가를 많이 쓴다. PER(시가총액 ÷ 순이익), PBR(시가총액 ÷ 순자산), EV/EBITDA가 대표적이다. IPO 공모가, 인수 가격, 증권사 목표주가가 모두 이 두 방법으로 나온다.
  deep:
    - "성장하는 영구현금흐름의 가치 = 내년 현금흐름 ÷ (할인율 − 성장률). 성장률 가정이 조금만 바뀌어도 가치가 크게 변한다."
    - "EV(기업가치) = 시가총액 + 순차입금. 빚까지 포함한 회사 전체 값이라 부채 구조가 다른 회사끼리 비교할 때 쓴다."
    - "PBR과 ROE의 관계: 적정 PBR ≈ (ROE − 성장률) ÷ (자본비용 − 성장률). ROE가 자본비용보다 낮으면 PBR이 1배 아래인 게 이론적으로 자연스럽다. 밸류업 논의의 핵심이다."
    - "상대가치 평가의 승부처는 비교기업 선정과 할인율이다."
  how_to:
    - "오늘 사례의 거래 가격(인수가, 공모가)을 대상 회사의 이익·순자산과 나눠 PER·PBR을 구한다."
    - "같은 업종 평균 배수와 비교해 비싼지 싼지 본다."
    - "그 가격을 정당화하려면 이익이 몇 년간 얼마나 늘어야 하는지 거꾸로 계산해 본다."
  example: "IPO 증권신고서의 '공모가 산정 근거'에는 비교기업 PER 평균과 할인율이 나온다. 비교기업이 적절한지, 할인율이 충분한지 직접 따져볼 수 있다."
  pitfalls:
    - "숫자가 정교해 보여도 가정이 결과를 좌우한다. 가정을 하나씩 바꿔 보는 민감도 분석이 필수다."
  related: [capital_structure, ipo_underpricing, ma_synergy, conglomerate_discount]
  keywords: [DCF, PER, PBR, EV/EBITDA, 민감도분석]
  quiz:
    - q: "매년 50억원을 영원히 버는 회사(성장 없음)의 가치는 할인율 10%일 때 얼마일까?"
      choices: ["50억원", "250억원", "500억원", "5,000억원"]
      answer: 2
      explain: "영구현금흐름의 가치 = 50억 ÷ 10% = 500억원."
    - q: "ROE가 자본비용보다 계속 낮은 회사의 PBR은 이론적으로 어떻게 될까?"
      choices: ["1배보다 크다", "1배 미만", "항상 1배", "ROE와 무관하다"]
      answer: 1
      explain: "주주가 요구하는 수익률보다 적게 버니 장부가치보다 낮게 평가된다."

- id: capital_structure
  title: 자본구조와 자본비용(WACC)
  field: 재무관리
  one_line: "빚과 자기자본을 어떤 비율로 섞어 돈을 조달하느냐가 기업가치와 위험에 미치는 영향에 대한 이론."
  easy: |
    회사 돈은 빌린 돈(부채)과 주주 돈(자기자본)으로 이뤄진다. 부채는 이자가 비용으로 인정돼 법인세를 줄여 주고(절세 효과) 주주가 요구하는 수익률보다 싸지만, 너무 많으면 망할 위험과 그에 따른 비용(재무적 곤경 비용)이 커진다. 그래서 적당한 부채비율에서 기업가치가 가장 크다는 것이 상충이론이다.
    경영진은 정보가 새지 않는 내부 자금부터 쓰고, 다음이 부채, 마지막이 주식 발행이라는 자본조달순서이론도 있다. 두 자금의 비용을 비중대로 평균한 가중평균자본비용(WACC)이 회사의 '허들'이다. 투자 수익률이 WACC보다 높아야 가치가 생긴다.
  deep:
    - "MM 이론(1958): 세금과 파산비용이 없는 완벽한 시장이라면 자본구조는 기업가치와 무관하다. 현실의 세금·파산비용이 이 결론을 바꾼다."
    - "WACC = 자기자본비용 × 자기자본 비중 + 세후 부채비용 × 부채 비중."
    - "자기자본비용은 CAPM으로 추정한다: 무위험이자율 + 베타 × 시장위험프리미엄."
    - "주식 발행을 고르면 시장은 '경영진이 주가가 비싸다고 보나'로 읽어 주가가 떨어지는 경향이 있다(신호이론 카드)."
  how_to:
    - "오늘 사례(증자, 회사채, CB, 자산 매각)가 부채비율과 이자 부담을 어떻게 바꾸는지 계산한다."
    - "왜 그 조달 수단을 골랐을지(금리 수준, 주가 수준, 신용등급) 생각한다."
    - "조달한 돈의 쓰임새가 투자(수익 창출)인지 상환·운영(버티기)인지 본다."
  example: "고금리 시기에는 이자 부담이 커져 증자나 자산 매각으로 부채를 줄이는 공시가 늘어난다."
  pitfalls:
    - "적정 부채비율은 업종마다 다르다. 현금흐름이 안정적인 통신·전력은 부채비율이 높아도 버틴다."
  related: [signaling, valuation, operating_leverage, payout_policy]
  keywords: [MM이론, 상충이론, 자본조달순서, CAPM, WACC]
  quiz:
    - q: "법인세가 있을 때 부채가 기업가치를 높이는 주된 이유는?"
      choices: ["이자비용의 절세 효과", "주가 상승", "배당 증가", "매출 증가"]
      answer: 0
      explain: "이자는 비용으로 인정돼 세금을 줄인다. 대신 부채가 너무 많으면 파산 위험 비용이 커진다."

- id: signaling
  title: 정보 비대칭과 신호이론(역선택·도덕적 해이)
  field: 재무관리
  one_line: "한쪽이 더 많이 알 때 생기는 문제들. 경영진이 투자자보다 회사를 더 잘 알기 때문에 증자·자사주·배당 같은 행동 자체가 신호로 읽힌다."
  easy: |
    중고차 시장에서 판매자는 차 상태를 알지만 구매자는 모른다. 그러면 구매자는 평균 정도의 값만 쳐주려 하고, 좋은 차 주인은 팔기를 꺼려 결국 나쁜 차만 남는다. 애컬로프의 레몬 시장 이야기이고, 이를 역선택이라고 한다. 계약 후에 상대 행동을 감시할 수 없어 생기는 문제(보험 가입 후 부주의)는 도덕적 해이라고 한다.
    기업도 경영진이 더 많이 안다. 그래서 주식을 새로 찍으면(유상증자) '주가가 고평가됐다고 보나 보다'로 읽혀 주가가 떨어지는 경향이 있고, 자사주를 사면 '싸다고 보나 보다'로 읽혀 오르는 경향이 있다. 배당을 늘리는 것도 앞으로 이익이 안정적이라는 자신감의 신호로 받아들여진다.
  deep:
    - "신호 보내기: 정보가 많은 쪽이 비용이 드는 행동으로 품질을 증명한다(학력, 품질보증, 배당)."
    - "걸러내기: 정보가 적은 쪽이 선택지를 줘서 상대가 스스로 드러내게 한다(보험의 자기부담금 옵션)."
    - "이벤트 스터디: 공시 직후 주가 반응으로 시장이 신호를 어떻게 읽었는지 확인한다."
    - "금융·보험 산업은 역선택과 도덕적 해이를 관리하는 일이 사업의 본질이다(신용평가, 담보, 보험료 차등)."
  how_to:
    - "오늘 사례에서 정보를 더 가진 쪽과 덜 가진 쪽을 적는다."
    - "그 행동(증자, 자사주, 배당, 보증)이 시장에 어떤 신호를 보내는지 적는다."
    - "공시 다음 날 주가가 신호이론과 같은 방향으로 움직였는지 확인한다."
  example: "운영자금 목적의 대규모 유상증자 공시 뒤 주가가 급락하고, 소각을 전제로 한 자사주 매입 공시 뒤 주가가 오르는 흐름이 자주 관찰된다."
  pitfalls:
    - "신호는 평균적 경향일 뿐이다. 수익성 높은 투자를 위한 증자는 오히려 좋게 받아들여지기도 한다."
  related: [capital_structure, payout_policy, ipo_underpricing, agency_theory]
  keywords: [레몬시장, 역선택, 도덕적 해이, 이벤트 스터디]
  quiz:
    - q: "보험에 가입한 뒤 사고 예방에 소홀해지는 현상은?"
      choices: ["역선택", "도덕적 해이", "승자의 저주", "채찍효과"]
      answer: 1
      explain: "계약 뒤 행동을 감시할 수 없어 생기는 문제가 도덕적 해이다. 계약 전 정보 차이는 역선택."

- id: payout_policy
  title: 배당·자사주 정책
  field: 재무관리
  one_line: "번 돈을 재투자할지 주주에게 돌려줄지, 돌려준다면 배당과 자사주 중 무엇으로 할지에 대한 이론."
  easy: |
    회사가 더 높은 수익을 낼 투자처가 없는데도 현금을 쌓아 두거나 무리한 투자를 하면, 주주는 차라리 돌려받는 게 낫다. 젠슨의 잉여현금흐름 가설이다. 그래서 성숙기 기업일수록 배당과 자사주 소각을 늘린다.
    배당은 한 번 올리면 내리기 어려워(배당 스무딩) 지속적 이익에 대한 약속으로 읽힌다. 자사주 매입은 필요할 때만 할 수 있어 유연하다. 세금이 다르게 매겨져 투자자마다 선호가 다르기도 하다(고객효과).
  deep:
    - "MM 배당무관련 이론: 완벽한 시장이면 배당정책은 기업가치와 무관하다. 현실의 세금·정보 비대칭·대리인 문제가 차이를 만든다."
    - "린트너 모형: 기업은 목표 배당성향을 정해 두고 이익 변화를 천천히 배당에 반영한다."
    - "자사주 소각은 주식 수를 줄여 주당순이익(EPS)을 높인다. 소각하지 않으면 언제든 다시 팔 수 있어 효과가 약하다."
    - "한국 맥락: 밸류업 프로그램, 3차 상법 개정의 자사주 소각 의무, 고배당기업 배당소득 분리과세가 주주환원을 늘리는 방향으로 작동한다."
  how_to:
    - "배당성향(배당 ÷ 순이익)과 총주주환원율((배당 + 소각) ÷ 순이익)을 계산한다."
    - "회사의 성장 단계(현금흐름 생애주기)와 환원 수준이 맞는지 본다."
    - "환원 재원이 영업으로 번 돈인지, 빚이나 자산 매각인지 확인한다."
  example: "배당성향 목표와 자사주 소각 계획을 함께 발표하는 '주주환원 정책' 공시가 2024년 밸류업 이후 크게 늘었다."
  pitfalls:
    - "성장 기회가 많은 기업이 환원을 크게 늘리는 건 오히려 미래 투자를 줄이는 신호일 수 있다."
  related: [signaling, agency_theory, valuation, capital_structure]
  keywords: [잉여현금흐름 가설, 배당 스무딩, 총주주환원율]
  quiz:
    - q: "배당을 쉽게 줄이지 않으려는 기업의 경향을 뭐라고 할까?"
      choices: ["배당 스무딩", "배당 함정", "고객효과", "재무레버리지"]
      answer: 0
      explain: "린트너가 관찰한 현상이다. 그래서 배당 인상은 앞으로도 그만큼 벌 자신이 있다는 신호로 읽힌다."

- id: ipo_underpricing
  title: IPO 저평가(공모가 할인)
  field: 재무관리
  one_line: "공모가가 상장 첫날 시장가격보다 낮게 정해지는 경향. 정보 비대칭과 위험을 보상하는 할인으로 설명한다."
  easy: |
    상장 첫날 주가가 공모가보다 크게 오르는 일이 흔하다. 회사로서는 더 받을 수 있던 돈을 못 받은 셈인데 왜 그럴까. 첫째, 정보를 잘 아는 투자자와 모르는 투자자가 섞여 있으면 정보가 없는 투자자는 좋은 공모주는 경쟁에 밀려 적게 받고 나쁜 공모주만 많이 받는 '승자의 저주'를 겪는다. 이들을 계속 참여시키려면 평균적으로 싸게 줘야 한다(록의 모형, 1986).
    둘째, 수요예측에서 기관이 진짜 수요를 털어놓게 하려면 보상이 필요하다. 셋째, 주관사가 흥행 실패 위험을 줄이려 보수적으로 가격을 잡는다.
  deep:
    - "첫날 수익률 = (첫날 종가 − 공모가) ÷ 공모가."
    - "장기 성과: 여러 연구에서 공모주의 3~5년 장기 수익률이 비교기업보다 낮은 경향이 보고됐다."
    - "한국 제도: 상장 첫날 가격 변동폭 공모가의 60~400%, 기관 수요예측, 의무보유확약 우선배정."
    - "구주매출 비중이 높으면 기존 주주가 비싼 값에 빠져나가려 한다는 신호로 읽힐 수 있다."
  how_to:
    - "공모가가 희망 범위(밴드)의 위·아래 어디서 정해졌는지 본다."
    - "수요예측 경쟁률, 의무보유확약 비율, 유통 가능 물량을 확인한다."
    - "비교기업 배수와 할인율로 공모가가 싼지 비싼지 직접 판단해 본다."
  example: "청약 경쟁률이 수천 대 1을 기록하고 첫날 급등하는 사례와, 수요예측 부진으로 공모가를 낮추거나 상장을 철회하는 사례가 같은 해에 함께 나온다."
  pitfalls:
    - "첫날 급등이 좋은 회사라는 뜻은 아니다. 유통 물량이 적으면 가격이 쉽게 튄다."
  related: [signaling, valuation, behavioral_econ]
  keywords: [승자의 저주, 수요예측, 의무보유확약, 장기성과]
  quiz:
    - q: "정보가 부족한 투자자가 좋은 공모주는 적게, 나쁜 공모주는 많이 배정받는 문제를 설명한 개념은?"
      choices: ["승자의 저주(록의 모형)", "도덕적 해이", "채찍효과", "스무딩"]
      answer: 0
      explain: "그래서 공모가를 평균적으로 싸게 정해야 이들이 계속 참여한다는 설명이다."

- id: operating_leverage
  title: 영업레버리지와 손익분기점
  field: 재무관리
  one_line: "고정비 비중이 큰 회사는 매출이 조금만 변해도 이익이 크게 출렁인다."
  easy: |
    매출이 10% 늘었는데 영업이익은 50% 늘었다는 기사를 자주 본다. 비밀은 고정비다. 임차료, 감가상각비, 인건비처럼 매출과 상관없이 나가는 비용이 크면 손익분기점을 넘은 뒤 늘어나는 매출은 대부분 이익이 된다. 반대로 매출이 줄면 이익은 훨씬 크게 줄어든다.
    이 민감도를 영업레버리지도(DOL)라고 한다. 여기에 이자 같은 고정 금융비용이 더해지면 재무레버리지가 이익 변동을 한 번 더 키운다.
  deep:
    - "공헌이익 = 매출 − 변동비. 공헌이익률 = 공헌이익 ÷ 매출."
    - "손익분기점 매출 = 고정비 ÷ 공헌이익률."
    - "DOL = 영업이익 변화율 ÷ 매출 변화율 = 공헌이익 ÷ 영업이익."
    - "결합레버리지 = 영업레버리지 × 재무레버리지."
    - "고정비가 큰 산업(반도체, 항공, 통신, 소프트웨어)은 경기에 따라 이익이 크게 움직인다."
  how_to:
    - "실적 기사에서 매출 증가율과 영업이익 증가율을 비교해 DOL을 어림한다."
    - "감가상각비·인건비 비중으로 고정비 구조를 짐작한다."
    - "다음 분기 매출이 5% 줄면 이익이 얼마나 줄지 계산해 본다."
  example: "반도체 회사는 업황이 좋을 때 매출이 조금만 늘어도 이익이 크게 늘고, 나쁠 때는 큰 적자로 돌아선다. 항공사가 탑승률 몇 %에 이익이 갈리는 것도 같은 이유다."
  pitfalls:
    - "일회성 비용·이익이 섞이면 레버리지 계산이 틀어진다."
  related: [scale_scope_learning, capital_structure, business_cycle]
  keywords: [공헌이익, 손익분기점, DOL, 결합레버리지]
  quiz:
    - q: "매출이 10% 늘 때 영업이익이 30% 늘었다면 영업레버리지도(DOL)는?"
      choices: ["0.3", "1.3", "3", "30"]
      answer: 2
      explain: "DOL = 30% ÷ 10% = 3. 매출 변화가 이익에서는 세 배로 커진다."

- id: agency_theory
  title: 대리인 이론
  field: 재무관리
  one_line: "주인(주주)과 대리인(경영자)의 이해가 다르고 주인이 대리인을 완벽히 감시할 수 없을 때 생기는 비용과 그 해법."
  easy: |
    회사의 주인은 주주지만 실제 운영은 경영자가 한다. 경영자는 주주가치보다 회사 규모 키우기, 자리 보전, 사적 혜택을 더 원할 수 있다. 이 차이에서 생기는 손실과 이를 막기 위한 감시·보상 비용을 대리인 비용이라고 한다(젠슨·메클링, 1976).
    한국처럼 지배주주가 있는 회사에서는 '지배주주와 소액주주' 사이의 대리인 문제가 더 크다. 지배주주에게 유리한 합병비율, 일감 몰아주기, 알짜 사업 분리 같은 거래가 소액주주 몫을 빼 간다는 터널링 논란으로 이어진다.
  deep:
    - "해결 장치: 성과연동 보상(주식 보상), 사외(독립)이사, 감사위원회, 공시 강화, 적대적 인수 위협(기업지배권 시장), 행동주의 펀드."
    - "잉여현금흐름 문제: 현금이 많은데 투자처가 없으면 경영자가 낭비할 유인이 커서 배당과 부채가 규율 장치가 된다."
    - "한국 맥락: 2025~2026년 상법 개정(이사의 주주 충실의무, 감사위원 3% 룰, 집중투표, 자사주 소각)이 이 문제를 겨냥한다."
  how_to:
    - "오늘 사례에서 이익을 보는 쪽과 손해를 볼 수 있는 쪽을 적는다(지배주주, 소액주주, 경영진, 채권자)."
    - "거래 조건(합병비율, 분할 방식, 발행가)이 누구에게 유리한지 따진다."
    - "그 거래를 견제하는 장치(이사회, 주주총회, 공시, 주식매수청구권)가 작동했는지 본다."
  example: "계열사 간 합병에서 합병비율이 지배주주에게 유리하다는 논란이 반복됐고, 합병가액 규제 개선과 상법 개정 논의로 이어졌다."
  pitfalls:
    - "모든 경영 판단을 대리인 문제로 보면 안 된다. 장기 투자는 단기 주가에 불리해 보일 수 있다."
  related: [conglomerate_discount, payout_policy, incentives, signaling]
  keywords: [대리인 비용, 터널링, 기업지배권 시장, 행동주의]
  quiz:
    - q: "지배주주가 계열사 간 거래로 소액주주 몫을 빼 가는 행위를 흔히 뭐라고 할까?"
      choices: ["터널링", "스무딩", "헤지", "리픽싱"]
      answer: 0
      explain: "회사 가치를 굴을 파듯 지배주주 쪽으로 빼낸다는 뜻이다."
