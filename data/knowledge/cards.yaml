- id: shareholder_return
  title: 배당·밸류업(주주환원)
  tags: [dividend, valueup, capital]
  summary: "배당과 자사주 소각으로 이익을 주주에게 돌려주는 정책. 2024년 밸류업 프로그램 이후 관련 공시가 크게 늘었다."
  why:
    - "저평가(PBR 1배 미만) 해소"
    - "투자자 신뢰 확보"
    - "세제 혜택(고배당기업 배당소득 분리과세) 활용"
  accounting:
    - "배당은 주주총회(또는 이사회) 결의 시점에 부채(미지급배당금) 인식. 보고기간 뒤에 결의한 배당은 그 기간 말 부채가 아니다(K-IFRS 1010)"
    - "현물배당은 분배할 자산의 공정가치로 측정(K-IFRS 2117)"
  tax:
    - "개인 배당소득은 원칙적으로 14%(지방세 포함 15.4%) 원천징수, 연 2,000만원 초과분은 금융소득 종합과세"
    - "2026년 배당분부터 고배당 상장사 배당은 분리과세 선택 가능: 2,000만원 이하 14%, 3억원 이하 20%, 50억원 이하 25%, 50억원 초과 30%"
    - "법인 주주는 수입배당금 익금불산입"
  law:
    - "기업가치 제고 계획(밸류업) 자율공시(2024년 5월 가이드라인)"
    - "배당액을 먼저 정하고 배당기준일을 나중에 정하는 방식으로 개선(2023년부터, 정관 개정 필요)"
  numbers:
    - "배당성향(배당총액 ÷ 순이익)"
    - "배당수익률(주당배당금 ÷ 주가)"
    - "총주주환원율((배당 + 자사주 소각) ÷ 순이익)"
    - "ROE와 PBR 목표"
  questions:
    - "ROE가 자본비용보다 낮은 회사의 PBR이 1배 아래인 이유는?"
  quiz:
    - q: "2026년 배당분부터 고배당 상장사 배당소득 분리과세의 최고세율은?"
      choices: ["25%", "30%", "35%", "45%"]
      answer: 1
      explain: "정부안 35%가 국회 논의에서 30%(50억원 초과 구간)로 낮아졌다."

- id: marketing
  title: 마케팅을 숫자로 읽기(회계·세무)
  tags: [marketing]
  summary: "마케팅 사례도 결국 숫자로 남는다. 쿠폰·포인트·광고비가 재무제표 어디에 찍히는지 알면 마케팅 성과를 돈으로 읽을 수 있다."
  why:
    - "신규 고객 확보 비용(CAC)과 고객 생애가치(LTV) 비교"
    - "가격 인상·프로모션이 매출과 마진에 주는 효과 확인"
    - "브랜드 투자(광고)는 당장 비용이지만 장기 매출에 영향"
  accounting:
    - "고객에게 주는 쿠폰·리베이트·판매장려금은 원칙적으로 매출에서 뺀다(K-IFRS 1115 고객에게 지급할 대가)"
    - "포인트·마일리지는 별도 수행의무라 받은 대가 일부를 계약부채로 미뤘다가 사용될 때 수익 인식"
    - "광고선전비는 효과가 오래 가도 자산이 아니라 발생 즉시 비용(K-IFRS 1038)"
    - "구독·멤버십은 기간에 걸쳐 수익 인식, 계약을 따내려고 쓴 증분원가(판매수수료)는 자산화 가능"
  tax:
    - "광고선전비는 손금이지만 특정 거래처를 위한 지출은 기업업무추진비(접대비)로 보아 한도 초과분 손금불산입"
    - "특정인에게 준 물품은 연간 5만원 이내(개당 3만원 이하 물품은 한도 계산에서 제외)면 광고선전비로 인정(법인세법 시행령 제19조)"
  law:
    - "표시·광고법, 전자상거래법 등 소비자 보호 규제가 마케팅 방식에 영향"
  numbers:
    - "광고선전비 ÷ 매출(업종 평균과 비교)"
    - "판관비 증가율과 매출 증가율 비교"
    - "프로모션 기간 매출총이익률 변화"
  questions:
    - "쿠폰 할인을 매출 차감이 아니라 판관비로 처리하면 어떤 지표가 부풀려질까?"
    - "이 캠페인 비용을 회수하려면 매출이 얼마나 늘어야 할까?(공헌이익률로 계산)"
  quiz:
    - q: "고객에게 준 할인 쿠폰은 K-IFRS 1115에서 원칙적으로 어떻게 처리할까?"
      choices: ["판매비", "매출에서 차감", "영업외비용", "무형자산"]
      answer: 1
      explain: "고객에게 지급할 대가는 원칙적으로 거래가격(수익)에서 뺀다."
    - q: "공헌이익률 40%인 제품의 광고비 2억원을 회수하려면 매출이 최소 얼마 늘어야 할까?"
      choices: ["2억원", "4억원", "5억원", "8억원"]
      answer: 2
      explain: "2억 ÷ 0.4 = 5억원."

- id: governance
  title: 지배구조와 2025~2026 상법 개정
  tags: [governance]
  summary: "2025~2026년 세 차례 상법 개정으로 이사회와 대주주의 의사결정 방식이 크게 바뀌었다. 합병·분할·자사주 사례를 볼 때 늘 함께 확인할 배경지식."
  why:
    - "소액주주 보호와 코리아 디스카운트 해소"
    - "이사회 독립성 강화"
  accounting:
    - "지배구조 변화 자체에는 회계처리가 없지만, 합병비율·분할 방식·자사주 처리 결정에서 이사회가 주주 이익을 검토한 근거를 남기는 것이 중요해졌다"
  tax: []
  law:
    - "1차(2025년 7월 시행): 이사의 충실의무 대상에 주주 추가. 독립이사(1/3 이상)와 감사위원 선임 때 최대주주 측 의결권 합산 3% 제한은 2026년 7월 시행"
    - "2차(2025년 8월 국회 통과): 자산 2조원 이상 상장사 집중투표제 의무화, 분리선출 감사위원 2명 이상으로 확대(공포 1년 뒤 시행)"
    - "3차(2026년 3월 6일 시행): 자기주식 원칙적 소각 의무(취득 후 1년 안), 보유·처분은 주주총회 승인"
  numbers:
    - "최대주주 지분율과 자사주 비율"
    - "사외(독립)이사 비율"
    - "소액주주 지분율"
  questions:
    - "충실의무 확대 이후 계열사 간 합병비율을 정할 때 이사회는 무엇을 검토해야 할까?"
  quiz:
    - q: "1차 상법 개정의 '3% 룰'(최대주주 측 의결권 합산 제한)이 적용되는 안건은?"
      choices: ["모든 이사 선임", "감사위원 선임·해임", "배당 결의", "정관 변경"]
      answer: 1
      explain: "감사위원을 뽑거나 해임할 때 최대주주와 특수관계인 등의 의결권을 합쳐 3%로 제한한다."

- id: macro
  title: 금리·환율이 재무제표에 닿는 길
  tags: [macro]
  summary: "금리와 환율은 재무제표 여러 곳을 동시에 움직인다. 거시 뉴스를 개별 회사 숫자로 번역하는 연습."
  why:
    - "같은 뉴스에도 회사마다 받는 영향이 반대일 수 있다"
  accounting:
    - "금리 상승: 변동금리 차입 이자비용 증가, 이자보상배율 하락, 손상검사 할인율 상승으로 손상 위험 증가. 확정급여채무는 할인율이 오르면 줄어든다"
    - "원화 약세(환율 상승): 수출 기업 원화 매출 증가, 외화부채 환산손실(K-IFRS 1021), 해외 자회사 순자산 환산이익은 기타포괄손익"
    - "물가 상승: 원가 상승분을 판매가에 넘길 수 있는지가 관건(매출총이익률)"
  tax: []
  law: []
  numbers:
    - "순외화자산(부채) 규모(주석의 환율 민감도 분석)"
    - "변동금리 차입 비중"
    - "이자보상배율(영업이익 ÷ 이자비용)"
  questions:
    - "환율이 10% 오르면 이 회사 영업이익은 늘까 줄까? 주석의 민감도 분석으로 확인해보자"
  quiz:
    - q: "시장금리가 올라 할인율이 높아지면 확정급여채무는?"
      choices: ["늘어난다", "줄어든다", "그대로다", "알 수 없다"]
      answer: 1
      explain: "미래 지급액의 현재가치가 작아진다. 변동분은 재측정요소로 기타포괄손익에 반영."

- id: insolvency
  title: 부실 신호와 회생
  tags: [insolvency]
  summary: "부도·회생신청·영업정지는 가장 비싼 교훈이다. 위기 전 숫자에 어떤 신호가 있었는지 거꾸로 따라가 보자."
  why:
    - "유동성 위기(만기 차입금을 갚을 현금 부족)"
    - "영업으로 이자도 못 버는 상태가 이어짐"
  accounting:
    - "계속기업 가정에 중요한 불확실성이 있으면 감사보고서에 별도 문단, 심하면 한정·의견거절"
    - "회생계획에 따라 채무가 줄면 채무조정이익 인식"
  tax:
    - "채무면제이익 중 이월결손금 보전에 충당한 금액은 익금불산입(법인세법 제18조)"
  law:
    - "상장사는 회생절차 개시신청 때 매매거래 정지와 상장적격성 심사"
    - "감사의견 비적정(한정·부적정·의견거절)은 상장폐지 사유"
  numbers:
    - "이자보상배율 1배 미만이 이어지는지(한계기업)"
    - "영업현금흐름 적자 지속 여부"
    - "단기차입금 ÷ 현금성자산"
    - "자본잠식률"
  questions:
    - "1~2년 전 재무제표에서 가장 먼저 나타난 경고 신호는 무엇이었을까?"
  quiz:
    - q: "이자보상배율이 3년 연속 1배 미만인 기업을 흔히 뭐라고 부를까?"
      choices: ["우량기업", "한계기업", "성장기업", "지주회사"]
      answer: 1
      explain: "영업이익으로 이자도 못 갚는 상태가 이어진다는 뜻이다."
