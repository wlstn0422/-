# 회계·세무 개념카드
# - 리포트에서 그날 나온 사례 유형에 맞춰 자동으로 골라 보여준다.
# - 법령·제도는 2026년 11월 기준으로 정리했다. 실무에 쓸 때는 원문(국가법령정보센터, 금융위·거래소 공지)을 다시 확인할 것.
# - 필드: id, title, tags(연결되는 공시·뉴스 유형), summary, why, accounting, tax, law, numbers, questions, quiz

- id: merger
  title: 합병
  tags: [merger, split_merger, ma]
  summary: "두 회사가 법적으로 하나가 되는 거래. 소멸회사의 권리·의무가 존속(또는 신설)회사로 포괄승계된다."
  why:
    - "규모의 경제와 시너지(매출 확대, 원가 절감)"
    - "지배구조 단순화와 계열사 정리"
    - "비상장사가 상장사와 합쳐 시장에 들어오는 통로(우회상장)"
    - "결손 법인을 흡수하는 재무구조 재편(세무상 이월결손금 승계에는 제한이 있다)"
  accounting:
    - "취득자가 따로 있는 사업결합이면 K-IFRS 1103 취득법. 이전대가(공정가치)가 식별가능 순자산 공정가치보다 크면 영업권, 작으면 염가매수차익(당기이익)"
    - "법적 존속회사와 회계상 취득자가 다를 수 있다(역취득). 합병 후 누가 지배하는지로 판단"
    - "동일지배 아래 계열사 간 합병은 1103 적용범위 밖. 실무는 장부금액법(연결장부금액 또는 피합병법인 장부금액)을 회계정책으로 고른다"
    - "영업권은 상각하지 않고 매년 손상검사(K-IFRS 1036)"
  tax:
    - "적격합병 요건(법인세법 제44조 제2항): 1년 이상 사업을 계속한 내국법인 간 합병, 합병대가 중 주식 80% 이상과 지분비율 배정·지배주주 등의 보유, 승계 사업 계속, 근로자 80% 이상 승계·유지"
    - "적격합병이면 피합병법인 양도손익이 없는 것으로 보고(장부가 양도), 합병법인은 자산조정계정으로 과세를 미룬다. 2년(고용은 3년) 안에 사업 폐지·주식 처분 등 사후관리 위반 시 과세"
    - "비적격합병이면 피합병법인에 양도손익 과세, 합병법인은 합병매수차익·차손을 60개월에 걸쳐 익금·손금 산입"
    - "피합병법인 주주는 합병대가가 종전 주식 취득가액을 넘으면 의제배당"
    - "합병비율이 불공정해 대주주가 이익을 보면 증여세(상증법 제38조), 법인 사이에는 부당행위계산 부인"
  law:
    - "주주총회 특별결의(상법 제522조). 소규모합병(존속회사가 내주는 주식이 발행주식총수의 10% 이하 등)과 간이합병(소멸회사 주식 90% 이상 보유 등)은 이사회 승인으로 갈음"
    - "반대주주 주식매수청구권(상법 제522조의3, 상장사는 자본시장법 제165조의5). 소규모합병의 존속회사 주주에게는 인정되지 않는다"
    - "상장사 합병가액(자본시장법 시행령 제176조의5): 계열사 간 합병은 기준시가 대비 ±10% 범위. 비계열사 간 합병은 2024년 11월 26일부터 이 산식 대신 외부평가와 이사회 의견서 공시로 규율"
  numbers:
    - "합병비율과 산출근거"
    - "상대회사 자산·매출·순이익이 우리 회사의 몇 %인지"
    - "합병신주가 기존 발행주식의 몇 %인지(희석)"
    - "주식매수청구가격과 현재 주가의 차이(청구가 몰리면 합병이 무산될 수 있다)"
  questions:
    - "이 합병의 회계상 취득자는 누구인가? 동일지배 거래인가?"
    - "합병대가에 현금이 섞였다면 적격합병의 주식 80% 요건을 채우는가?"
    - "합병비율은 어느 쪽 주주에게 유리한가?"
  quiz:
    - q: "소규모합병으로 주주총회를 이사회 승인으로 갈음하려면, 존속회사가 내주는 신주(이전하는 자기주식 포함)가 발행주식총수의 몇 % 이하여야 할까?"
      choices: ["5%", "10%", "20%", "30%"]
      answer: 1
      explain: "상법 제527조의3. 2015년 개정으로 5%에서 10%로 넓어졌다. 합병교부금 등이 순자산의 5%를 넘으면 소규모합병을 쓸 수 없다."
    - q: "법인세법상 적격합병이 되려면 합병대가 중 주식 비중이 최소 얼마여야 할까?"
      choices: ["50%", "70%", "80%", "100%"]
      answer: 2
      explain: "법인세법 제44조 제2항 제2호. 나머지 20% 안에서는 현금 등을 줄 수 있다."
    - q: "계열회사 간 상장사 합병에서 합병가액은 기준시가 대비 어느 범위에서 정해야 할까?"
      choices: ["±5%", "±10%", "±30%", "제한 없음"]
      answer: 1
      explain: "자본시장법 시행령 제176조의5. 비계열사 간 합병은 2024년 11월부터 산식 대신 외부평가가 의무다."

- id: split
  title: 분할(인적분할·물적분할)
  tags: [split, split_merger]
  summary: "회사의 일부 사업을 떼어 새 회사를 만드는 거래. 신설회사 주식을 기존 주주가 나눠 가지면 인적분할, 기존 회사가 100% 가지면 물적분할."
  why:
    - "사업별 가치를 따로 평가받기(복합기업 디스카운트 해소)"
    - "투자 유치·합작·매각을 위해 사업을 분리"
    - "지주회사 체제 전환(인적분할 뒤 현물출자·공개매수)"
    - "사업별 책임경영과 빠른 의사결정"
  accounting:
    - "물적분할: 분할회사 별도재무제표에 이전한 순자산 장부금액으로 종속기업투자주식을 인식하는 것이 실무 관행(동일지배 거래). 연결재무제표는 변화가 없다"
    - "인적분할: 신설회사 주식이 주주에게 배분되므로 존속회사 순자산과 자본이 줄어든다. 국내 실무는 장부금액 처리가 일반적이고, K-IFRS 2117(비현금자산의 소유주 분배) 적용 여부가 쟁점이 될 수 있다"
    - "분할 후 신설회사 지분 일부를 팔거나 상장해도 지배력을 유지하면 자본거래(비지배지분 변동), 지배력을 잃으면 처분손익"
  tax:
    - "적격분할 요건(법인세법 제46조 제2항): 분할등기일 현재 5년 이상 사업을 계속한 법인이 독립된 사업부문을 분할하고 자산·부채를 포괄승계, 분할대가 전액 주식과 지분비율 배정, 승계 사업 계속, 근로자 80% 이상 승계·유지"
    - "물적분할은 제47조 과세특례. 요건을 채우면 분할법인이 받은 주식의 양도차익 상당액을 손금산입(압축기장충당금)하고, 그 주식이나 승계자산을 처분할 때 익금으로 되돌린다"
    - "인적분할에서 주주가 받은 신설법인 주식 가액이 종전 주식 취득가액을 넘으면 의제배당(적격분할이면 장부가로 평가해 사실상 과세가 미뤄진다)"
  law:
    - "주주총회 특별결의(상법 제530조의3). 물적분할은 상법 제530조의12"
    - "2022년 12월부터 상장사 물적분할에 반대하는 주주에게 주식매수청구권. 거래소는 물적분할 자회사 상장 심사 때 모회사 일반주주 보호 노력을 확인"
    - "2024년 12월 31일부터 상장사 인적분할 때 자기주식에 신주 배정 금지(이른바 자사주의 마법 차단)"
    - "2026년 3월 시행 3차 상법 개정으로 자기주식은 원칙적으로 소각해야 해, 분할 전에 자사주를 쌓아 지배력을 키우는 방식이 사실상 막혔다"
  numbers:
    - "분할 방식(인적·물적)과 분할비율"
    - "신설회사로 가는 자산·매출이 분할 전 회사의 몇 %인지"
    - "신설회사 재상장 또는 향후 상장 계획"
    - "존속회사에 남는 부채 비중"
  questions:
    - "물적분할 후 자회사를 상장하면 모회사 주주 가치가 왜 희석된다고 할까?"
    - "이번 거래가 적격분할의 '독립된 사업부문' 요건을 채우는가?"
    - "인적분할이라면 지주회사 전환의 첫 단계인가?"
  quiz:
    - q: "법인세법상 적격분할이 되려면 분할법인은 분할등기일 현재 최소 몇 년 이상 사업을 계속하고 있어야 할까?"
      choices: ["1년", "3년", "5년", "10년"]
      answer: 2
      explain: "법인세법 제46조 제2항 제1호. 합병(1년)보다 길다."
    - q: "상장사가 인적분할할 때 자기주식에 대한 신주 배정은 현재 어떻게 될까?"
      choices: ["자유롭게 배정", "주총 특별결의가 있으면 허용", "금지", "50%까지 허용"]
      answer: 2
      explain: "2024년 12월 31일 시행된 자본시장법 시행령 개정으로 금지됐다."
    - q: "물적분할 직후 분할회사의 연결재무제표 총자산은?"
      choices: ["늘어난다", "줄어든다", "변하지 않는다", "신설회사 공정가치만큼 늘어난다"]
      answer: 2
      explain: "신설회사는 100% 종속기업이라 연결 실체 안에서 옮겨간 것일 뿐이다."

- id: share_exchange
  title: 주식교환·이전(완전자회사 만들기)
  tags: [share_exchange]
  summary: "주식교환·이전으로 다른 회사를 100% 자회사로 만드는 거래. 대상회사 주주는 현금 대신 모회사 주식을 받는다."
  why:
    - "상장 자회사를 100% 자회사로 편입해 중복상장 해소"
    - "지주회사 설립(주식이전)"
    - "소수주주를 정리해 의사결정을 단순화"
  accounting:
    - "새로 지배력을 얻으면 K-IFRS 1103 사업결합(모회사가 발행한 주식이 이전대가)"
    - "이미 지배하던 상장 자회사의 나머지 지분을 가져오는 경우는 비지배지분 취득이라 자본거래(영업권 추가 인식 없음)"
  tax:
    - "주식의 포괄적 교환·이전 과세특례(조세특례제한법 제38조): 요건을 채우면 대상회사 주주의 양도차익 과세를 미룬다"
    - "교환비율이 불공정하면 증여세·부당행위계산 부인 쟁점"
  law:
    - "상법 제360조의2(포괄적 주식교환), 제360조의15(포괄적 주식이전). 반대주주 주식매수청구권"
    - "소규모 주식교환(완전모회사가 내주는 주식이 발행주식총수의 10% 이하 등)은 이사회 승인으로 갈음(상법 제360조의10)"
  numbers:
    - "교환비율과 산출근거"
    - "새로 발행하는 모회사 주식이 기존 주식의 몇 %인지"
    - "주식매수청구가격"
  questions:
    - "자회사 소액주주는 이 교환비율에 동의할 이유가 있을까?"
    - "1103이 적용되는 거래인가, 비지배지분 취득인가?"
  quiz:
    - q: "이미 지배하는 상장 자회사의 나머지 지분을 주식교환으로 가져올 때 연결재무제표 처리로 맞는 것은?"
      choices: ["영업권 추가 인식", "자본거래로 처리", "처분손익 인식", "지분법 적용"]
      answer: 1
      explain: "지배력이 바뀌지 않는 지분 변동은 K-IFRS 1110상 자본거래다."

- id: stock_acquisition
  title: 타법인 주식 취득·경영권 인수
  tags: [stock_acq, stock_trf, control_change, ma]
  summary: "다른 회사 주식을 사서 지배권이나 영향력을 확보하는 거래. 국내 M&A에서 가장 흔한 형태다."
  why:
    - "신사업 진출 시간을 돈으로 사기"
    - "경쟁사·공급망 확보"
    - "경영권 프리미엄을 주고 시장 지위 확보"
  accounting:
    - "지분율이 아니라 실질 지배력으로 판단. 지배력(K-IFRS 1110)이면 연결과 1103 취득법(영업권, 비지배지분), 유의적 영향력(보통 20% 이상, K-IFRS 1028)이면 지분법, 나머지는 K-IFRS 1109 금융자산(FVPL 또는 FVOCI 선택)"
    - "단계적으로 사들여 지배력을 얻으면 기존 보유 지분을 취득일 공정가치로 다시 재고 손익 인식"
    - "경영권 프리미엄은 대부분 영업권으로 남고 매년 손상검사 대상이 된다"
  tax:
    - "비상장법인 주식을 사서 과점주주(지분 50% 초과)가 되면 그 법인이 가진 부동산 등에 대해 간주취득세(지방세법 제7조 제5항)"
    - "특수관계인 사이의 저가·고가 거래는 부당행위계산 부인과 증여세 쟁점"
    - "법인 주주가 받는 배당은 지분율에 따라 수입배당금 익금불산입(50% 이상 100%, 20% 이상 80%, 20% 미만 30%)"
  law:
    - "자산 또는 매출 3,000억원 이상 회사가 300억원 이상 회사의 주식을 20%(상장사 15%) 이상 취득하면 공정위 기업결합 신고(공정거래법 제11조). 거래금액 6,000억원 이상 기준도 있다"
    - "상장사 주식을 5% 이상 보유하게 되면 5일 안에 대량보유 보고(자본시장법 제147조)"
    - "일정 규모 이상의 타법인 주식 양수·양도는 주요사항보고서로 공시"
  numbers:
    - "취득금액이 우리 회사 자산·자기자본의 몇 %인지"
    - "취득 후 지분율(지배력을 얻는지)"
    - "대상회사 순자산 대비 얼마를 더 줬는지(영업권 크기 추정)"
    - "인수자금 조달 방법(보유 현금, 차입, 증자)"
  questions:
    - "이 지분율이면 연결, 지분법, 금융자산 중 무엇일까?"
    - "프리미엄을 너무 많이 줬다면 몇 년 뒤 어떤 회계 이벤트가 생길까?"
  quiz:
    - q: "다른 회사 지분 25%를 샀고 이사 선임권 같은 특별한 약정은 없다. 일반적인 회계처리는?"
      choices: ["연결", "지분법", "FVPL 금융자산", "원가법"]
      answer: 1
      explain: "20% 이상이면 유의적 영향력이 있는 것으로 본다(K-IFRS 1028)."
    - q: "법인 주주가 지분 50% 이상 가진 자회사에서 받은 배당의 익금불산입률은?"
      choices: ["30%", "80%", "90%", "100%"]
      answer: 3
      explain: "법인세법 제18조의2(2023년 개정). 20% 이상 50% 미만은 80%, 20% 미만은 30%."

- id: tender_offer
  title: 공개매수
  tags: [tender_offer, ma]
  summary: "불특정 다수 주주에게 기간·가격·수량을 미리 알리고 장외에서 주식을 사들이는 방법. 경영권 분쟁, 자진 상장폐지, 지주사 전환 때 자주 쓰인다."
  why:
    - "경영권 확보와 방어(지분 경쟁)"
    - "자진 상장폐지 전에 지분을 모으기"
    - "지주회사의 자회사 지분 요건 맞추기"
  accounting:
    - "취득 후 지분율과 지배력에 따라 연결·지분법·금융자산을 판단하는 것은 일반 지분 취득과 같다"
    - "지배력을 얻으면 공개매수 프리미엄은 영업권 쪽으로 반영된다"
  tax:
    - "응모는 장외 양도라 장내 매도와 세금 처리가 다를 수 있다. 대주주 여부, 증권거래세를 따로 확인"
  law:
    - "6개월 안에 장외에서 10인 이상으로부터 사들여 5% 이상 보유하게 되면 공개매수 의무(자본시장법 제133조)"
    - "공개매수 기간은 20일 이상 60일 이내, 공개매수신고서 제출"
    - "공개매수 기간 중에는 별도로 장외에서 사는 것이 제한된다"
  numbers:
    - "공개매수가격이 직전 주가보다 몇 % 높은지(프리미엄)"
    - "목표 수량과 지분율"
    - "총 소요 자금과 조달 방법"
  questions:
    - "프리미엄이 높을 때 소액주주는 응모해야 할까? 응모하지 않으면 어떤 위험이 남을까?"
    - "경영권 분쟁 중 회사의 자사주 매입은 왜 논란이 될까?"
  quiz:
    - q: "공개매수 의무가 생기는 기준으로 맞는 것은?"
      choices: ["6개월 안에 장외에서 10인 이상으로부터 사들여 5% 이상 보유", "1년 안에 장내에서 3% 이상 매수", "최대주주가 바뀌면 항상", "30% 이상 보유하면 항상"]
      answer: 0
      explain: "자본시장법 제133조 제3항."

- id: business_transfer
  title: 영업양수도
  tags: [business_acq, business_trf, asset_acq, asset_trf]
  summary: "회사 전체가 아니라 특정 사업(인력·설비·거래처 묶음)을 사고파는 거래."
  why:
    - "비핵심 사업을 정리하고 현금 확보"
    - "핵심 역량을 키울 사업 단위 인수"
    - "법인을 통째로 살 때보다 우발채무를 떠안을 위험이 작다"
  accounting:
    - "사들인 것이 '사업'이면 K-IFRS 1103 사업결합(영업권 인식 가능), 아니면 자산 집단 취득으로 원가를 상대적 공정가치로 나눈다(영업권 없음). 공정가치가 자산 하나에 몰려 있으면 집중테스트로 사업이 아니라고 간단히 판단할 수 있다"
    - "파는 회사는 처분손익 인식. 사업 단위 처분이 중단영업 요건을 채우면 손익계산서에 따로 표시(K-IFRS 1105)"
  tax:
    - "사업장별로 모든 권리·의무를 포괄승계하는 사업양도는 부가가치세법상 재화의 공급으로 보지 않는다(제10조 제9항 제2호). 양수자가 대리납부하면 과세 거래로 처리할 수도 있다"
    - "사업 양수 때 돈을 주고 산 영업권은 세법상 5년 정액 상각 가능"
    - "파는 회사의 양도차익은 법인세 과세"
  law:
    - "영업 전부 또는 중요한 일부 양도는 주주총회 특별결의와 반대주주 주식매수청구권(상법 제374조, 제374조의2)"
    - "상장사의 중요한 영업양수도는 외부평가 대상"
  numbers:
    - "양수·양도 가액"
    - "대상 사업의 자산·매출이 회사 전체에서 차지하는 비중"
    - "가액 ÷ 대상 사업 매출(매출의 몇 배에 사고파는지)"
  questions:
    - "이 거래는 사업결합인가, 자산 취득인가?"
    - "파는 회사 입장에서 중단영업으로 표시할 대상일까?"
  quiz:
    - q: "포괄적 사업양도는 부가가치세법에서 어떻게 취급될까?"
      choices: ["10% 과세", "영세율", "재화의 공급으로 보지 않음", "면세"]
      answer: 2
      explain: "부가가치세법 제10조 제9항 제2호."

- id: ipo
  title: IPO(기업공개)
  tags: [ipo]
  summary: "비상장 회사가 처음으로 주식을 공모하고 거래소에 상장하는 과정. 주관사 선정, 상장예비심사, 증권신고서, 수요예측, 공모가 확정, 청약·납입, 상장 순서로 진행된다."
  why:
    - "성장 자금 조달"
    - "기존 투자자(VC·PE)의 회수 창구"
    - "신뢰도·인재 채용, 주식을 M&A 대가로 쓸 수 있게 됨"
  accounting:
    - "신주 발행에 직접 든 비용은 자본(주식발행초과금)에서 차감, 구주매출 관련 비용은 당기비용. 둘이 섞이면 합리적으로 나눈다(K-IFRS 1032)"
    - "상장 전후 주식보상비용(K-IFRS 1102)이 크게 잡혀 영업이익이 일시적으로 줄어드는 경우가 많다"
    - "상장예정법인은 증권선물위원회가 감사인을 지정한다(외부감사법 제11조)"
  tax:
    - "구주매출로 주식을 판 기존 주주는 양도소득세 대상이 될 수 있다(대주주 여부, 거래 시점에 따라 다름)"
    - "최대주주 특수관계인이 증여받거나 취득한 주식이 5년 안에 상장돼 값이 오르면 그 이익에 증여세(상증법 제41조의3)"
  law:
    - "기관 수요예측 결과로 공모가를 확정. 2026년부터 기관 배정 물량의 40% 이상을 의무보유확약 기관에 우선 배정하고, 모자라면 주관사가 공모물량 1%를 6개월 보유"
    - "상장 첫날 가격 변동폭은 공모가의 60%~400%(2023년 6월부터)"
    - "상장폐지 요건도 강화되는 중: 시가총액 기준 코스피 300억원·코스닥 200억원(2026년 7월)에서 2027년 1월 코스피 500억원·코스닥 300억원으로 상향"
  numbers:
    - "공모가 희망밴드와 확정 공모가"
    - "공모 총액 중 구주매출 비중(회사로 들어오는 돈은 신주 몫뿐)"
    - "상장 후 예상 시가총액과 비교기업 PER, 할인율"
    - "유통 가능 물량과 의무보유확약 비율"
  questions:
    - "구주매출 비중이 높으면 투자자에게 어떤 신호일까?"
    - "비교기업 선정과 할인율은 적절한가?"
  quiz:
    - q: "상장 첫날 주가가 움직일 수 있는 범위(공모가 기준)는?"
      choices: ["±30%", "63%~260%", "60%~400%", "제한 없음"]
      answer: 2
      explain: "2023년 6월 26일부터 공모가의 60%~400%로 넓어졌다."
    - q: "IPO 때 신주 발행에 직접 들어간 수수료의 회계처리는?"
      choices: ["판매관리비", "영업외비용", "자본에서 차감", "무형자산"]
      answer: 2
      explain: "K-IFRS 1032. 구주매출 관련 비용은 당기비용이다."

- id: rights_offering
  title: 유상증자
  tags: [rights_offering, rights_bonus]
  summary: "새 주식을 발행해 돈을 받고 자본을 늘리는 것. 누구에게 배정하느냐에 따라 주주배정, 일반공모, 제3자배정으로 나뉜다."
  why:
    - "시설투자·인수 자금 마련"
    - "부채 상환과 재무구조 개선"
    - "전략적 투자자 유치(제3자배정)"
  accounting:
    - "액면 금액은 자본금, 초과분은 주식발행초과금. 직접 발행비용은 주식발행초과금에서 뺀다"
    - "액면에 못 미치게 발행하면 주식할인발행차금(자본조정)"
  tax:
    - "증자로 받은 돈은 자본거래라 익금이 아니다(주식발행초과금 익금불산입)"
    - "실권주를 특수관계인에게 싸게 다시 배정하는 등 불균등 증자로 이익을 본 주주에게 증여세(상증법 제39조), 법인 주주면 부당행위계산 부인"
  law:
    - "발행가 할인 한도: 일반공모 30%, 제3자배정 10% 이내(증권의 발행 및 공시 등에 관한 규정). 주주배정은 자율"
    - "제3자배정은 정관 근거와 신기술 도입·재무구조 개선 같은 경영상 목적이 필요(상법 제418조 제2항)"
    - "주주배정 증자는 신주인수권증서를 상장해 권리를 사고팔 수 있다"
  numbers:
    - "증자 금액이 시가총액·자기자본의 몇 %인지"
    - "신주 수 ÷ 기존 발행주식 수(희석률)"
    - "자금 용도 비중(운영자금·채무상환 비중이 크면 시장 반응이 나쁜 편)"
  questions:
    - "회사가 차입 대신 증자를 고른 이유는?(부채비율, 이자 부담, 주가 수준)"
    - "주가가 높을 때 증자하는 이유를 신호이론으로 설명하면?"
  quiz:
    - q: "일반공모 유상증자의 발행가 할인율 상한은?"
      choices: ["10%", "20%", "30%", "40%"]
      answer: 2
      explain: "제3자배정은 10%, 주주배정은 자율이다."
    - q: "유상증자로 생긴 주식발행초과금의 법인세법상 처리는?"
      choices: ["익금산입", "익금불산입", "손금산입", "과세이연"]
      answer: 1
      explain: "자본거래로 생긴 수익은 익금에 넣지 않는다(법인세법 제17조)."

- id: bonus_issue
  title: 무상증자
  tags: [bonus_issue, rights_bonus]
  summary: "자본잉여금이나 이익준비금을 자본금으로 옮기면서 주주에게 주식을 무상으로 나눠 주는 것."
  why:
    - "유통주식 수를 늘려 거래 활성화"
    - "주가 단위를 낮추는 효과"
    - "재무 여력을 보여주는 신호(실제 기업가치는 그대로)"
  accounting:
    - "잉여금이 자본금으로 옮겨갈 뿐이라 자본총계는 그대로(상법 제461조)"
    - "권리락으로 주가가 조정되고, 주당 지표(EPS 등)는 소급해서 다시 계산"
  tax:
    - "잉여금 자본전입으로 받은 무상주는 원칙적으로 의제배당. 다만 주식발행초과금 등 일정한 자본잉여금 전입분은 제외"
    - "자기주식이 있는 상태에서 자본잉여금을 전입해 자기주식 몫이 다른 주주에게 돌아가면 그 늘어난 부분은 의제배당"
  law:
    - "이사회 결의로 할 수 있다(정관에 주주총회 결의로 정한 경우 제외)"
  numbers:
    - "1주당 배정 주식 수"
    - "전입 재원(어떤 잉여금을 쓰는지)"
    - "권리락 후 주가와 거래량 변화"
  questions:
    - "무상증자는 주주가치를 늘리지 않는데 왜 주가가 오르곤 할까?"
  quiz:
    - q: "무상증자 뒤 회사의 자본총계는?"
      choices: ["늘어난다", "줄어든다", "변하지 않는다", "자본금만큼 늘어난다"]
      answer: 2
      explain: "자본 항목 사이에서 옮겨간 것뿐이다."

- id: capital_reduction
  title: 감자
  tags: [capital_reduction]
  summary: "자본금을 줄이는 것. 주주에게 돈을 돌려주면 유상감자, 결손을 메우려고 장부상으로 줄이면 무상감자."
  why:
    - "쌓인 결손을 털어내고 자본잠식에서 벗어나기(무상감자)"
    - "남는 자본 돌려주기(유상감자, 사모펀드의 회수 수단으로도 쓰인다)"
    - "무상감자 뒤 유상증자로 재무구조 재편"
  accounting:
    - "무상감자: 줄어든 자본금으로 결손을 메우고, 남으면 감자차익(자본잉여금)"
    - "유상감자: 돌려준 돈이 액면보다 크면 감자차손"
  tax:
    - "감자차익은 익금불산입"
    - "주주가 받은 감자대가가 주식 취득가액을 넘으면 의제배당"
    - "특정 주주만 감자하는 불균등 감자로 대주주가 이익을 보면 증여세(상증법 제39조의2)"
  law:
    - "주주총회 특별결의와 채권자 보호절차(상법 제438조, 제439조). 결손 보전 목적 감자는 보통결의이고 채권자 보호절차도 생략"
    - "상장사는 반기 기준 완전자본잠식도 상장폐지 사유로 강화(2026년 6월 이후 도래하는 반기말부터)"
  numbers:
    - "감자비율"
    - "감자 전후 자본금"
    - "자본잠식률"
  questions:
    - "무상감자 공시 뒤 주가가 떨어지는 이유는? 기업가치가 바뀐 걸까?"
  quiz:
    - q: "결손 보전을 위한 감자에 필요한 주주총회 결의는?"
      choices: ["특별결의", "보통결의", "이사회 결의만", "총주주 동의"]
      answer: 1
      explain: "상법 제438조 제2항. 채권자 보호절차도 생략된다."

- id: treasury_stock
  title: 자기주식(취득·처분·소각)
  tags: [treasury_buy, treasury_trust, treasury_sell, treasury_cancel, capital]
  summary: "회사가 자기 회사 주식을 사들이는 것. 소각하면 유통주식이 줄어 주당 가치가 오르고, 다시 팔면 그 효과가 사라진다."
  why:
    - "주주환원(배당 대신 또는 배당과 함께)"
    - "주가가 싸다는 신호"
    - "임직원 보상 재원"
    - "(예전에는) 경영권 방어나 인적분할 때 지배력 강화에 쓰였지만 지금은 규제로 크게 막혔다"
  accounting:
    - "취득원가로 자본에서 뺀다(자본조정). 처분손익은 당기손익이 아니라 자본(처분이익은 자본잉여금, 처분손실은 자본조정)"
    - "소각은 자본금을 줄이는 감자 방식이나 이익잉여금을 줄이는 이익소각으로 처리"
  tax:
    - "법인세법은 자기주식을 자산으로 봐서 처분이익을 익금에 넣는다(회계와 달라 세무조정)"
    - "소각할 목적으로 사서 소각하면 자본거래라 손익이 없다"
    - "주주: 장내에서 팔면 양도소득, 회사가 감자 방식으로 사서 소각하면 의제배당 쟁점"
  law:
    - "배당가능이익 범위에서 취득(상법 제341조, 상장사는 자본시장법 제165조의3)"
    - "2026년 3월 6일 시행 3차 상법 개정: 취득한 자기주식은 원칙적으로 1년 안에 소각, 임직원 보상 등으로 보유·처분하려면 주주총회 승인. 기존 보유분은 유예기간 뒤 같은 규칙, 위반하면 과태료"
  numbers:
    - "취득 예정 금액이 시가총액·자기자본의 몇 %인지"
    - "취득 뒤 자사주 비율"
    - "소각 목적인지(소각 여부가 핵심)"
    - "직접 취득인지 신탁계약인지"
  questions:
    - "소각하지 않는 자사주 매입은 왜 주주환원으로 덜 인정받을까?"
    - "자기주식 처분이익의 회계·세법 차이를 세무조정으로 써보면?"
  quiz:
    - q: "3차 상법 개정(2026년 3월 시행) 뒤 회사가 취득한 자기주식의 원칙적인 처리는?"
      choices: ["자유롭게 보유", "1년 안에 소각", "3년 안에 처분", "5년 안에 소각"]
      answer: 1
      explain: "보유·처분하려면 주주총회 승인이 필요하다."
    - q: "K-IFRS에서 자기주식 처분이익은 어디에 반영될까?"
      choices: ["영업외수익", "기타포괄손익", "자본잉여금", "이익잉여금"]
      answer: 2
      explain: "자기 지분상품 거래는 손익으로 인식하지 않는다(K-IFRS 1032). 법인세법은 익금으로 본다."

- id: mezzanine
  title: 전환사채(CB)·신주인수권부사채(BW)·교환사채(EB)
  tags: [cb, bw, eb]
  summary: "사채에 주식으로 바꿀 권리(CB), 새 주식을 살 권리(BW), 회사가 가진 주식과 바꿀 권리(EB)를 붙여 낮은 금리로 돈을 빌리는 방법."
  why:
    - "낮은 이자로 자금 조달(표면이자 0%도 흔하다)"
    - "신용도가 낮아 일반 회사채 발행이 어려울 때"
    - "EB는 가진 자사주나 계열사 주식을 활용한 조달"
  accounting:
    - "전환권이 '확정 금액 대 확정 수량' 조건을 채우면 부채와 자본(전환권대가)으로 나눈다(K-IFRS 1032 복합금융상품)"
    - "주가가 떨어지면 전환가액을 낮추는 리픽싱 조건 등으로 전환 수량이 바뀌면 이 조건을 못 채워 파생상품부채로 분류하고 매 결산 공정가치로 평가한다. 주가가 오르면 평가손실이 커져 순이익이 줄어드는 착시가 생긴다"
    - "만기보장수익률이 표면이자율보다 높으면 상환할증금을 부채에 반영하고 유효이자율법으로 이자비용 인식"
  tax:
    - "세법은 전환권대가를 인정하지 않는다. 발행 때 전환권조정 손금산입(△유보)·전환권대가 익금산입(기타), 이후 전환권조정 상각액(이자비용)은 손금불산입(유보)으로 맞춘다"
    - "특수관계인이 CB를 싸게 인수·전환해 이익을 얻으면 증여세(상증법 제40조)"
  law:
    - "사모 CB의 리픽싱 하한은 최초 전환가액의 70%, 주가가 다시 오르면 상향 조정해야 한다(증권의 발행 및 공시 등에 관한 규정)"
    - "최대주주의 콜옵션 행사 한도 공시 등 2021~2022년에 규제가 강화됐다"
  numbers:
    - "발행액이 시가총액·자기자본의 몇 %인지"
    - "전환되면 늘어나는 주식이 기존 주식의 몇 %인지(잠재 희석)"
    - "표면이자율·만기이자율"
    - "최저 조정가액(리픽싱 하한)"
    - "사모인지 공모인지"
  questions:
    - "표면이자 0% CB를 사는 투자자는 무엇을 기대할까?"
    - "리픽싱 조건이 있으면 왜 부채로 분류될까?"
  quiz:
    - q: "사모 전환사채의 시가 하락에 따른 전환가액 조정(리픽싱) 하한은 원칙적으로 최초 전환가액의 몇 %일까?"
      choices: ["50%", "60%", "70%", "80%"]
      answer: 2
      explain: "증권의 발행 및 공시 등에 관한 규정."
    - q: "세법상 CB 전환권조정 상각액(회계상 이자비용)의 세무조정은?"
      choices: ["손금산입(△유보)", "손금불산입(유보)", "익금산입(기타)", "조정 없음"]
      answer: 1
      explain: "발행 때 전환권조정을 손금산입(△유보)했으므로 상각할 때 손금불산입(유보)으로 되돌린다."

- id: earnings
  title: 실적 공시 읽는 법
  tags: [earnings]
  summary: "분기마다 나오는 잠정실적과 실적 변동 공시는 숫자 감각을 기르기 가장 좋은 교재다."
  why:
    - "시장 기대(컨센서스) 대비 서프라이즈·쇼크 확인"
    - "매출 증가율과 영업이익 증가율 차이로 영업레버리지 이해"
    - "일회성 요인(손상차손, 처분이익) 걸러내기"
  accounting:
    - "수익 인식 5단계(K-IFRS 1115): 계약 식별, 수행의무 식별, 거래가격 산정, 거래가격 배분, 수익 인식"
    - "잠정실적은 감사(검토) 전 숫자라 확정치와 다를 수 있다"
    - "연결과 별도 숫자 차이가 크면 자회사 실적의 영향"
  tax:
    - "회계이익과 과세소득의 차이는 유효세율로 드러난다. 법정세율과 크게 다르면 세액공제, 비과세 소득, 이연법인세 인식 변화 등을 의심해볼 것"
  law:
    - "매출액 또는 손익구조가 직전 연도보다 30%(대규모법인은 15%) 이상 바뀌면 공시 의무(거래소 공시규정)"
    - "잠정실적은 공정공시로 낸다"
  numbers:
    - "매출·영업이익 증가율(전년 동기 대비)"
    - "영업이익률 변화"
    - "영업이익과 순이익 차이(영업외 손익)"
    - "분기 실적 × 4로 연간 규모 가늠"
  questions:
    - "매출은 10% 늘었는데 영업이익은 50% 늘었다면 이유는?(고정비 비중)"
    - "영업이익은 흑자인데 순이익이 적자라면 무엇을 봐야 할까?"
  quiz:
    - q: "유가증권시장 대규모법인(자산 2조원 이상)의 매출액·손익구조 변동 공시 기준은?"
      choices: ["5%", "10%", "15%", "30%"]
      answer: 2
      explain: "일반 법인은 30%."
    - q: "K-IFRS 1115 수익 인식 5단계 순서로 맞는 것은?"
      choices: ["계약 식별 → 수행의무 식별 → 거래가격 산정 → 배분 → 수익 인식", "거래가격 → 계약 → 수행의무 → 인식 → 배분", "수행의무 → 계약 → 배분 → 거래가격 → 인식", "계약 → 거래가격 → 인식 → 수행의무 → 배분"]
      answer: 0
      explain: "1115의 기본 구조다."

- id: contract
  title: 수주·공급계약 공시
  tags: [contract]
  summary: "단일판매·공급계약 공시는 앞으로 매출이 될 일감이다. 계약금액을 최근 매출과 비교하는 습관이 핵심."
  why:
    - "수주 산업(조선·건설·방산·장비)의 앞으로의 매출 가늠"
    - "고객 집중도와 계약 기간 확인"
  accounting:
    - "기간에 걸쳐 수익을 인식하는 계약(조선·건설)은 진행률로 매출 인식, 손실이 예상되면 손실충당부채"
    - "수주잔고는 재무제표 본문에 없고 주석의 잔여 수행의무로 확인"
  tax:
    - "건설·제조 등 장기 도급계약은 세법도 원칙적으로 작업진행률 기준(법인세법 시행령 제69조)"
  law:
    - "최근 매출액 대비 일정 비율 이상 계약은 거래소 수시공시 대상"
  numbers:
    - "계약금액 ÷ 최근 연 매출(몇 %짜리 계약인지)"
    - "계약 기간(연평균 매출 기여 = 계약금액 ÷ 기간)"
    - "계약 상대방(국내·해외, 관계사 여부)"
  questions:
    - "매출의 30%짜리 계약을 3년에 나눠 인식하면 연 매출 기여는?"
  quiz:
