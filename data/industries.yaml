# 업종별 대표 기업 목록
# - 규모 지도(scale), 오늘의 기업(daily), 업계 1위 비교에 쓰인다.
# - code는 6자리 종목코드. 이름은 표시용이고 실제 조회는 종목코드로 DART 고유번호를 찾아서 한다.
# - profile: 그 업종이 돈을 버는 구조(오늘의 기업에서 같이 보여준다)
# - theories: 그 업종을 이해할 때 쓰는 이론 카드(data/knowledge/theories)
# - financial: true 인 업종은 DART 재무 API가 금융업을 다루지 않는 경우가 있어 숫자가 비어 나올 수 있다.
# - 관심 업종·기업을 자유롭게 더하거나 빼도 된다.

